/* ── 도형 계산 ── */
function shapeFromGeo(type, geo){
  return type === 'circle' ? {circle:true, lat:geo.lat, lng:geo.lng, r:geo.r} : {circle:false, pts:geo.path};
}
function inShape(sh, lat, lng){
  if(sh.circle) return distanceMeters(new kakao.maps.LatLng(sh.lat, sh.lng), new kakao.maps.LatLng(lat, lng)) <= sh.r;
  const p = sh.pts; let inside = false;
  for(let i = 0, j = p.length - 1; i < p.length; j = i++){
    const yi = p[i][0], xi = p[i][1], yj = p[j][0], xj = p[j][1];
    if(((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
/* 구역 경계까지의 거리(m): 안이면 0 */
function distToShapeM(sh, lat, lng){
  if(sh.circle) return Math.max(0, distanceMeters(new kakao.maps.LatLng(sh.lat, sh.lng), new kakao.maps.LatLng(lat, lng)) - sh.r);
  if(inShape(sh, lat, lng)) return 0;
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
  let best = Infinity; const p = sh.pts;
  for(let i = 0, j = p.length - 1; i < p.length; j = i++){
    const ax = (p[j][1] - lng) * kx, ay = (p[j][0] - lat) * ky, bx = (p[i][1] - lng) * kx, by = (p[i][0] - lat) * ky;
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    let t = L ? -(ax * dx + ay * dy) / L : 0; t = Math.max(0, Math.min(1, t));
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}
function shapeBBox(sh){
  if(sh.circle){ const dl = sh.r / 110540, dg = sh.r / (111320 * Math.cos(sh.lat * Math.PI / 180)); return [sh.lat - dl, sh.lat + dl, sh.lng - dg, sh.lng + dg]; }
  let a = 90, b = -90, c = 180, d = -180;
  sh.pts.forEach(q=>{ a = Math.min(a, q[0]); b = Math.max(b, q[0]); c = Math.min(c, q[1]); d = Math.max(d, q[1]); });
  return [a, b, c, d];
}
function samplePoints(sh){
  const pts = [];
  if(sh.circle){
    pts.push([sh.lat, sh.lng]);
    const dLat = sh.r * 0.9 / 111000, dLng = sh.r * 0.9 / (111000 * Math.cos(sh.lat * Math.PI / 180));
    for(let k = 0; k < 8; k++){ const a = k * Math.PI / 4; pts.push([sh.lat + dLat * Math.sin(a), sh.lng + dLng * Math.cos(a)]); }
    return pts;
  }
  let a = 90, b = -90, c = 180, d = -180;
  sh.pts.forEach(p=>{ a = Math.min(a, p[0]); b = Math.max(b, p[0]); c = Math.min(c, p[1]); d = Math.max(d, p[1]); });
  const step = Math.max(1, Math.ceil(sh.pts.length / 10));
  for(let i = 0; i < sh.pts.length; i += step) pts.push(sh.pts[i]);
  for(let i = 0; i < 4; i++) for(let j = 0; j < 4; j++){
    const la = a + (b - a) * (i + 0.5) / 4, lo = c + (d - c) * (j + 0.5) / 4;
    if(inShape(sh, la, lo)) pts.push([la, lo]);
  }
  return pts;
}

/* ── 지역(시도·시군구) 판별과 단지 후보 ── */
const SIDO_ALIAS = [['서울','서울'],['부산','부산'],['대구','대구'],['인천','인천'],['광주','광주'],['대전','대전'],['울산','울산'],['세종','세종'],['경기','경기'],['강원','강원'],
  ['충청북도','충북'],['충북','충북'],['충청남도','충남'],['충남','충남'],['전라북도','전북'],['전북','전북'],['전라남도','전남'],['전남','전남'],
  ['경상북도','경북'],['경북','경북'],['경상남도','경남'],['경남','경남'],['제주','제주']];
function sidoKeys(s){
  s = (s || '').trim();
  if(/^전남광주/.test(s)) return ['광주','전남'];          // 원본에 통합 표기가 그대로 있다
  for(const a of SIDO_ALIAS) if(s.startsWith(a[0])) return [a[1]];
  return [s.slice(0, 2)];
}
const nzGu = s => (s || '').replace(/\s/g, '').replace(/시/g, '');
function regionMatch(r, a){
  if(!sidoKeys(r.s1).some(k => sidoKeys(a[5]).indexOf(k) >= 0)) return false;
  if(!r.s2) return true;                                      // 세종처럼 시군구가 없는 곳
  const x = nzGu(r.s2), y = nzGu(a[6]);
  return !y || x === y || x.endsWith(y) || y.endsWith(x);
}
function regionsOf(sh){
  if(!geocoder) geocoder = new kakao.maps.services.Geocoder();
  const seen = {}, pts = samplePoints(sh).filter(p=>{ const k = p[0].toFixed(3) + ',' + p[1].toFixed(3); return seen[k] ? false : (seen[k] = true); }).slice(0, 30);
  return Promise.all(pts.map(p => new Promise(res => {
    try{ geocoder.coord2RegionCode(p[1], p[0], function(r, st){
      if(st !== kakao.maps.services.Status.OK || !r || !r.length){ res(null); return; }
      const x = r.find(q=>q.region_type === 'B') || r[0];
      res({s1:x.region_1depth_name, s2:x.region_2depth_name});
    }); }catch(e){ res(null); }
  }))).then(list => {
    const u = {}; list.forEach(x=>{ if(x) u[x.s1 + '|' + x.s2] = x; }); return Object.keys(u).map(k=>u[k]);
  });
}
function geocodeApt(a){
  return new Promise(res => {
    if(a[0] in _aptPos){ res(_aptPos[a[0]]); return; }
    try{ geocoder.addressSearch(a[4], function(r, st){
      const v = (st === kakao.maps.services.Status.OK && r && r[0]) ? [Number(r[0].y), Number(r[0].x)] : null;
      _aptPos[a[0]] = v; res(v);
    }); }catch(e){ _aptPos[a[0]] = null; res(null); }
  });
}
async function geocodeAll(list, onProg){
  let i = 0, done = 0;
  const worker = async () => { while(i < list.length){ const a = list[i++]; await geocodeApt(a); onProg(++done, list.length); } };
  await Promise.all(Array.from({length:8}, worker));
}

/* ── 분석 실행과 결과 표시 ── */
let _anSeq = 0;
let _bldAptOnly = false, _lastAn = null;
function toggleAptOnly(){ _bldAptOnly = !_bldAptOnly; if(_lastAn) analyzeShape(_lastAn.sh, _lastAn.name); }
const NEAR_M = 1000;
let _anPending = null;
function offerAnalysis(getShape, name){
  _anSeq++; _anPending = {getShape:getShape, name:name};
  anShow('<h4><span>📊 상권분석</span><span class="x" onclick="anClose()" title="닫기">✕</span></h4>' +
    '<div>' + esc(name) + '의 <b>세대수·학교 학생수</b>를 분석할까요?</div>' +
    '<div class="btns"><button class="tool-btn" onclick="runPendingAnalysis()">📊 분석하기</button><button class="tool-btn" onclick="anClose()">나중에</button></div>' +
    '<div class="note">꼭짓점을 더 다듬은 뒤 눌러도 됩니다. 저장된 구역은 클릭하면 언제든 분석할 수 있습니다.</div>');
}
function runPendingAnalysis(){
  const p = _anPending; if(!p) return;
  let sh = null; try{ sh = p.getShape(); }catch(e){ console.error(e); }
  if(!sh){ anShow('<span class="warn">구역 모양을 읽지 못했습니다. 다시 그려 주세요.</span>'); return; }
  analyzeShape(sh, p.name);
}
function offerDraftAnalysis(){
  if(!draft) return;
  offerAnalysis(function(){ const c = currentTerrShape(); return c && c.sh; }, (selCenter ? selCenter.name + ' ' : '') + '그린 구역');
}
function anClose(){ _anSeq++; document.getElementById('anBox').style.display = 'none'; }
function anShow(html){ const b = document.getElementById('anBox'); b.innerHTML = html; b.style.display = 'block'; }
function currentTerrShape(){
  if(draft){ const g = draftToGeo(); return {sh:shapeFromGeo(g.type, g.geo), name:(selCenter ? selCenter.name : '그린 도형') + ' (수정 중)'}; }
  const t = selCenter && territories[selCenter.code];
  return t ? {sh:shapeFromGeo(t.type, t.geo), name:t.name || selCenter.code} : null;
}
function analyzeCurrent(){
  let c = null;
  try{ c = currentTerrShape(); }catch(e){ console.error(e); }
  if(!c){ terrMsg('분석할 영업구역이 없습니다. 먼저 구역을 그리거나 저장해 주세요.'); return; }
  analyzeShape(c.sh, c.name);
}
async function analyzeShape(sh, name){
  const seq = ++_anSeq;
  const head = '<h4><span>📊 ' + esc(name) + '</span><span class="x" onclick="anClose()" title="닫기">✕</span></h4>';
  anShow(head + '데이터를 불러오는 중…');
  try{
    const g = await loadGeo();
    // 학교
    const bb = shapeBBox(sh), pad = 0.013;
    const sc = [], nearSc = [];
    g.schools.forEach(s => {
      if(s[2] < bb[0] - pad || s[2] > bb[1] + pad || s[3] < bb[2] - pad || s[3] > bb[3] + pad) return;
      const d = distToShapeM(sh, s[2], s[3]);
      if(d === 0) sc.push(s); else if(d <= NEAR_M) nearSc.push({s:s, d:d});
    });
    nearSc.sort((x, y) => x.d - y.d);
    const sum = l => sc.filter(s=>s[1] === l).reduce((t, s)=>t + (s[4] || 0), 0);
    const lst = l => sc.filter(s=>s[1] === l);
    // 동(건물) 단위 세대수
    anShow(head + '동별 세대수를 불러오는 중…');
    const files = await loadBld(g, bb);
    if(seq !== _anSeq) return;
    const bl = {};   // 단지명 -> {hh, n, est}
    let bHH = 0, bN = 0, bEst = 0, aptAll = 0, othAll = 0;
    _lastAn = {sh:sh, name:name};
    files.forEach(f => {
      const arr = f.b;
      let lo = 0, hi = arr.length, t = Math.round(bb[0] * 1e5);
      while(lo < hi){ const m = (lo + hi) >> 1; if(arr[m][0] < t) lo = m + 1; else hi = m; }
      const tMax = bb[1] * 1e5, gMin = bb[2] * 1e5, gMax = bb[3] * 1e5;
      for(let i = lo; i < arr.length && arr[i][0] <= tMax; i++){
        const r = arr[i];
        if(r[1] < gMin || r[1] > gMax || !inShape(sh, r[0] / 1e5, r[1] / 1e5)) continue;
        if(r[5]) aptAll += r[2]; else othAll += r[2];
        if(_bldAptOnly && !r[5]) continue;
        const k = f.n[r[3]] || '(이름 없음)';
        const o = bl[k] || (bl[k] = {hh:0, n:0, est:0});
        o.hh += r[2]; o.n++; if(r[4]) o.est += r[2];
        bHH += r[2]; bN++; if(r[4]) bEst += r[2];
      }
    });
    const bList = Object.keys(bl).map(k => ({name:k, hh:bl[k].hh, n:bl[k].n, est:bl[k].est})).sort((x, y) => y.hh - x.hh);
    // 단지(동 정보가 없는 곳만 따로 남겨 둔 K-apt)
    anShow(head + '구역이 걸친 지역을 확인하는 중…');
    const regs = await regionsOf(sh);
    if(seq !== _anSeq) return;
    const cands = g.apts.filter(a => regs.some(r => regionMatch(r, a)));
    const need = cands.filter(a => !(a[0] in _aptPos));
    if(need.length){
      await geocodeAll(need, (d, n) => { if(seq === _anSeq && (d % 10 === 0 || d === n)) anShow(head + '단지 위치 확인 중… ' + d + ' / ' + n + '<br><span class="note">처음 한 번만 걸리고, 같은 지역은 다음부터 빠릅니다.</span>'); });
    }
    if(seq !== _anSeq) return;
    const inside = [], unres = [];
    cands.forEach(a => { const p = _aptPos[a[0]]; if(!p) unres.push(a); else if(inShape(sh, p[0], p[1])) inside.push(a); });
    inside.sort((a, b) => b[2] - a[2]);
    const hh = inside.reduce((t, a)=>t + a[2], 0), dg = inside.reduce((t, a)=>t + a[3], 0);
    const noDong = inside.filter(a=>!a[3]).length;
    const li = (arr, f) => !arr.length ? '' : '<details class="an-more"><summary>더보기 (' + arr.length + ')</summary>' + arr.slice(0, 12).map(f).join('') + (arr.length > 12 ? '<div class="note">… 외 ' + (arr.length - 12) + '곳</div>' : '') + '</details>';
    const schLine = (l, label) => {
      const a = lst(l), nc = a.filter(s=>s[4] == null).length;
      const nr = nearSc.filter(x => x.s[1] === l), nrSum = nr.reduce((t, x)=>t + (x.s[4] || 0), 0);
      return '<div class="sec"><b>' + label + '</b> 구역 안 ' + a.length + '곳' + (a.length ? ' · <span class="big">' + fmtN(sum(l)) + '명</span>' : '') + (nc ? ' <span class="warn">(학생수 미확인 ' + nc + '곳 제외)</span>' : '') +
        li(a, s => '<div class="li"><span>' + esc(s[0]) + '</span><span>' + (s[4] == null ? '?' : fmtN(s[4]) + '명') + '</span></div>') +
        '<div style="margin-top:6px;color:#4b5563"><b>구역 밖 1km 이내</b> ' + nr.length + '곳' + (nr.length ? ' · ' + fmtN(nrSum) + '명' : '') + '</div>' +
        li(nr, x => '<div class="li" style="color:#6b7280"><span>' + esc(x.s[0]) + ' <span class="note">(' + fmtN(Math.round(x.d / 10) * 10) + 'm)</span></span><span>' + (x.s[4] == null ? '?' : fmtN(x.s[4]) + '명') + '</span></div>') + '</div>';
    };
    const m = g.meta || {};
    anShow(head +
      '<div><b>세대수 합계</b> <span class="big">' + fmtN(bHH + hh) + '세대</span></div>' +
      '<div class="sec"><b>① 동 단위(건물별 실제 세대수)</b> ' + fmtN(bHH) + '세대 · ' + fmtN(bN) + '개 동' + (bEst ? ' <span class="note">(이 중 ' + fmtN(bEst) + '세대는 같은 번지 안에서 균등 배분한 추정)</span>' : '') + '</div>' +
      '<div class="note">아파트 확정 ' + fmtN(aptAll) + '세대 · 그 외 공동주택 후보(연립·다세대 등) ' + fmtN(othAll) + '세대 ' +
        '<button class="tool-btn" style="padding:1px 6px;font-size:11px" onclick="toggleAptOnly()">' + (_bldAptOnly ? '전체 후보 보기' : '아파트만 보기') + '</button>' + (_bldAptOnly ? ' <span class="warn">(지금은 아파트 확정만 합산)</span>' : '') + '</div>' +
      li(bList, x => '<div class="li"><span>' + esc(x.name) + '</span><span>' + fmtN(x.hh) + '세대 / ' + x.n + '개 동' + (x.est ? ' · 추정 포함' : '') + '</span></div>') +
      (files.length ? '' : '<div class="note warn">동 단위 데이터를 불러오지 못했거나 이 지역에 없습니다.</div>') +
      '<div class="sec"><b>② 단지 기준(동 정보를 못 찾은 단지)</b> ' + fmtN(hh) + '세대 · 단지 ' + inside.length + '곳' + (dg ? ' · ' + dg + '동' : '') + (dg ? ' (평균 ' + (hh / dg).toFixed(1) + '세대/동)' : '') + '</div>' +
      li(inside, a => '<div class="li"><span>' + esc(a[1]) + '</span><span>' + fmtN(a[2]) + '세대 / ' + (a[3] ? a[3] + '동' : '동수 미상') + (a[3] ? ' · 평균 ' + (a[2] / a[3]).toFixed(1) : '') + '</span></div>') +
      (unres.length ? '<div class="note warn">위치를 찾지 못한 단지 ' + unres.length + '곳은 계산에서 빠졌습니다.</div>' : '') +
      (noDong ? '<div class="note warn">동수 정보가 없는 단지 ' + noDong + '곳 포함</div>' : '') +
      schLine('e', '초등학교') + schLine('m', '중학교') +
      '<details class="an-more an-notes"><summary>📌 계산 기준·유의사항 더보기</summary><div class="note">※ ①은 건물 대표 위치가 구역 안이면 그 동의 실제 세대수를 합산합니다(일부 동만 걸치면 그 동만 포함). ②는 단지 대표 위치가 구역 안이면 단지 전체를 합산하므로, 일부 동만 포함된 경우 단지 평균 세대수 × 포함 동 수로 직접 확인하세요.<br>' +
      '※ ①은 \'공동주택 후보\' 건물과 건축물대장 표제부를 번지·동 이름으로 이은 값이라 아파트가 아닌 연립·다세대가 섞일 수 있고, 건물 위치를 못 찾은 세대는 ②로 보완합니다. 실거주 세대수와는 다를 수 있습니다.<br>' +
      '※ 학생수는 학교에 다니는 재학생 수이며, 구역에 거주하는 학생수가 아닙니다. 1km 이내 학교는 구역 경계에서 직선거리 기준이고 합계에 넣지 않았습니다.<br>' +
      '※ 기준: 건축HUB 표제부·브이월드 GIS건물통합정보(' + esc((g.bmeta && g.bmeta.asof) || '') + ') · K-apt 관리비공개단지(' + esc(m.apt || '') + ' 추출, 소규모 공동주택 제외) · 학교 위치(' + esc(m.school || '') + ') · 학생수(' + esc(m.students || '') + ')</div></details>');
  }catch(e){
    console.error(e);
    if(seq === _anSeq) anShow(head + '<span class="warn">분석 실패: ' + esc(e.message) + '</span>');
  }
}

/* ── 개설 관리에서 넘어온 경우(?goto=1&name&addr&lat&lng&pf): 그 주소로 이동하고 영업지역 등록을 안내 ── */
function handleGoto(){
  const q = new URLSearchParams(location.search);
  if(q.get('goto') !== '1') return;
  const g = { name:q.get('name')||'', addr:q.get('addr')||'', pf:q.get('pf')||'학원', lat:parseFloat(q.get('lat')), lng:parseFloat(q.get('lng')) };
  const arrive = function(lat, lng){
    g.lat = lat; g.lng = lng;
    map.jump(new kakao.maps.LatLng(lat, lng), 3, {animate:true});
    placeSearchMarker(lat, lng);
    showGotoBanner(g, '');
  };
  if(isFinite(g.lat) && isFinite(g.lng)) return arrive(g.lat, g.lng);
  if(!g.addr){ showGotoBanner(g, '주소가 없어 위치를 찾지 못했습니다. 위쪽 검색창에서 직접 찾아 주세요.'); return; }
  const st = kakao.maps.services.Status.OK;
  new kakao.maps.services.Geocoder().addressSearch(g.addr, function(r, s){
    if(s === st && r.length) return arrive(parseFloat(r[0].y), parseFloat(r[0].x));
    ensurePlacesService().keywordSearch(g.addr, function(r2, s2){
      if(s2 === st && r2.length) arrive(parseFloat(r2[0].y), parseFloat(r2[0].x));
      else showGotoBanner(g, '주소 "'+g.addr+'" 위치를 찾지 못했습니다. 위쪽 검색창에서 직접 찾아 주세요.');
    });
  });
}
function showGotoBanner(g, err){
  const old = document.getElementById('gotoBanner'); if(old) old.remove();
  const el = document.createElement('div'); el.id = 'gotoBanner'; el.className = 'goto-banner';
  const exist = allCenters.filter(function(c){ return c.name === g.name; })[0];
  el.innerHTML =
    '<div class="gb-t">📍 \''+esc(g.name)+'\' 영업지역 등록 안내</div>'+
    (err ? '<div class="gb-s" style="color:#b91c1c">'+esc(err)+'</div>' :
      '<div class="gb-s">'+esc(g.addr)+' 위치로 이동했습니다. (빨간 마커)</div>'+
      '<div class="gb-s"><b>① 🏗️ 개설 예정지로 등록</b> — 이 위치에 예정지 핀을 남깁니다.<br>'+
      '<b>② 📐 영업구역 그리기</b> — 꼭짓점을 클릭해 구역을 그리고 마지막은 더블클릭(면적 확인).<br>'+
      (exist ? '<b>③ 🧭 영업구역 편집</b> — 이미 센터가 등록되어 있어 구역을 저장할 수 있습니다.' :
        '※ 영업구역은 센터가 시트(좌표)에 등록된 뒤 저장할 수 있습니다. 지금은 ①로 위치를 남기세요.')+'</div>')+
    '<div class="gb-b">'+
      (err ? '' : '<button class="tool-btn" id="gbPlan">🏗️ 개설 예정지로 등록</button><button class="tool-btn" id="gbDraw">📐 영업구역 그리기</button>')+
      (exist && !err ? '<button class="tool-btn" id="gbEdit">🧭 영업구역 편집</button>' : '')+
      '<button class="tool-btn" id="gbClose">닫기</button></div>';
  document.getElementById('mapWrap').appendChild(el);
  document.getElementById('gbClose').onclick = function(){ el.remove(); };
  const draw = document.getElementById('gbDraw');
  if(draw) draw.onclick = function(){ if(currentTool !== 'area') selectMeasureTool('area'); };
  const ed = document.getElementById('gbEdit');
  if(ed) ed.onclick = function(){
    if(!API_KEY){ alert('영업구역 편집은 편집 잠금해제 후 가능합니다. (통합 캔버스 안에서는 자동 해제)'); return; }
    if(!editMode) toggleEditMode();
    selectCenterForEdit(exist); startTerrPolygon();
  };
  const pl = document.getElementById('gbPlan');
  if(pl) pl.onclick = async function(){
    if(!API_KEY){ alert('개설 예정지 저장은 편집 잠금해제 후 가능합니다. (통합 캔버스 안에서는 자동 해제)'); return; }
    const btn = this; btn.disabled = true; btn.textContent = '저장 중…';
    const item = { id:'P'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36), name:g.name, form:g.pf,
                   lat:Number(g.lat.toFixed(6)), lng:Number(g.lng.toFixed(6)), addr:g.addr };
    try{
      await postCall(Object.assign({action:'savePlanned'}, item));
      planned[item.id] = item; plannedShown = true; syncPlannedBtn(); renderPlanned();
      btn.textContent = '등록됨 ✓';
    }catch(e){ alert('저장 실패: ' + e.message); btn.disabled = false; btn.textContent = '🏗️ 개설 예정지로 등록'; }
  };
}
init();
