<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 캔버스</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1c2431; --paper:#f6f7f4; --card:#ffffff; --line:#dfe3da;
  --pine:#2f5d50; --pine-soft:#e6efe9; --amber:#b4762a; --alert:#c0392b; --alert-bg:#fdeeec;
  --muted:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
.wrap.wrap-full{max-width:none}
header.top{border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
header.top h1{font-size:21px;letter-spacing:-.3px}
header.top h1 .tag{display:inline-block;background:var(--pine);color:#fff;font-size:11px;padding:3px 8px;border-radius:3px;vertical-align:3px;margin-left:8px;letter-spacing:.5px}
header.top .period{font-size:12.5px;color:var(--muted)}
.crumbs{font-size:13px;margin-bottom:18px;color:var(--muted)}
.crumbs a{color:var(--pine);text-decoration:none;font-weight:600;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs span.sep{margin:0 6px;color:#c4c9be}
.wrap.wrap-map{padding-top:10px;padding-bottom:10px}
.wrap-map header.top h1,.wrap-map #crumbs{display:none}
.wrap-map header.top{padding-bottom:8px;margin-bottom:10px;align-items:center}
.map-hdr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.map-hdr a{color:var(--pine);text-decoration:none;font-weight:600;cursor:pointer}
.map-hdr a:hover{text-decoration:underline}
.wrap-map header.top{flex-wrap:nowrap}
.wrap-map header.top .period{display:none}
.wrap-map header.top .period>*{font-size:12px}
.map-hdr .map-capture-btn{padding:4px 10px;font-size:12px}
.map-hdr .sep{margin:0 6px;color:#c4c9be}

/* main: manager list */
.mgr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mgr-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:8px;padding:20px 18px;cursor:pointer;transition:transform .12s, box-shadow .12s}
.mgr-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(28,36,49,.10)}
.mgr-card .who{font-size:18px;font-weight:800}
.mgr-card .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.hint{font-size:12.5px;color:var(--muted);margin-top:16px}
.closed-tag{color:var(--muted);font-weight:700;font-size:11.5px}
.decline-closed-row{background:#f3f4f2;color:var(--muted)}
.decline-closed-row td{cursor:default}

/* branch list */
.br-list{display:grid;gap:12px}
.br-row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:border-color .12s}
.br-row:hover{border-color:var(--pine)}
.br-row .nm{font-size:16px;font-weight:700}
.br-row .stats{font-size:12.5px;color:var(--muted)}
.br-row .stats b.warn{color:var(--alert)}
.br-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gs-wrap{position:relative;max-width:520px}
.gs-input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;font-size:14px;font-family:inherit;color:var(--ink)}
.gs-input:focus{outline:none;border-color:var(--pine)}
.gs-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.1);max-height:340px;overflow-y:auto;z-index:50}
.gs-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.gs-item:last-child{border-bottom:none}
.gs-item:hover{background:var(--pine-soft)}
.gs-name{font-weight:700;color:var(--ink);font-size:13.5px;white-space:nowrap}
.gs-sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.gs-empty{padding:12px 14px;color:var(--muted);font-size:13px}
.br-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:8px;padding:16px 16px;cursor:pointer;transition:transform .12s, box-shadow .12s}
.br-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(28,36,49,.10)}
.br-card .bc-name{font-size:15px;font-weight:800}
.br-card .bc-meta{font-size:12px;color:var(--muted);margin-top:6px}
.br-card .bc-meta b.warn{color:var(--alert)}
.br-card.placeholder{border-left-color:var(--amber);border-style:dashed;background:#fbfaf6}
.br-card.placeholder:hover{box-shadow:0 6px 16px rgba(180,118,42,.12)}
.arrow{color:var(--pine);font-weight:700}

/* branch detail */
h2.mgr{font-size:20px;margin-bottom:2px}
h3.hb{font-size:16px;color:var(--pine);margin-bottom:16px;font-weight:700}
.track{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 20px;margin-bottom:22px}
.track .t-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.track .t-head .badge{font-size:11px;font-weight:800;letter-spacing:.8px;color:#fff;background:var(--ink);padding:3px 8px;border-radius:3px}
.track .t-head h4{font-size:15px}
.overall{background:var(--pine-soft);border-left:4px solid var(--pine);padding:10px 12px;font-size:13px;line-height:1.55;border-radius:0 6px 6px 0;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#eef0ea;border:1px solid var(--line);padding:8px 8px;font-size:12px;white-space:nowrap}
td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;line-height:1.5}
td.num,th.num{text-align:center;white-space:nowrap}
td.warn{background:var(--alert-bg);color:var(--alert);font-weight:700}
td.stat-low{color:var(--alert);font-weight:800}
td.stat-ok{color:var(--pine);font-weight:600}
td .cm{font-size:12px;color:#3d4657}
tr.low-row td:first-child{border-left:4px solid var(--alert)}
.legend{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.note{font-size:12px;color:var(--amber);margin-top:8px}
.back-btn{display:inline-block;margin-top:6px;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.map-capture-btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;white-space:nowrap}
.map-capture-btn:hover{border-color:var(--pine);color:var(--pine)}
.restore-copy-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000}
.restore-copy-modal{background:#fff;border-radius:10px;padding:24px 28px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.25);max-width:320px}
.restore-copy-modal p{margin:0 0 16px;font-size:14px;color:var(--ink);line-height:1.5}
.restore-copy-modal button{background:var(--pine);color:#fff;border:none;border-radius:6px;padding:8px 28px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.restore-copy-modal button:hover{background:#1c3d34}
.back-btn:hover{border-color:var(--pine);color:var(--pine)}
.br-row.placeholder{border-style:dashed;background:#fbfaf6}
.br-row.placeholder:hover{border-color:var(--amber)}
.pill{display:inline-block;background:var(--amber);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:10px;vertical-align:2px;margin-left:6px;font-weight:700}
.track.empty{text-align:center;padding:40px 24px;border-style:dashed}
.empty-icon{font-size:38px}
.empty-title{font-size:17px;font-weight:800;margin:8px 0 4px}
.empty-desc{font-size:13px;color:var(--muted);max-width:620px;margin:0 auto 18px;line-height:1.6}
.empty-steps{display:inline-flex;flex-direction:column;gap:8px;text-align:left;font-size:13px;color:#3d4657}
.empty-steps .badge{font-size:10px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--ink);padding:2px 7px;border-radius:3px;margin-right:8px}
code{background:#eef0ea;padding:1px 5px;border-radius:3px;font-size:12px}
@media(max-width:720px){ table{font-size:11.5px} th,td{padding:5px 5px} .wrap{padding:20px 10px 60px} }

/* ===== 주간 리포트 ===== */
.rp-btn{margin-left:8px;background:var(--pine);color:#fff;border:none;border-radius:6px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.rp-btn:hover{background:#26493f}
.rp-btn.ghost{background:#fff;color:var(--pine);border:1px solid var(--pine)}
.rp-btn.ghost:hover{background:var(--pine-soft)}
.rp-card{max-width:860px}
.rp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:16px}
.rp-bar select,.rp-bar input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:13px;color:var(--ink)}
.rp-nav{background:var(--pine-soft);color:var(--pine);border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.rp-dl{background:var(--amber);color:#fff;border:none;border-radius:6px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.rp-dl:hover{background:#96601f}
.rp-doc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.rp-head{border-bottom:2px solid var(--pine);padding-bottom:12px;margin-bottom:6px}
.rp-title{font-size:20px;font-weight:800;color:var(--pine)}
.rp-sub{font-size:12px;color:var(--muted);margin-top:4px}
.rp-h{font-size:14px;color:var(--pine);border-bottom:1.5px solid var(--pine);padding-bottom:5px;margin:20px 0 10px}
.rp-tb{width:100%;border-collapse:collapse;margin-bottom:10px}
.rp-tb th,.rp-tb td{border:1px solid var(--line);padding:6px 8px;font-size:12.5px;vertical-align:top;text-align:left}
.rp-tb th{background:var(--pine-soft);font-weight:700;white-space:nowrap}
.rp-sum th{width:90px}
.rp-br{margin-bottom:14px}
.rp-br-t{font-weight:800;font-size:13.5px;margin:12px 0 5px}
.rp-note{font-size:11.5px;color:var(--muted);margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}

/* ===== 인쇄 / PDF (월간 = 기존 대시보드) ===== */
@media print{
  .tabbar{display:none!important}
  @page{ size:A4; margin:12mm; }
  body{background:#fff !important}
  .wrap{padding:0 !important;max-width:100% !important}
  /* 화면 전용 요소 숨김 */
  .back-btn,.crumbs,.rp-btn,.cloud-status,.no-print,.memo-add,.memo-del,
  .dm-memo-form,.center-link .memo-badge{display:none !important}
  .modal-overlay{position:static !important;background:none !important;padding:0 !important;display:none}
  .modal-overlay.show{display:block !important}
  .modal-card{box-shadow:none !important;max-width:100% !important;padding:0 !important}
  .modal-close{display:none !important}
  /* 카드가 페이지 경계에서 잘리지 않도록 */
  .track,.card-box,.score-card,.top5,.ai-summary,.kpi,.swot-cell,
  .rp-br,.memo-item,.br-card{ break-inside:avoid; page-break-inside:avoid; }
  .dash-grid2,.dash-grid2b{ break-inside:avoid; page-break-inside:avoid; }
  /* 섹션 단위로 페이지 분리 */
  .top5{ page-break-before:always; }
  .track{ page-break-before:always; }
  h3.hb{ page-break-after:avoid; }
  .rp-h{ page-break-after:avoid; }
  /* 표는 머리글 반복 */
  thead{ display:table-header-group; }
  tr{ page-break-inside:avoid; }
  /* 인쇄 시 색 유지 */
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  a{ text-decoration:none; color:inherit }
}


/* ===== 의사결정 대시보드 확장 ===== */
.dash-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px}
.dash-grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:760px){ .dash-grid2,.dash-grid2b{grid-template-columns:1fr} }
.ai-summary{background:linear-gradient(135deg,#233a34 0%,#2f5d50 100%);color:#eef4f1;border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:0 6px 18px rgba(35,58,52,.18)}
.ai-summary .ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;margin-bottom:12px}
.ai-summary p{font-size:14.5px;line-height:1.7;margin:0}
.ai-summary p b{color:#ffd9a8}
.ai-summary .headline{font-size:16px;font-weight:800;margin-bottom:8px;color:#fff}
.score-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.score-top{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:12px}
.score-num{font-size:44px;font-weight:800;line-height:1}
.score-badge{font-size:13px;font-weight:800;padding:5px 12px;border-radius:20px}
.score-label{font-size:12px;color:var(--muted);margin-top:4px}
.grade-good{background:#e4f3ec;color:#1f7a52}
.grade-warn{background:#fdf2e0;color:#a5670f}
.grade-risk{background:var(--alert-bg);color:var(--alert)}
.radar-wrap{position:relative;flex:1;min-height:210px}
.card-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card-box h4{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:7px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media(max-width:760px){ .kpi-row{grid-template-columns:repeat(2,1fr)} }
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-top:4px solid var(--pine)}
.kpi .k-label{font-size:12px;color:var(--muted)}
.kpi .k-val{font-size:26px;font-weight:800;margin:2px 0}
.kpi .k-delta{font-size:12.5px;font-weight:700}
.delta-up{color:var(--alert)}.delta-down{color:#2563eb}.delta-flat{color:var(--muted)}
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swot-cell{border-radius:8px;padding:11px 12px;font-size:12.5px}
.swot-cell .sw-t{font-weight:800;font-size:12px;margin-bottom:6px;letter-spacing:.5px}
.swot-cell ul{margin:0;padding-left:15px;line-height:1.6}
.sw-s{background:#e8f4ee;border-left:4px solid #1f7a52}
.sw-w{background:var(--alert-bg);border-left:4px solid var(--alert)}
.sw-o{background:#e9f0f7;border-left:4px solid #2b6cb0}
.sw-t2{background:#fdf2e0;border-left:4px solid var(--amber)}
.guide-list{list-style:none;padding:0;margin:0}
.guide-list li{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);line-height:1.5}
.guide-list li:last-child{border-bottom:none}
.guide-q{color:var(--pine);font-weight:700;margin-right:6px}
.action-list{list-style:none;padding:0;margin:10px 0 0}
.action-list li{font-size:13px;padding:6px 0;display:flex;gap:8px;align-items:flex-start}
.action-list li::before{content:"\2610";color:var(--pine);font-weight:800}
.top5{background:var(--card);border:2px solid var(--alert);border-radius:12px;padding:18px;margin-bottom:22px}
.top5 h4{font-size:15px;color:var(--alert);margin-bottom:12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--alert);padding-bottom:8px}
.top5-row{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.top5-row:last-child{border-bottom:none}
.rank-badge{flex:none;width:34px;height:34px;border-radius:8px;background:var(--alert);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.rank-2{background:#d9773a}.rank-3{background:var(--amber)}.rank-4{background:#8a8f7d}.rank-5{background:#8a8f7d}
.top5-body{flex:1}
.top5-name{font-weight:800;font-size:14px}
.top5-reason{font-size:12.5px;color:#4a5261;margin-top:2px}
.top5-spark{flex:none;font-family:monospace;font-size:15px;letter-spacing:1px;color:var(--pine)}
.top5-empty{font-size:13px;color:var(--muted);padding:8px 0}
.heat{display:inline-flex;gap:2px;vertical-align:middle}
.heat span{width:13px;height:13px;border-radius:2px;display:inline-block}
.heat .on{background:#2f7a58}.heat .off{background:#e3e6de}
.spark{font-family:monospace;font-size:14px;letter-spacing:.5px;color:var(--pine)}
.spark-mem{font-size:11px;color:var(--muted);margin-left:4px}
.risk-dot{font-size:13px;font-weight:700;white-space:nowrap}
.risk-red{color:var(--alert)}.risk-yel{color:#a5670f}.risk-grn{color:#1f7a52}
.prio-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:10px;white-space:nowrap}
.prio-1{background:var(--alert);color:#fff}.prio-2{background:#d9773a;color:#fff}
.prio-3{background:var(--amber);color:#fff}.prio-4{background:#e4f3ec;color:#1f7a52}
.trend-wrap{position:relative;height:230px}
.trend-cell{white-space:nowrap;font-size:12.5px}
.cloud-status{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;vertical-align:1px}
.cs-on{background:#e4f3ec;color:#1f7a52}
.cs-off{background:#eef0ea;color:#6b7280}
.cs-sync{background:#e9f0f7;color:#2b6cb0}
.cs-err{background:#fdeeec;color:#c0392b}
.center-link{color:var(--pine);font-weight:800;cursor:pointer;text-decoration:none;border-bottom:1px dashed transparent;transition:border-color .12s}
.center-link:hover{border-bottom-color:var(--pine)}
.memo-badge{font-size:10.5px;color:var(--amber);margin-left:5px;font-weight:700;white-space:nowrap}

/* 센터 상세 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(20,26,33,.55);display:none;align-items:flex-start;justify-content:center;z-index:900;padding:30px 16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-card{background:var(--paper);border-radius:14px;max-width:720px;width:100%;padding:24px 24px 28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:modalIn .18s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--ink)}
.dm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.dm-name{font-size:20px;font-weight:800}
.dm-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.dm-tags{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.dm-low{background:var(--alert-bg);color:var(--alert);font-weight:800;font-size:11px;padding:2px 8px;border-radius:10px}
.dm-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:14px}
@media(max-width:620px){ .dm-grid{grid-template-columns:1fr} .dm-grid2{grid-template-columns:1fr} }
.dm-chart-wrap{position:relative;height:200px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.dm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.dm-chart-wrap.small{height:140px}
.dm-mini-title{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.dm-mems{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.dm-mem{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.dm-mem.low{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.dm-mem span{color:var(--muted)}.dm-mem.low span{color:var(--alert)}
.dm-mem b{font-size:13px}
.dm-trend,.dm-crit{grid-column:1/-1;font-size:12px;color:#3d4657;padding:2px}
.dm-crit{color:var(--muted)}
.dm-mng{background:var(--pine-soft);border-left:4px solid var(--pine);border-radius:0 6px 6px 0;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-bottom:18px}
.dm-memo{border-top:1px solid var(--line);padding-top:16px}
.dm-memo-title{font-size:14px;font-weight:800;margin-bottom:10px}
.dm-memo-title span{color:var(--muted);font-weight:600;font-size:12px}
.dm-memo-form{display:flex;gap:8px;margin-bottom:12px}
.memo-date{flex:none;width:140px;border:1px solid var(--line);border-radius:6px;padding:8px;font-family:inherit;font-size:13px;color:var(--ink)}
.memo-text{flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--ink)}
.memo-text:focus,.memo-date:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 2px rgba(47,93,80,.12)}
.memo-add{flex:none;background:var(--pine);color:#fff;border:none;border-radius:6px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.memo-add:hover{background:#26493f}
.dm-memo-log{display:flex;flex-direction:column;gap:8px}
.memo-item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pine);border-radius:7px;padding:9px 11px}
.memo-item-date{flex:none;font-size:12px;font-weight:800;color:var(--pine);width:88px;padding-top:1px}
.memo-item-text{flex:1;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.memo-del{flex:none;background:none;border:none;color:#c4c9be;cursor:pointer;font-size:14px;line-height:1;padding:2px}
.memo-del:hover{color:var(--alert)}
.memo-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:16px;background:var(--card);border:1px dashed var(--line);border-radius:7px}
@media(max-width:620px){ .dm-memo-form{flex-wrap:wrap} .memo-date{width:100%} .memo-item-date{width:70px} }

/* ===== 사이드바 내비게이션 ===== */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 0;overflow-y:auto;
  position:fixed;top:0;left:0;bottom:0;z-index:60}
.sidebar .sb-brand{font-size:14px;font-weight:800;color:var(--pine);padding:0 18px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sidebar .sb-caption{padding:14px 18px 4px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);border-top:1px solid var(--line);margin-top:6px}
.sidebar .sb-caption:first-of-type{border-top:0;margin-top:0}
.sidebar .menu-item{padding:11px 18px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;transition:background .12s}
.sidebar .menu-item:hover{background:var(--pine-soft)}
.sidebar .menu-item.active{background:var(--pine-soft);color:var(--pine)}
.sidebar .menu-item .chev{font-size:11px;color:var(--muted);transition:transform .15s}
.sidebar .menu-item.expanded .chev{transform:rotate(90deg)}
.sidebar .submenu{overflow:hidden}
.sidebar .submenu-item{padding:8px 18px 8px 34px;font-size:13px;color:var(--muted);cursor:pointer;border-left:2px solid transparent;transition:color .12s,border-color .12s}
.sidebar .submenu-item:hover{color:var(--ink)}
.sidebar .submenu-item.active{color:var(--pine);font-weight:800;border-left-color:var(--pine);background:var(--pine-soft)}
.main-content{flex:1;min-width:0;margin-left:220px}
.sb-collapse-btn{position:absolute;top:10px;right:10px;width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0}
.sb-collapse-btn:hover{background:var(--pine-soft);color:var(--pine)}
.sb-expand-btn{display:none;position:fixed;top:10px;left:10px;z-index:70;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--pine);font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sb-expand-btn:hover{background:var(--pine-soft)}
.sidebar{transition:transform .2s}.main-content{transition:margin-left .2s}
#appShell.sb-collapsed .sidebar{transform:translateX(-100%)}
#appShell.sb-collapsed .main-content{margin-left:0}
#appShell.sb-collapsed .sb-expand-btn{display:block}
#appShell.sb-collapsed .tabbar{padding-left:112px}
@media(max-width:820px){.sb-collapse-btn,.sb-expand-btn{display:none!important}#appShell.sb-collapsed .sidebar{transform:translateX(-100%)}#appShell.sb-collapsed .tabbar{padding-left:46px}}
.tabbar{position:sticky;top:0;z-index:45;display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding:6px 14px 0;background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabbar .tab{display:flex;align-items:center;gap:6px;flex:none;max-width:200px;padding:7px 8px 7px 12px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:#eef0ea;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabbar .tab:hover{background:#fff;color:var(--ink)}
.tabbar .tab.on{background:var(--card);color:var(--pine);box-shadow:inset 0 3px 0 var(--pine);cursor:default}
.tabbar .tab .tl{overflow:hidden;text-overflow:ellipsis}
.tabbar .tab .tx{border:0;background:transparent;color:inherit;cursor:pointer;font-size:12px;line-height:1;padding:2px 4px;border-radius:4px;opacity:.6}
.tabbar .tab .tx:hover{background:rgba(0,0,0,.08);opacity:1}
.tabbar .tab-note{flex:none;align-self:center;margin-left:8px;font-size:11px;color:var(--muted)}
.tab-pane{min-width:0}
.hamburger{display:none;position:sticky;top:8px;left:8px;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:6px;width:34px;height:34px;font-size:16px;cursor:pointer;margin:8px 0 0 8px}
@media(max-width:820px){
  .sidebar{z-index:80;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 0 transparent}
  .sidebar.open{transform:none;box-shadow:2px 0 16px rgba(0,0,0,.15)}
  .hamburger{display:block}
  .main-content{margin-left:0}
}

/* ===== 홈 화면(매니저별 주간 요약) ===== */
.home-week-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.home-quicknav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;position:sticky;top:0;z-index:40;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line)}
.qn-pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s}
.qn-pill:hover{background:var(--pine-soft);border-color:var(--pine);color:var(--pine)}
.hq-tabs{display:flex;gap:8px;margin-bottom:6px}
.hq-tab{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 18px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.hq-tab.active{background:var(--pine);color:#fff;border-color:var(--pine)}
.curi-merged-table td, .curi-merged-table th{font-size:12.5px}
.curi-center-cell{vertical-align:middle;background:var(--pine-soft);border-right:2px solid var(--line)}
.ac-table .ac-name-col{position:sticky;left:0;z-index:3}
.ac-table th.ac-name-col{z-index:7;background:var(--pine)}
.ac-table td.ac-name-col{background:var(--pine-soft)}
.curi-metric{color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap}
.curi-group-start td{border-top:2px solid var(--line)}
.curi-merged-table thead th{position:sticky;top:0;z-index:5;background:#eef0ea;box-shadow:0 1px 0 var(--line)}
.home-scope-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--pine-soft);border-radius:8px;padding:9px 12px}
.uni-scope-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--pine-soft);border-radius:8px;padding:9px 12px;
  position:sticky;top:54px;z-index:39;box-shadow:0 2px 6px rgba(0,0,0,.06);margin-bottom:14px}
.uni-scope-bar select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
.uni-scope-bar label{font-size:12px;font-weight:700;color:var(--pine)}
.uni-reset-btn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.uni-reset-btn:hover{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.uni-kpi-wrap{margin-bottom:22px;overflow-x:auto}
.mirror-scroll-top{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:4px}
.mirror-scroll-top div{height:1px}
.uni-kpi-table2{border-collapse:collapse;font-size:12.5px;min-width:640px}
.uni-kpi-table2 th{background:var(--pine);color:#fff;font-weight:800;font-size:12px;padding:8px 10px;white-space:nowrap;border:1px solid var(--pine);position:sticky;top:0;z-index:6}
.uni-kpi-table2 th.grp-eng{background:#1e3a8a;border-color:#1e3a8a}
.uni-kpi-table2 th.grp-curi{background:#c2410c;border-color:#c2410c}
.uni-kpi-table2 th.eng-cell{background:#3b5bb5;border-color:#3b5bb5}
.uni-kpi-table2 th.curi-cell{background:#e2853f;border-color:#e2853f}
.uni-kpi-table2 th.uni-corner{left:0;z-index:8}
.uni-kpi-table2 td{border:1px solid var(--line);padding:8px 10px;white-space:nowrap}
.uni-row-main td{background:#fff;font-weight:700}
.uni-row-label{cursor:pointer;font-weight:800;color:var(--ink);position:sticky;left:0;z-index:4;background:#fff}
.uni-row-label:hover{color:var(--pine)}
.uni-arrow{display:inline-block;width:12px;color:var(--pine);font-weight:800}
.uni-row-sub td{background:var(--pine-soft);font-weight:400;color:#3d4657;font-size:12px}
.uni-row-sublabel{padding-left:22px !important;color:var(--muted);position:sticky;left:0;z-index:4;background:var(--pine-soft)}
.uni-kpi-note{font-size:11px;color:var(--muted);margin-top:6px}
.uni-kpi-asof{font-size:12.5px;font-weight:700;color:var(--pine);margin-bottom:8px;text-align:right}
.uni-kpi-asof-sep{color:var(--line);margin:0 2px}
.grp-eng{background:#1e3a8a;color:#fff;text-align:center}
.grp-curi{background:#c2410c;color:#fff;text-align:center}
.eng-cell{background:#eef2ff}
.curi-cell{background:#fff1e6}
.uni-row-sub .eng-cell{background:#e0e7ff}
.uni-row-sub .curi-cell{background:#ffe4cc}
.mem-cell{background:#e8f7ee !important}
.uni-row-sub .mem-cell{background:#dcf3e6 !important}
.curi-mgr-row td{background:var(--pine-soft);font-weight:800;color:var(--pine);padding:8px 10px}
.uni-delta{font-size:10.5px;font-weight:700;margin-top:1px}
.uni-delta.up{color:var(--alert)}
.uni-delta.down{color:#2563eb}
.uni-delta.flat{color:var(--muted)}
.home-scope-bar label{font-size:12px;font-weight:700;color:var(--pine)}
.home-scope-bar select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
.home-scope-label{margin-left:auto;font-size:12.5px;color:#3d4657}
.home-scope-label b{color:var(--pine)}
.home-week-bar .rp-nav{background:var(--pine-soft);color:var(--pine);border:none;border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.home-week-bar .wk-label{font-size:13.5px;font-weight:700;color:var(--ink)}
.home-summary{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:#3d4657;display:flex;gap:22px;flex-wrap:wrap}
.home-summary b{color:var(--pine);font-size:15px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.home-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:8px;padding:16px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.home-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(28,36,49,.10)}
.home-card .hc-name{font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.home-card .hc-score{font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px}
.home-card .hc-meta{font-size:12px;color:var(--muted);margin:8px 0 6px}
.home-card .hc-top{font-size:12px;color:#3d4657;background:var(--pine-soft);border-radius:6px;padding:7px 9px;line-height:1.5}
.home-card .hc-top b{color:var(--alert)}
.home-card .hc-empty{font-size:12px;color:var(--muted);font-style:italic}
.voc-branch{margin-bottom:16px}
.voc-branch-t{font-weight:800;font-size:13.5px;margin-bottom:6px}

/* ===== 외부 문서 인라인 뷰어 ===== */
.doc-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.doc-bar b{font-size:15px}
.doc-note{font-size:12px;color:var(--muted)}
.doc-frame-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.doc-frame{width:100%;height:74vh;min-height:480px;border:none;display:block}

/* ===== 센터 정보(민감정보 인증조회) ===== */
.dir-info{background:var(--card);border:1px solid var(--amber);border-radius:8px;padding:12px 14px;margin-bottom:18px}
.dir-title{font-size:13px;font-weight:800;color:var(--amber);display:flex;align-items:center;justify-content:space-between}
.dir-refresh{font-size:11px;font-weight:600;color:var(--pine);cursor:pointer}
.dir-locked{display:flex;gap:8px;margin-top:10px}
.dir-err{font-size:11.5px;color:var(--alert);margin-top:6px;min-height:14px}
.dir-body{margin-top:10px}
.dir-table{width:100%;border-collapse:collapse;font-size:12.5px}
.dir-table th{width:110px;text-align:left;color:var(--muted);font-weight:700;padding:5px 8px 5px 0;vertical-align:top}
.dir-table td{padding:5px 0}
.dir-table a{color:var(--pine);font-weight:700}
.dir-tel{color:var(--pine);font-weight:800;text-decoration:none}
.dir-tel:hover{text-decoration:underline}
.dir-map{font-size:11px;color:var(--amber);margin-left:4px}
.dir-sub{font-size:11px;color:var(--muted);font-weight:400}
.dir-duration{margin-top:8px;font-size:13px;padding-top:8px;border-top:1px dashed var(--line)}
.dir-duration b{color:var(--pine)}

/* ===== 본부 상세: 매니저명·가맹지역본부명 스크롤 고정 ===== */
.branch-head-sticky{position:sticky;top:0;z-index:30;background:var(--paper);padding-top:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.center-quick-pick{display:flex;align-items:center;gap:8px;padding:8px 0 12px;font-size:12.5px}
.center-quick-pick label{font-weight:700;color:var(--amber)}
.center-quick-pick select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
.track2-table thead th{position:sticky;top:132px;z-index:25;background:#eef0ea;box-shadow:0 1px 0 var(--line)}
.t2-filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12.5px}
.lc-filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.lc-filter-bar label{font-weight:700;color:var(--muted)}
.lc-filter-bar select{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
.lc-gran-toggle{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lc-gran-toggle button{border:none;background:#fff;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.lc-gran-toggle button.active{background:var(--pine);color:#fff}
.lc-summary{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.lc-summary b{font-size:15px;margin-left:4px}
.lc-sort-bar{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:12.5px}
.lc-sort-bar label{font-weight:700;color:var(--muted)}
.lc-sort-bar select{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
.lc-table{width:100%;border-collapse:collapse;font-size:13px}
.lc-table th{background:var(--pine);color:#fff;font-weight:800;font-size:12px;padding:8px 10px;text-align:left}
.lc-table th.num,.lc-table td.num{text-align:right}
.lc-table td{border:1px solid var(--line);padding:7px 10px}
.lc-table tbody tr:hover{background:var(--pine-soft)}
.lc-row-selected{background:var(--pine-soft)}
.lc-tab-bar{display:flex;gap:6px;border-bottom:2px solid var(--line)}
.lc-tab-btn{border:none;background:none;padding:9px 18px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;margin-bottom:-2px}
.lc-tab-btn.active{color:var(--pine);border-bottom-color:var(--pine)}
.lc-tab-btn:hover{color:var(--pine)}
.lc-toggle-row{display:flex;align-items:flex-start;gap:10px;margin-top:10px;flex-wrap:wrap}
.lc-toggle-row label{font-weight:700;color:var(--muted);font-size:12.5px;padding-top:7px;white-space:nowrap}
.lc-toggle-group{display:flex;flex-wrap:wrap;gap:6px}
.lc-toggle-btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.lc-toggle-btn.active{background:var(--pine);color:#fff;border-color:var(--pine)}
.lc-toggle-btn:hover:not(.active){border-color:var(--pine)}
.lc-row-disabled{color:var(--muted);cursor:default}
.lc-row-disabled:hover{background:none}
.lc-type-tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}
.t2-filter-bar label{font-weight:700;color:var(--pine)}
.t2-filter-bar select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
.ac-filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;background:var(--pine-soft);border-radius:8px;padding:9px 12px}
.ac-filter-bar label{font-size:12px;font-weight:700;color:var(--pine)}
.ac-filter-bar select,.ac-filter-bar input{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
.ac-filter-bar input{flex:1;min-width:140px}
.ac-search-btn{background:var(--pine);color:#fff;border:none;border-radius:6px;padding:7px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.ac-search-btn:hover{background:#234a3f}
.ac-search-btn:disabled{background:#c4c9be;cursor:not-allowed}
.branch-head-sticky .back-btn{margin:0 0 10px !important}
.branch-head-sticky h3.hb{padding-bottom:10px}
/* ===== 인터폰 번호표 ===== */
.ic-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
.ic-search{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--card);color:var(--ink)}
.ic-search:focus{outline:2px solid var(--pine-soft);border-color:var(--pine)}
.ic-refresh{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;color:var(--ink)}
.ic-refresh:hover{background:var(--pine-soft)}

<script>
/* =========================================================
   데이터 영역 — 이 객체에 매니저/본부를 추가하면 자동 반영됩니다.
   managers[].branches[] 아래에 새 본부 객체를 붙이면 됩니다.
   center.form 값: '학원(상가형)' | '학원(IGSE)' | '학원(숲)' | '교습소' | '공부방'
   ========================================================= */
const MONTH_LABELS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월'];
let NMON = MONTH_LABELS.length, LI = NMON-1; // 데이터 개월 수 / 마지막(최신) 월 인덱스 — 월이 늘면 MONTH_LABELS만 늘리면 됩니다
// 데이터 기준일 · 최종 업데이트일 — 데이터를 새로 반영할 때마다 이 두 값만 바꾸면 됩니다
// ============================================================================
// 📅 데이터 기준일 · 최종 업데이트일 관리 규칙
// ----------------------------------------------------------------------------
// - DATA_AS_OF_LABEL   : 사용자가 새 실적 데이터 파일을 줄 때, 그 파일 안에 적힌
//                        "기준일자"를 그대로 옮겨서 갱신한다. (예: 파일에 "2026년
//                        8월 31일 기준"이라고 적혀있으면 그 문구를 그대로 반영)
// - LAST_UPDATED_LABEL : 이 대시보드 파일을 실제로 수정한 날짜. 정적 HTML이라
//                        자동 타임스탬프가 안 찍히므로, 파일을 편집할 때마다
//                        "그 작업을 한 날짜"로 반드시 함께 갱신한다.
// ============================================================================
let DATA_AS_OF_LABEL = '2026년 10월 31일 (가마감)';
let LAST_UPDATED_LABEL = '2026년 11월 2일';

const DATA = {
  managers: [
    {
      name: '김혜림',
      branches: [
        {
          name: '서울강서',

/* ===== 저실적 판정 (개설형태별 기준) ===== */
function threshold(form){
  if(form.startsWith('학원')) return 15;   // 상가형·IGSE·숲
  if(form==='교습소') return 10;
  if(form==='공부방') return 5;
  return 0;
}
function isLowMonth(c,i){ const v=c.mem[i]; return v!==null && v!==undefined && v<=threshold(c.form); }
function isLowCenter(c){ return c.mem.some((_,i)=>isLowMonth(c,i)); }

    Object.entries(old).forEach(([k,v])=>{ if(v && !store[k]){ store[k]=[{date:'',text:String(v),ts:Date.now()}]; changed=true; } });

  }
  return store;
}
// 캐시 보장(최초 1회 로컬에서 채움)
function normalizeStore(store){
  Object.values(store||{}).forEach(arr=>(arr||[]).forEach(it=>{ it.date=normDate(it.date); }));
  return store;
}
function loadMemoStore(){ if(_cache===null) _cache=normalizeStore(_loadLocalStore()); return _cache; }

// ▼ 기존 함수 시그니처 그대로 — 캐시 기반 동기 동작
function getMemoLog(mgr,br,c){ const s=loadMemoStore(); return s[memoKey(mgr,br,c)]||[]; }
function memoCount(mgr,br,c){ return getMemoLog(mgr,br,c).length; }
function addMemoLog(mgr,br,c,date,text){
  if(!text || !text.trim()) return false;
  const s=loadMemoStore(), k=memoKey(mgr,br,c);
  if(!s[k]) s[k]=[];
  const item={date:normDate(date)||todayStr(),text:text.trim(),ts:Date.now()};
  s[k].push(item);
  _writeLocal(s);
  cloudPush('add',k,item);   // 백그라운드 전송
  return true;
}
function deleteMemoLog(mgr,br,c,ts){
  const s=loadMemoStore(), k=memoKey(mgr,br,c);
  if(s[k]){ s[k]=s[k].filter(x=>x.ts!==ts); if(!s[k].length) delete s[k]; _writeLocal(s);
    cloudPush('delete',k,{ts}); }
}
function normDate(v){
  /* 구글 시트를 거치면 날짜 셀이 Date로 자동 변환되어
     "Wed Jul 15 2026 00:00:00 GMT+0900 (한국 표준시)" 형태로 돌아온다.
     어떤 형식이 와도 YYYY-MM-DD 로 되돌린다. */
  if(v===null||v===undefined||v==='') return '';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;                 // 이미 정상
  const m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); // 2026/7/15, 2026-07-15T...
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  // "Wed Jul 15 2026 ..." (Date.toString 형식) — 표기된 날짜를 문자 그대로 읽는다.
  // new Date()로 파싱하면 표준시 변환 때문에 하루가 밀릴 수 있어 직접 추출한다.
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const t=s.match(/\b([A-Za-z]{3})\w*\s+(\d{1,2})\s+(\d{4})\b/);
  if(t && MON[t[1].toLowerCase()])
    return `${t[3]}-${String(MON[t[1].toLowerCase()]).padStart(2,'0')}-${String(t[2]).padStart(2,'0')}`;
  const d=new Date(s);
  if(isNaN(d.getTime())) return s;                              // 파싱 불가 → 원본 유지
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function eschtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ===== 클라우드(구글 시트) 동기화 ===== */
function setCloudStatus(state,msg){
  const el=document.getElementById('cloudStatus'); if(!el)return;
  const map={on:['🟢','연결됨'],off:['⚪','로컬 저장'],sync:['🔄','동기화 중…'],err:['🔴','동기화 오류']};
  const [ic,label]=map[state]||map.off;
  el.textContent=`${ic} ${msg||label}`;
  el.className='cloud-status cs-'+state;
}
// 시트 → 캐시 병합(시트 우선, 로컬 전용 항목도 보존)
function mergeStore(base,incoming){
  const out={...base};
  Object.entries(incoming||{}).forEach(([k,arr])=>{
    const cur=out[k]||[];
    const byTs={}; cur.forEach(x=>byTs[x.ts]=x); (arr||[]).forEach(x=>byTs[x.ts]=x);
    out[k]=Object.values(byTs).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.ts-b.ts);
  });
  return out;
}
async function cloudPull(){
  if(!CLOUD_URL){ setCloudStatus('off'); return; }
  setCloudStatus('sync');
  try{
    const res=await fetch(CLOUD_URL+'?action=get&apiKey='+encodeURIComponent(API_KEY),{method:'GET'});
    const data=await res.json();
    _cache=normalizeStore(mergeStore(loadMemoStore(), normalizeStore(data.store||{})));
    _writeLocal(_cache);
    _cloudReady=true; setCloudStatus('on');
    if(typeof route!=='undefined' && route.view==='br') render(); // 최신 메모로 화면 갱신
  }catch(e){ _cloudReady=false; setCloudStatus('err','오프라인(로컬 저장)'); }
}
async function cloudPush(action,key,item){
  if(!CLOUD_URL){ return; }
  try{
    await fetch(CLOUD_URL,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // 프리플라이트 회피(단순요청)
      body:JSON.stringify({action,key,item,apiKey:API_KEY})});
    if(_cloudReady) setCloudStatus('on','저장됨 ✓');
  }catch(e){ setCloudStatus('err','전송 실패(로컬 보관)'); }
}

/* ============================================================
   센터 정보(원장명·연락처·주소·개설일) 조회
   - 인증 없이 바로 조회(요청에 따라 비밀번호 절차 제거).
   ============================================================ */
async function fetchDirectorInfo(centerName, centerCode){
  try{
    const res = await fetch(CLOUD_URL, {method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'getDirectorInfo', centerName, centerCode, apiKey:API_KEY})});
    const data = await res.json();
    if(!data.ok){ return {ok:false, error:data.error}; }
    return {ok:true, info:data.info};
  }catch(e){ return {ok:false, error:'서버에 연결할 수 없습니다.'}; }
}

// 사업 기간 계산: 최근개설일(명의변경일) 있으면 그 날짜 기준, 없으면 최초개설일 기준. 오늘 날짜와 비교.
function calcBizDuration(dateStr){
  if(!dateStr) return null;
  const d = new Date(normDate(dateStr)+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const now = new Date();
  let years = now.getFullYear()-d.getFullYear();
  let months = now.getMonth()-d.getMonth();
  if(now.getDate() < d.getDate()) months--;
  if(months<0){ years--; months+=12; }
  if(years<0) return {years:0, months:0, invalid:true};
  return {years, months};
}

function directorInfoHtml(centerName){
  return `<div class="dir-info">
    <div class="dir-title">🔒 센터 정보 <span id="dirRefresh" class="dir-refresh" onclick="loadDirectorInfo()">↻ 새로고침</span></div>

// 빈 값으로 간주할 값들 (공백, 대시, "없음" 등 시트에 흔히 들어가는 표기)
function isBlankVal(v){
  if(v===null||v===undefined) return true;
  const s=String(v).trim();
  return s==='' || /^[-–—.]+$/.test(s) || s==='없음' || s.toLowerCase()==='n/a';
}
async function loadDirectorInfo(){
  if(!_modalCtx) return;
  const body = document.getElementById('dirBody');
  if(body) body.innerHTML = '불러오는 중…';
  const r = await fetchDirectorInfo(_modalCtx.c, _modalCtx.code);
  if(!r.ok){
    if(body) body.innerHTML = `<span class="dir-err">${eschtml(r.error||'조회 실패')}</span>`;
    return;
  }
  const info = r.info || {};
  const hasRecent = !isBlankVal(info.최근개설일);
  const basisDate = hasRecent ? info.최근개설일 : info.최초개설일;
  const dur = isBlankVal(basisDate) ? null : calcBizDuration(basisDate);
  const durTxt = dur ? `${dur.years}년 ${dur.months}개월째 운영중` : '기간 정보 없음';
  const durBasis = hasRecent ? '최근개설일(명의변경일) 기준' : '최초개설일 기준';
  const mapUrl = info.주소 ? `https://map.naver.com/v5/search/${encodeURIComponent(info.주소)}` : null;
  const telNum = info.연락처 ? info.연락처.replace(/[^0-9+]/g,'') : null;
  if(!body) return;
  const ageTxt = !isBlankVal(info.만나이) ? `${info.만나이}세` : null;
  body.innerHTML = `
    <table class="dir-table">
      <tr><th>원장명</th><td>${eschtml(info.원장명||'-')}${ageTxt?` <span class="dir-sub">(만 ${ageTxt})</span>`:''}</td></tr>
      <tr><th>연락처</th><td>${info.연락처 && telNum ? `<a href="tel:${telNum}" class="dir-tel">📞 ${eschtml(info.연락처)}</a>` : eschtml(info.연락처||'-')}</td></tr>
      <tr><th>주소</th><td>${info.주소? `<a href="${mapUrl}" target="_blank" rel="noopener">${eschtml(info.주소)} <span class="dir-map">📍네이버맵</span></a>` : '-'}</td></tr>
      <tr><th>최초개설일</th><td>${eschtml(info.최초개설일||'-')}</td></tr>
      <tr><th>최근개설일<br><span class="dir-sub">(명의변경일)</span></th><td>${eschtml(info.최근개설일||'-')}</td></tr>
    </table>
    <div class="dir-duration"><b>${durTxt}</b><span class="dir-sub"> — ${durBasis}</span></div>`;
}

7-01", "text": "법적이슈로 운영이 어려움\n[방향성] 해지 예정", "ts": 1782000000037}], "윤길한>대구경북>구미형남두산": [{"date": "2026-07-01", "text": "영어숲을 동시에 운영하고 있어서 집중하지 못하고 있음\n능력은 있는 원장님이니온라인/오프라인 홍보 지원을 통해 개선 예정\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000038}], "윤길한>대구경북>IGSE포항유강": [{"date": "2026-07-01", "text": "중등부 회원 복원으로 위해 부탁을 하였고, \n개성이 강해서 본사와 본부에서 마찰이 없도록 \n신경을 쓰는 원장입니다.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000039}], "윤길한>대구경북>숲구미도량야은": [{"date": "2026-07-01", "text": "현재 다니는 아이들도 모두 방과후를 몇개씩 하고 지역아동센터를 이용하는 아동이 다수입니다.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000040}], "윤길한>대구경북>숲경주용강": [{"date": "2026-07-01", "text": "상권에서 살아 남기 힘들어 해지를 계획하고 있음. 6월까지 버티고 해지를 고려 중 본부에서 상권 이동이나 해지를 소통하고 있음 6월까지 노력해 보기로 함.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000041}], "윤길한>대구경북>숲고령": [{"date": "2026-07-01", "text": "중. 고등에 수업이 집중되어 있어 초등 학생 모집에 소홀한 점이 있다 생각됩니다\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000042}], "윤길한>대구경북>숲대구봉무이시아": [{"date": "2026-07-01", "text": "미등록 회원에 대한 계도 진행 중\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000043}], "윤길한>대구경북>숲경주": [{"date": "2026-07-01", "text": "구도심이라 점점 학생이 줄어들기도 하고 초등학생들은 \n대형 어학원에 가고 있는것같음. \n윤선생 브랜드를 찾아오는 유림초 학부모들이 간혹 황성우영과 \n헷갈리는 경우도 있고 파이가 나눠지는듯 함\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000044}], "윤길한>대구경북>IGSE문경모전대동": [{"date": "2026-07-01", "text": "가족 문제가 있어서 지금 힘든 상태 지금 부터 다시 재기를 \n하도록 함과 온라인 줌 참석 및 본사 수학 사업 새롭게 \n도입을 희망하고 준비하고자 합니다\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000045}], "윤길한>대구경북>숲경산신대": [{"date": "2026-07-01", "text": "최근 주변 학원 신고로 많은 벌금을 내고 교육청과의 문제가 생김.  \n큰 스트레스를 받고 공항 상태로 인해 어려움을 안고 있음.  최근 윤선생에 대한 불만족이 많은 상태이지만, 계속 이어가기 위해 노력하고 있음.  앞으로 학원의 상황이 좋아지면 다시 열심히 하려고 함.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000046}], "윤길한>대구경북>IGSE포항동해": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 문제 강화", "ts": 1782000000047}], "윤길한>대구경북>IGSE칠곡남율": [{"date": "2026-07-01", "text": "원장 개인 가정 사유(출산·육아 등)(상세는 내부 기록)", "ts": 1782000000048}], "윤길한>대구달서>대구도원": [{"date": "2026-07-01", "text": "상권이 아파트옆 작은 초등학교여서 학생수 많지않음. 오래된 아파트여서 초등학생 인원 감소추세  성장력의 한계가 있음\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000049}], "윤길한>대구달서>대구월배학원": [{"date": "2026-07-01", "text": "[방향성] 상권 변경", "ts": 1782000000050}], "윤길한>대구달서>대구상인": [{"date": "2026-07-01", "text": "열악한 상권이여서 학생들 모으기 한계가 있고 원장님 나이가 있어서 sns홍보가 힘든상테임\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000051}], "윤길한>대구달서>대구비슬": [{"date": "2026-07-01", "text": "영업 지원 예정\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000052}], "윤길한>대구달서>숲대구용산중앙": [{"date": "2026-07-01", "text": "[방향성] 해지 예정", "ts": 1782000000053}], "윤길한>대구달서>IGSE대구성당": [{"date": "2026-07-01", "text": "상권이 아파트옆 작은 초등학교여서 학생수 많지 않고 원장님은 학원홍보나 초등학생모집에 신경을 쓰지만 학생모집이 힘든 상태 오래된 아파트여서 초등학생 인원 감소추세 성장력의 한계가 있음\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000054}], "윤길한>대구달서>숲대구성서이곡": [{"date": "2026-07-01", "text": "상권이 좋지 않음\n[방향성] 해지 예정", "ts": 1782000000055}], "윤길한>대구달서>IGSE대구원대": [{"date": "2026-07-01", "text": "원장이 불만이 많은 원장으로 비협조적임\n[방향성] 해지 예정", "ts": 1782000000056}], "윤길한>대구달서>IGSE대구연경": [{"date": "2026-07-01", "text": "상권이 아파트옆 작은 초등학교여서 학생수 많지 \n않지만 대형 신설 아파트내 상가에 학원이 \n위치해있어서 학생들 모집이 용이하나 원장님은 \n학원홍보나 초등학생모집에 신경을 덜 쓰는 상태.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000057}], "윤길한>대구수성>대구경동": [{"date": "2026-07-01", "text": "본사 월 납부하는 금액이 높아서 부담스럽다고 하심.\n올해는 블로그 활동을 더 자주 올려보겠다고 하셨음.\n[방향성] 영업/홍보 문제 강화", "ts": 1782000000058}], "윤길한>대구수성>숲대구시지중앙": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 문제 강화", "ts": 1782000000059}], "윤길한>대구수성>숲대구황금": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 문제 강화", "ts": 1782000000060}], "윤길한>대구수성>숲대구남산": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 문제 강화", "ts": 1782000000061}], "윤길한>대구수성>IGSE대구파동": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 문제 강화", "ts": 1782000000062}], "윤길한>서울강북>도봉북서울공부방": [{"date": "2026-07-01", "text": "[방향성] 혜지 예정", "ts": 1782000000063}], "김혜림>서울강서>은평구산": [{"date": "2026-07-01", "text": "원장 개인 건강 사유로 운영에 차질(상세는 내부 기록)", "ts": 1782000000064}], "김혜림>서울강서>등촌제1": [{"date": "2026-07-01", "text": "가족 사정으로 운영에 영향(상세는 내부 기록)", "ts": 1782000000065}], "김혜림>서울강서>대조": [{"date": "2026-07-01", "text": "과거 우수거점이었지만, 원장님이 지친상태이며 다시 사업에 집중할 수 있도록 지원중\n[방향성] 영업/홍보 역량 강화", "ts": 1782000000066} 교앞에 가기 싫다고\n[방향성] 영업/홍보 독려", "ts": 1782000000123}], "황성연>용인수지>성복엘지빌리지": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000124}], "황성연>용인수지>서천휴먼시아1단지": [{"date": "2026-07-01", "text": "원장 개인 건강 사유로 운영에 차질(상세는 내부 기록)", "ts": 1782000000125}], "황성연>용인수지>신흥역하늘채랜더스원": [{"date": "2026-07-01", "text": "위례에서 공부방하시던 분. 성남 공부방을 하다가 허가를 못받아서 쫓겨나듯 교습소를 차리게 됨. 인테리어 할 때 주민 신고로 오픈도 제대로 못했던 거점. 무료 파닉스 수업으로 5명 모집하시고 홍보도 열심히 하심.\n[방향성] 영업/홍보 독려", "ts": 1782000000126}], "황성연>전남광주>완도노화": [{"date": "2026-07-01", "text": "완도 섬 지역이라 특수한 상황.\n[방향성] 영업/홍보 독려", "ts": 1782000000127}], "황성연>전남광주>강진마량": [{"date": "2026-07-01", "text": "강진읍에서도 꽤 깊은 곳에 있음. 연락이 잘 안되고 만나기도 쉽지 않음. 본사납입금도 가장 늦게 냄.(초등 전교생 31명)\n[방향성] 영업/홍보 독려", "ts": 1782000000128}], "황성연>전남광주>광주서초": [{"date": "2026-07-01", "text": "영어 보조선생이 그만둠.\n[방향성] 영업/홍보 독려", "ts": 1782000000129}], "황성연>전남광주>일곡청솔2차": [{"date": "2026-07-01", "text": "가족 사정으로 운영에 영향(상세는 내부 기록)", "ts": 1782000000130}], "황성연>전남광주>숲광주계림": [{"date": "2026-07-01", "text": "60대 후반의 원장. 공간도 큰데 그냥저냥 하신다고. 부부끼리 함. 입지가 지금 구도심이 되어서 학생들이 줄어듬. 옮기는 것도 제안했는데 움직임이 없음.\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000131}], "황성연>전남광주>숲광주치평남": [{"date": "2026-07-01", "text": "1세대 영어숲 60대 후반의 원장. 명의변경 문의함.(그만하고 싶다고) 딸이랑 같이 하고 있음.\n[방향성] 명의변경", "ts": 1782000000132}], "황성연>전남광주>숲광주학운": [{"date": "2026-07-01", "text": "70평. 나이는 많지 않지만 방문을 꺼려함. 학생수가 적은 상권. 여러 번 이벤트 해보자고 권유 했는데 아직 움직임은 없음.(초등300명대-고립상권)\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000133}], "황성연>전남광주>숲목포신옥암": [{"date": "2026-07-01", "text": "유료이벤트를 진행해서 회원 모집이 조금 됨. 언더회원이 있던 것 같아서 관리 중. 권리금 받고 인수인계할 의사가 있음. 위치가 괜찮음.\n[방향성] 명의변경", "ts": 1782000000134}], "황성연>전남광주>숲구례": [{"date": "2026-07-01", "text": "1세대 영어숲. 조그만한 상권이라 10명 유지하는 것도 감지덕지함.\n[방향성] 영업/홍보 독려", "ts": 1782000000135}], "황성연>전남광주>IGSE광양마동": [{"date": "2026-07-01", "text": "젋은 원장. 작년 20명이었는데 인수하자마자 회원을 빼기 시작. 초등은 다 올려줘라 했더니 난리를 침…\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000136}], "황성연>전남광주>숲광주신용": [{"date": "2026-07-01", "text": "교실 김남식 사장 사위. 아내(교실문흥)랑 같이 하는 듯.(초등 1000명학교 2개)\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000137}], "황성연>전남광주>숲장흥": [{"date": "2026-07-01", "text": "학원을 혼자하는데 0명이었다가 1명이었다가 계속 왔다갔다함.\n교실회원을 올렸다 내렸다 하는 느낌임.(초등600명대)\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000138}], "황성연>전남광주>숲광주백운남": [{"date": "2026-07-01", "text": "본인 학원…영어선생님이 그만두심. 작년말부터 명의변경하려고 알아봄.\n[방향성] 명의변경", "ts": 1782000000139}], "황성연>전남광주>숲광주신가": [{"date": "2026-07-01", "text": "교실이랑 같이함. 원장 혼자함. 교실1세대라 친한사이. 마음은 떠있는 상황으로 언제든 해지 대상.\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000140}], "황성연>전남광주>숲광주일곡": [{"date": "2026-07-01", "text": "100평대 학원. 아내랑 같이함. 젊은 원장인데 2달전에 연락와서 몸이 아파 출근을 못하고 있음.\n[방향성] 영업/홍보 독려", "ts": 1782000000141}], "황성연>전남광주>숲광주상무": [{"date": "2026-07-01", "text": "인수인계하려고 알아보심.\n[방향성] 명의변경", "ts": 1782000000142}], "황성연>전남광주>숲광주수완장덕": [{"date": "2026-07-01", "text": "구) 임혜정본부장 학원 인수받음. 동력을 조금 잃은 느낌. 게릴라현수막, 이벤트, 학교앞 영업도 신청안함.\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000143}], "황성연>전남광주>숲남악오룡": [{"date": "2026-07-01", "text": "태권도 학원도 운영 중(멀리). 희망초가 9월에 오픈하면 회원모집이 더 잘될 것으로 기대(학원 앞에 생김)\n[방향성] 영업/홍보 독려\n[기타] 올해 신설", "ts": 1782000000144}], "황성연>전남광주>IGSE무안남악": [{"date": "2026-07-01", "text": "찾아가려고 해도 오지말라고~ 과금이야기. 내려주는거 아니면 뭐더러 오냐고 함.(초등 900)\n[방향성] 홍보 강화 / 해지 고려", "ts": 1782000000145}], "황성연>전남광주>IGSE금호화개": [{"date": "2026-07-01", "text": "인수인계문의함. 딸앞으로 명의를 바꿀지 권리금을 받고 팔지\n[방향성] 명의변경", "ts": 1782000000146}], "황성연>전남순천>여수죽림부영": [{"date": "2026-07-01", "text": "해지", "ts": 1782000000147}], "황성연>전남순천>숲순천연향": [{"date": "2026-07-01", "text": "아이들에게 열심히 잘 하는 원장님인데, 회원 모집이 잘 안되서 안따깝다", "ts": 1782000000148}], "황성연>전남순천>숲여수여서": [{"date": "2026-07-01", "text": "작년에도 재계약을 머뭇거리다가 고민이 많으셨던 원장님\n여수죽림부영 공부방 원장이 알바로 일하고 있음.", "ts": 1782000000149}], "황성연>전북>익산모현부영": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000150}], "황성연>전북>오수": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000151}], "황성연>전북>진안대성": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "ts": 1782000000152}], "황성연>전북>서신롯데": [{"date": "2026-07-01", "text": "[방향성] 영업/홍보 독려", "t function seedMemosOnce(){
  try{
    const store=loadMemoStore();
    let changed=false; const newItems=[];
    Object.entries(SEED_MEMOS).forEach(([k,arr])=>{
      const existing=store[k]||[];
      arr.forEach(seedItem=>{
        if(!existing.some(e=>e.ts===seedItem.ts)){ existing.push({...seedItem}); newItems.push([k,seedItem]); changed=true; }
      });
      if(existing.length) store[k]=existing;
    });
    if(changed){ _writeLocal(store);
      // 시트에도 시드 반영(중복 방지 로직은 서버에서 ts로 처리)
      if(CLOUD_URL) newItems.forEach(([k,it])=>cloudPush('add',k,it));
    }
  }catch(e){ /* localStorage 불가 환경은 폴백 사용 */ }
}
seedMemosOnce();

// 민감 정보 → 요약 대체 (원문은 대시보드 메모에만 남김)
// 주의: 단어 하나만으로 마스킹하면 업무 내용까지 가려진다.
//       (예: "아내(교실문흥)랑 같이 운영" → 가족 사정 아님)
//       → 질병·사고 '맥락'이 함께 있을 때만 마스킹한다.
const HARDSHIP = '(아프|아팠|병환|병원|입원|수술|치료|간병|투병|암|항암|사망|별세|장례|위독|진단|힘들|어려움|충격)';
const SENSITIVE_RULES = [
  {re:/(폭언|인권침해|고소|소송|법적\s*분쟁)/,               sum:'고객 클레임·분쟁 이슈 발생'},
  {re:/(암\s|암진단|항암|투병|수술|입원|이석증|대상포진|위독)/, sum:'원장 개인 건강 사유로 운영에 차질'},
  {re:/(건강상|건강\s*문제|건강\s*이슈|건강이\s*안|건강\s*악화)/, sum:'원장 개인 건강 사유로 운영에 차질'},
  {re:/(임신|출산|산후)/,                                  sum:'원장 개인 가정 사유(출산·육아 등)'},
  {re:new RegExp('(남편|아내|친정|시댁|아버지|어머니|오빠|자녀|가족).{0,25}'+HARDSHIP), sum:'가족 사정으로 운영에 영향'},
  {re:new RegExp(HARDSHIP+'.{0,25}(남편|아내|친정|시댁|아버지|어머니|오빠|자녀|가족)'), sum:'가족 사정으로 운영에 영향'},
  {re:/(이혼|우울증|정신적\s*충격)/,                        sum:'원장 개인 사정 발생'},
];
function sanitize(text){
  for(const r of SENSITIVE_RULES){
    if(r.re.test(text)) return {text:r.sum, masked:true};
  }
  return {text, masked:false};
}

// 조치 키워드 태깅 (숫자가 작을수록 시급)
// '해지'가 본문 어딘가에 스치듯 나오는 것만으로 태깅하면 과다 검출된다.
// → 실제 진행/검토 중임을 뜻하는 표현일 때만 잡는다.
const ACTION_RULES = [
  {tag:'해지',     lv:1, re:/(해지\s*(예정|검토|고려|신청|서류|접수|하겠|의사|원함)|폐업\s*(예정|고려|검토)|운영\s*중단|계약\s*종료|철수\s*(예정|검토))/},
  {tag:'인수인계', lv:2, re:/(인수인계|인수자|인계자|인수\s*(예정|희망|의사|검토)|명의\s*변경\s*(예정|진행|희망|검토)|양도\s*(예정|희망))/},
  {tag:'휴원',     lv:2, re:/(휴원|휴업|운영\s*정지)/},
  {tag:'부진',     lv:3, re:/(저실적\s*거점|회원\s*(감소|이탈)|신규\s*(회원)?\s*(가\s*)?없|유입.{0,6}없|경영\s*악화)/},
  {tag:'이전',     lv:3, re:/(이전\s*(예정|검토|고려|계획)|이사\s*(예정|계획)|거점\s*이전)/},
];
function tagAction(text){
  const hits=[];
  for(const r of ACTION_RULES) if(r.re.test(text)) hits.push(r);
  if(!hits.length) return null;
  return hits.sort((a,b)=>a.lv-b.lv)[0];
}

// 주간 범위 (월~일)
function weekRange(baseISO){
  const d = baseISO ? new Date(baseISO+'T00:00:00') : new Date();
  const dow = (d.getDay()+6)%7;                 // 월=0
  const mon = new Date(d); mon.setDate(d.getDate()-dow);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const f = x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  return {from:f(mon), to:f(sun)};
}

// 해당 매니저 · 기간의 메모 수집
function collectMemos(mgrName, from, to){
  const store = loadMemoStore();
  const out = [];
  Object.entries(store).forEach(([key, arr])=>{
    const [mgr, br, center] = key.split('>');
    if(mgr !== mgrName) return;
    (arr||[]).forEach(it=>{
      const d = normDate(it.date);
      if(!d || d < from || d > to) return;
      const s = sanitize(it.text);
      out.push({br, center, date:d, raw:it.text, text:s.text,
                masked:s.masked, action:tagAction(it.text)});
    });
  });
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.br.localeCompare(b.br));
}

// 리포트 데이터 조립
function buildWeekly(mgrIdx, from, to){
  const m = DATA.managers[mgrIdx];
  const memos = collectMemos(m.name, from, to);
  const branchMemos = memos.filter(x=>x.center===BRANCH_MEMO_KEY);
  const centerMemos = memos.filter(x=>x.center!==BRANCH_MEMO_KEY);

  // 담당 규모 · 위험 현황 (기존 분석 함수 재사용)
  let nC=0, risk=0, low=0, scoreSum=0, nB=0;
  m.branches.forEach(b=>{
    nC += b.centers.filter(c=>!c.closed).length;
    b.centers.forEach(c=>{ if(c.closed) return; if(riskLevel(c).k==='red') risk++; if(isLowCenter(c)) low++; });
    if(!b.placeholder){ scoreSum += healthMetrics(b).score; nB++; }
  });
  const avg = nB ? Math.round(scoreSum/nB) : 0;

  // 즉시 조치 (액션 태그 있는 메모 → 시급도순)
  const actions = centerMemos.filter(x=>x.action)
    .sort((a,b)=> a.action.lv-b.action.lv || a.date.localeCompare(b.date));

  // 본부별 그룹
  const byBr = {};
  centerMemos.forEach(x=>{ (byBr[x.br] = byBr[x.br]||[]).push(x); });

  return {mgr:m.name, from, to, memos, branchMemos, centerMemos, actions, byBr,
          stat:{nBranch:m.branches.length, nCenter:nC, risk, low, avg,
                nMemo:memos.length, nMasked:memos.filter(x=>x.masked).length}};
}

/* ===== 본부(Track1) 매니저 메모 패널 — 인라인, 날짜/내용 누적 =====
   센터 메모와 동일한 저장소를 사용하되 센터명 대신 '__본부메모__' 키 사용. */
const BRANCH_MEMO_KEY='__본부메모__';
function branchMemoPanelHtml(mgrName,brName){
  return `<div class="track">
    <div class="t-head"><span class="badge">MEMO</span><h4>🗒️ 본부 매니저 메모 <span id="brMemoCnt" style="font-size:12px;font-weight:400;color:var(--muted)"></span></h4></div>
    <div class="dm-memo" style="border-top:none;padding-top:0">
      <div class="dm-memo-form">
        <input type="date" id="brMemoDate" class="memo-date" value="${todayStr()}">
        <input type="text" id="brMemoText" class="memo-text" placeholder="본부 단위 메모 입력 후 Enter 또는 추가"
          onkeydown="if(event.key==='Enter')submitBranchMemo()">
        <button class="memo-add" onclick="submitBranchMemo()">＋ 추가</button>
      </div>
      <div id="brMemoLog" class="dm-memo-log"></div>
    </div>
  </div>`;
}
let _brMemoCtx=null;
function initBranchMemo(mgrName,brName){ _brMemoCtx={mgr:mgrName,br:brName}; renderBranchMemoLog(); }
function submitBranchMemo(){
  if(!_brMemoCtx) return;
  const d=document.getElementById('brMemoDate'), t=document.getElementById('brMemoText');
  if(addMemoLog(_brMemoCtx.mgr,_brMemoCtx.br,BRANCH_MEMO_KEY,d.value,t.value)){ t.value=''; renderBranchMemoLog(); t.focus(); }
}
function renderBranchMemoLog(){
  if(!_brMemoCtx) return;
  const log=getMemoLog(_brMemoCtx.mgr,_brMemoCtx.br,BRANCH_MEMO_KEY)
    .slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.ts-b.ts);
  const el=document.getElementById('brMemoLog'); if(!el)return;
  const cnt=document.getElementById('brMemoCnt'); if(cnt) cnt.textContent=log.length?`(${log.length}건)`:'';
  if(!log.length){ el.innerHTML='<div class="memo-empty">본부 단위 메모가 없습니다. 날짜와 내용을 입력해 추가하세요.</div>'; return; }
  el.innerHTML=log.map(x=>`<div class="memo-item">
    <div class="memo-item-date">${normDate(x.date)||'-'}</div>
    <div class="memo-item-text">${eschtml(x.text)}</div>
    <button class="memo-del" title="삭제" onclick="removeBranchMemo(${x.ts})">✕</button>
  </div>`).join('');
}
function removeBranchMemo(ts){
  if(!_brMemoCtx) return;
  deleteMemoLog(_brMemoCtx.mgr,_brMemoCtx.br,BRANCH_MEMO_KEY,ts);
  renderBranchMemoLog();
}
function memValid(c){ return c.mem.filter(v=>v!==null&&v!==undefined); }
// 첫→마지막 관측 증감
function memTrend(c){
  const v=memValid(c);
  if(v.length<2) return {first:v[0]??null,last:v[0]??null,diff:0,pct:0};
  const first=v[0],last=v[v.length-1],diff=last-first;
  return {first,last,diff,pct:first?Math.round(diff/first*100):0};
}
// 최근 추세(마지막 2개월)
function recentDrop(c){
  const v=memValid(c);
  if(v.length<2) return 0;
  return v[v.length-1]-v[v.length-2];
}
// 스파크라인 (▁▂▃▄▅▆▇)
function sparkline(mem){
  const blocks='▁▂▃▄▅▆▇';
  const vals=mem.map(v=>(v===null||v===undefined)?null:v);
  const nums=vals.filter(v=>v!==null);
  if(!nums.length) return '─────';
  const mn=Math.min(...nums),mx=Math.max(...nums),rng=mx-mn||1;
  return vals.map(v=>v===null?' ':blocks[Math.round((v-mn)/rng*(blocks.length-1))]).join('');
}
// 센터 위험도: 회원감소·저실적·면담공백·최근하락 종합
// 위험도 분류 — 1순위: 회원추세(감소 여부) / 2순위: 저실적 기준(실제 인원 임계치 이하, 추세와 무관하게 적용)
function riskLevel(c){
  const t=memTrend(c), low=isLowCenter(c), noMng=c.mng.months.length===0, rec=recentDrop(c);
  // 1순위: 회원 추세가 감소 중이면 최소 주의, 다른 악재가 겹치면 위험
  if(t.diff<0){
    if(t.pct<=-30 || noMng || rec<0) return {k:'red',t:'🔴 위험'};
    return {k:'yel',t:'🟡 주의'};
  }
  // 2순위: 추세가 감소가 아니어도, 실제 인원이 저실적 기준 이하면 별도로 위험 신호
  if(low){
    if(noMng) return {k:'red',t:'🔴 위험'};
    return {k:'yel',t:'🟡 주의'};
  }
  if(rec<0) return {k:'yel',t:'🟡 주의'};
  return {k:'grn',t:'🟢 양호'};
}
// 관리 우선순위: 1 감소+미면담 / 2 저실적 / 3 감소 / 4 관리중
function priorityTier(c){
  const t=memTrend(c), low=isLowCenter(c), noMng=c.mng.months.length===0;
  if(t.diff<0 && noMng) return 1;
  if(low) return 2;
  if(t.diff<0) return 3;
  return 4;
}
// Track2 정렬 모드 (본부별 키로 상태 유지)
let _t2SortMode = {};
const T2_BM_ORDER = {'학원(숲)':0, '학원(IGSE)':1, '학원(상가형)':2, '교습소':3, '공부방':4};
function t2Key(brName){ return brName.replace(/[^a-zA-Z0-9가-힣]/g,''); }
function t2SortComparator(mode){
  if(mode==='mem_desc') return (a,b)=> (b.c.mem[LI]??-Infinity) - (a.c.mem[LI]??-Infinity);
  if(mode==='mem_asc')  return (a,b)=> (a.c.mem[LI]??Infinity) - (b.c.mem[LI]??Infinity);
  if(mode==='bm') return (a,b)=> (T2_BM_ORDER[a.c.form]??9)-(T2_BM_ORDER[b.c.form]??9) || a.tier-b.tier;
  return (a,b)=> a.diff-b.diff || b.u-a.u; // priority(기본) — 회원추세 감소가 큰(가장 음수인) 센터 먼저
}
function t2FilterBarHtml(brName){
  const key = t2Key(brName);
  const mode = _t2SortMode[key] || 'priority';
  const opts = [['priority','우선순위(회원추세 감소순)'],['mem_desc','실회원 많은순'],['mem_asc','실회원 적은순'],['bm','BM별(숲→IGSE→상가형→교습소→공부방)']];
  return `<div class="t2-filter-bar">
    <label>정렬</label>
    <select onchange="changeT2Sort('${key}', this.value)">
      ${opts.map(([v,l])=>`<option value="${v}" ${mode===v?'selected':''}>${l}</option>`).join('')}
    </select>
  </div>`;
}
function changeT2Sort(key, mode){
  _t2SortMode[key] = mode;
  const tbody = document.getElementById('t2body-'+key);
  if(tbody && typeof route!=='undefined' && route.view==='br'){
    const m = DATA.managers[route.mgr], b = m.branches[route.br];
    tbody.innerHTML = buildTrack2Rows(m, b, route.mgr, route.br);
  }
}
// Track2 행 생성(정렬 모드 반영) — 초기 렌더와 필터 변경 시 재사용
function buildTrack2Rows(m, b, mgrIdx, brIdx){
  const mode = _t2SortMode[t2Key(b.name)] || 'priority';
  const ordered = b.centers.map((c,idx)=>({c,idx})).filter(x=>!x.c.closed)
    .map(x=>({c:x.c, idx:x.idx, tier:priorityTier(x.c), u:urgencyScore(x.c), diff:memTrend(x.c).diff}))
    .sort(t2SortComparator(mode));
  return ordered.map(({c,idx})=>{
    const low = isLowCenter(c);
    const cells = MONTH_LABELS.map((_,i)=>{
      const v = c.mem[i]; const flag = isLowMonth(c,i);
      return `<td class="num ${flag?'warn':''}">${v===null?'-':v}${flag?' 🚨':''}</td>`;
    }).join('');
    // 면담 히트맵: 공식 면담 기록(mng.months) + 센터 메모가 남겨진 월도 함께 반영
    const memoMonths = new Set();
    getMemoLog(m.name, b.name, c.name).forEach(x=>{
      const d = normDate(x.date);
      if(d && d.slice(0,4) === '2026'){ memoMonths.add(parseInt(d.slice(5,7),10)); }
    });
    const heat = `<span class="heat">${MONTH_LABELS.map((_,i)=>{
      const mon=i+1;
      const hasInterview=c.mng.months.includes(mon);
      const hasMemo=memoMonths.has(mon);
      const on = hasInterview || hasMemo;
      const label = hasInterview && hasMemo ? '면담+메모' : hasInterview ? '면담' : hasMemo ? '메모' : '미면담';
      return `<span class="${on?'on':'off'}" title="${mon}월 ${label}"></span>`;
    }).join('')}</span>`;
    const t=memTrend(c);
    const trendTxt = `${t.first??'-'}→${t.last??'-'} <b class="${t.diff>0?'delta-up':t.diff<0?'delta-down':'delta-flat'}">${t.diff>0?'+':''}${t.diff}</b>`;
    const risk=riskLevel(c);
    const tier=priorityTier(c);
    const prioLabel={1:'1순위',2:'2순위',3:'3순위',4:'4순위'}[tier];
    const mc=memoCount(m.name,b.name,c.name);
    return `<tr class="${low?'low-row':''}">
      <td><span class="prio-tag prio-${tier}">${prioLabel}</span></td>
      <td><a class="center-link" onclick="openCenterDetail(${mgrIdx},${c._origBrIdx!==undefined?c._origBrIdx:brIdx},${c._origCIdx!==undefined?c._origCIdx:idx})">${c.name}<span class="memo-badge" id="memobadge-${idx}">${mc?`📝${mc}`:''}</span></a></td>
      <td class="num">${c.form}</td>${cells}
      <td class="num">${heat}</td>
      <td class="num trend-cell">${trendTxt}</td>
      <td class="num risk-dot risk-${risk.k}">${risk.t}</td></tr>`;
  }).join('');
}
// 면담 TOP5 점수 (높을수록 시급)
function urgencyScore(c){
  const t=memTrend(c), rec=recentDrop(c), noMng=c.mng.months.length===0;
  let s=0;
  s += Math.max(0,-t.diff)*3;              // 감소폭
  s += Math.max(0,-t.pct);                  // 감소율
  if(isLowCenter(c)) s+=15;                 // 저실적
  if(noMng) s+=12;                          // 면담 공백
  if(rec<0) s+= -rec*2;                     // 최근 하락 가속
  const v=memValid(c);
  if(v.length && v[0]===0 && t.diff>=0 && t.last<=threshold(c.form)) s+=8; // 신설 정체
  return s;
}
function topInterviewCenters(b,n){
  return b.centers.map(c=>({c,s:urgencyScore(c)}))
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.c);
}
// 본부 KPI 합계 + 전월(마지막-직전월) 증감
function kpiTotals(b){
  const sum=k=>b.track1.reduce((s,r)=>s+(+r[k]||0),0);
  const delta=k=>{const t=b.track1; if(t.length<2)return 0; return (+t[t.length-1][k]||0)-(+t[t.length-2][k]||0);};
  return {
    면담:{v:sum('면담'),d:delta('면담')},
    모임:{v:sum('모임'),d:delta('모임')},
    영업:{v:sum('영업'),d:delta('영업')},
    개설:{v:sum('개설'),d:delta('개설')}
  };
}
// 본부 건강도 5축(0~100) + 종합점수
function healthMetrics(b){
  const centers = b.centers.filter(c=>!c.closed); // 해지 센터는 건강도 계산에서 제외
  const n=centers.length||1;
  const mngd=centers.filter(c=>c.mng.months.length>0).length;
  const 관리율=mngd/n*100;
  const 면담총=b.track1.reduce((s,r)=>s+(+r.면담||0),0);
  const 면담율=Math.min(100, 면담총/n*100);
  const inc=centers.filter(c=>memTrend(c).diff>0).length;
  const dec=centers.filter(c=>memTrend(c).diff<0).length;
  const 회원증감=Math.round(((inc-dec)/n+1)/2*100); // -전부감소0 ~ +전부증가100
  const 영업총=b.track1.reduce((s,r)=>s+(+r.영업||0),0);
  const 영업활동=Math.min(100, 영업총*4);
  const 개설총=b.track1.reduce((s,r)=>s+(+r.개설||0),0);
  const 개설활동=Math.min(100, 개설총*20);
  const axes={관리율,면담율,회원증감,영업활동,개설활동};
  const score=Math.round((관리율*0.3+면담율*0.2+회원증감*0.2+영업활동*0.15+개설활동*0.15));
  const grade= score>=70?{k:'good',t:'🟢 양호'}: score>=45?{k:'warn',t:'🟡 보통'}:{k:'risk',t:'🔴 취약'};
  return {axes,score,grade,관리율,면담율,회원증감,inc,dec,mngd,n};
}
// SWOT 규칙 기반
function buildSWOT(b){
  const h=healthMetrics(b);
  const centers = b.centers.filter(c=>!c.closed); // 해지 센터는 SWOT 계산에서 제외
  const lowN=centers.filter(isLowCenter).length;
  const noMngN=centers.filter(c=>c.mng.months.length===0).length;
  const igse=centers.filter(c=>c.form==='학원(IGSE)');
  const igseNoMng=igse.filter(c=>c.mng.months.length===0).length;
  const 개설총=b.track1.reduce((s,r)=>s+(+r.개설||0),0);
  const 영업총=b.track1.reduce((s,r)=>s+(+r.영업||0),0);
  const S=[],W=[],O=[],T=[];
  if(h.관리율>=60) S.push('관리 커버리지 우수('+h.관리율.toFixed(0)+'%)');
  if(영업총>=15) S.push('영업활동 활발(누적 '+영업총+'건)');
  if(h.inc>h.dec) S.push('회원 증가 센터 다수('+h.inc+'개)');
  if(centers.some(c=>c.mng.months.length>=3)) S.push('정기·집중관리 센터 확보');
  if(!S.length) S.push('5개월 활동보고서 제출로 추적 기반 확보');
  if(h.면담율<40) W.push('센터 면담율 낮음('+h.면담율.toFixed(0)+'%)');
  if(igse.length&&igseNoMng/igse.length>=0.5) W.push('IGSE 관리 부족('+igseNoMng+'/'+igse.length+' 미관리)');
  if(noMngN>centers.length*0.5) W.push('미면담 센터 과다('+noMngN+'개)');
  if(lowN>0) W.push('저실적 센터 '+lowN+'개 상존');
  if(!W.length) W.push('특이 약점 없음 — 현 수준 유지');
  if(개설총>=5) O.push('개설상담 지속(누적 '+개설총+'건) → 신규 파이프라인');
  if(centers.some(c=>{const v=memValid(c);return v.length&&v[0]===0&&memTrend(c).diff>0;})) O.push('신설 센터 회원 상승 반전 여지');
  if(h.inc>0) O.push('증가세 센터 성공사례 수평전개 가능');
  if(!O.length) O.push('저활동 지역 신규 영업 여지');
  if(lowN>=centers.length*0.3) T.push('저실적 센터 비중 높음('+lowN+'/'+centers.length+')');
  if(h.dec>h.inc) T.push('회원 감소 센터 우위('+h.dec+'개)');
  if(centers.some(c=>memTrend(c).pct<=-40)) T.push('급감(-40%↑) 센터 존재 — 이탈 위험');
  if(!T.length) T.push('단기 위협 요인 낮음');
  return {S,W,O,T};
}

function buildGuide(b){
  const h=healthMetrics(b);
  const lowN=b.centers.filter(isLowCenter).length;
  const noMngN=b.centers.filter(c=>c.mng.months.length===0).length;
  const decN=b.centers.filter(c=>memTrend(c).diff<0).length;
  const igse=b.centers.filter(c=>c.form==='학원(IGSE)');
  const igseNoMng=igse.filter(c=>c.mng.months.length===0).length;
  const 신설=b.centers.filter(c=>{const v=memValid(c);return v.length&&v[0]===0;}).length;
  const Q=[],A=[];
  if(noMngN>0){Q.push('미면담 센터 '+noMngN+'개의 관리 공백 사유는?');A.push('미면담 센터 우선 방문 일정 수립');}
  if(decN>0){Q.push('회원 감소 센터 '+decN+'개의 이탈 원인은?');A.push('회원 감소 원인 분석 및 리텐션 조치');}
  if(lowN>0){Q.push('저실적 센터 '+lowN+'개의 개선 방안은?');A.push('저실적 센터 집중 방문·홍보 지원');}
  if(신설>0){Q.push('신설 센터 '+신설+'개의 정착 지원 계획은?');A.push('신설 센터 개설 Follow-up 점검');}
  if(igse.length&&igseNoMng>0){Q.push('IGSE '+igseNoMng+'개 미관리 대응 계획은?');A.push('IGSE 계열 집중관리 체계 마련');}
  Q.push('하반기 우선 관리 대상과 지원 필요 센터는?');
  if(!A.length) A.push('현 관리 수준 유지 및 우수사례 공유');
  return {Q:Q.slice(0,6),A:A.slice(0,5)};
}
// Executive Summary 문장 자동 생성
function buildExecSummary(b){
  const h=healthMetrics(b);
  const lowN=b.centers.filter(isLowCenter).length;
  const decN=b.centers.filter(c=>memTrend(c).diff<0).length;
  const noMngN=b.centers.filter(c=>c.mng.months.length===0).length;
  const igse=b.centers.filter(c=>c.form==='학원(IGSE)');
  const igseNoMng=igse.filter(c=>c.mng.months.length===0).length;
  const 영업총=b.track1.reduce((s,r)=>s+(+r.영업||0),0);
  const 면담총=b.track1.reduce((s,r)=>s+(+r.면담||0),0);
  const parts=[];
  // 활동 대비 관리
  if(영업총>=10 && h.면담율<40)
    parts.push(`<b>${b.name}</b> 본부는 영업활동(누적 ${영업총}건)은 활발하지만 <b>센터 면담 커버리지가 낮습니다</b>(관리율 ${h.관리율.toFixed(0)}%).`);
  else if(면담총>=10 && h.관리율>=50)
    parts.push(`<b>${b.name}</b> 본부는 면담·관리가 비교적 촘촘히 이뤄지고 있습니다(관리율 ${h.관리율.toFixed(0)}%).`);
  else
    parts.push(`<b>${b.name}</b> 본부는 전반적으로 현장 활동량이 제한적이며 관리율은 ${h.관리율.toFixed(0)}%입니다.`);
  if(decN>0) parts.push(`회원 감소 센터는 <b>${decN}개</b>${lowN?`, 저실적 센터는 <b>${lowN}개</b>`:''}입니다.`);
  else if(lowN>0) parts.push(`저실적 센터가 <b>${lowN}개</b> 확인됩니다.`);
  if(igse.length&&igseNoMng/igse.length>=0.5) parts.push(`특히 <b>IGSE 관리가 부족</b>합니다(${igseNoMng}/${igse.length} 미관리).`);
  // 다음 액션
  const acts=[];
  if(lowN>0) acts.push('저실적 센터 방문');
  if(b.centers.some(c=>{const v=memValid(c);return v.length&&v[0]===0;})) acts.push('신설 센터 지원');
  if(noMngN>0) acts.push('미면담 센터 접촉');
  if(!acts.length) acts.push('우수 센터 사례 확산');
  parts.push(`다음 달에는 <b>${acts.join('</b>, <b>')}</b>을(를) 우선 추진하는 것이 좋습니다.`);
  return parts.join(' ');
}

function parseHash(){
  const h = (location.hash || '#home').slice(1);
  if(h==='home' || h==='') return {view:'home'};
  const mHomeSec = h.match(/^home:(mem|engrev|new|curi|network)$/);
  if(mHomeSec) return {view:'home', scrollTo:mHomeSec[1]};
  const mHq = h.match(/^hq:(eng|curi)$/);
  if(mHq) return {view:'hq', section:mHq[1]};
  const mHqCuri = h.match(/^hqcuri:([^/]+)\/(.+)$/);
  if(mHqCuri) return {view:'hqcuri', mgr:decodeURIComponent(mHqCuri[1]), region:decodeURIComponent(mHqCuri[2])};
  if(h==='allcenters') return {view:'allcenters'};
  if(h==='map') return {view:'map'};
  if(h==='restore') return {view:'restore'};
  if(h==='intercom') return {view:'intercom'};
  if(h==='perf') return {view:'perf'};
  if(h==='open') return {view:'open'};
  if(h==='zone') return {view:'zone'};
  if(h==='conv:both' || h==='conv:xls' || h==='conv:pdf') return {view:'conv', kind:'both'};
  if(h==='conv:arpt') return {view:'conv', kind:'arpt'};
  const mAllList = h.match(/^allcenters:(eng|math|lc)$/);
  if(mAllList) return {view:'allcenterslist', brand:mAllList[1]};
  const mDoc = h.match(/^doc:(.+)$/);
  if(mDoc){
    const id = decodeURIComponent(mDoc[1]);
    if(DOC_LINKS.some(d=>d.id===id)) return {view:'doc', doc:id};
  }
  const mVoc = h.match(/^voc:(.+)$/);
  if(mVoc){
    const vn = decodeURIComponent(mVoc[1]);
    if(vn==='전체') return {view:'voc', mgr:-1};
    if(vn==='사업부') return {view:'voc', mgr:-2, biz:''};
    if(vn.startsWith('사업부:')) return {view:'voc', mgr:-2, biz:vn.slice(4)};
    const mi = DATA.managers.findIndex(m=>m.name===vn);
    if(mi>=0) return {view:'voc', mgr:mi};
  }
  const mMgr = h.match(/^mgr:([^/]+)$/);
  if(mMgr){
    const mi = DATA.managers.findIndex(m=>m.name===decodeURIComponent(mMgr[1]));
    if(mi>=0) return {view:'mgr', mgr:mi, br:null};
  }
  const mBr = h.match(/^mgr:([^/]+)\/br:([^/]+)(?:\/merged:([^/]+))?(?:\/mlabel:(.+))?$/);
  if(mBr){
    const mi = DATA.managers.findIndex(m=>m.name===decodeURIComponent(mBr[1]));
    if(mi>=0){
      const bi = DATA.managers[mi].branches.findIndex(b=>b.name===decodeURIComponent(mBr[2]));
      if(bi>=0){
        const r = {view:'br', mgr:mi, br:bi};
        if(mBr[3]) r.mergedBrs = mBr[3].split(',').map(s=>decodeURIComponent(s));
        if(mBr[4]) r.mergedLabel = decodeURIComponent(mBr[4]);
        return r;
      }
    }
  }
  return {view:'home'};
}
function stringifyRoute(r){
  if(r.view==='home') return r.scrollTo ? `home:${r.scrollTo}` : 'home';
  if(r.view==='hq') return `hq:${r.section}`;
  if(r.view==='hqcuri') return `hqcuri:${encodeURIComponent(r.mgr)}/${encodeURIComponent(r.region)}`;
  if(r.view==='allcenters') return 'allcenters';
  if(r.view==='map') return 'map';
  if(r.view==='restore') return 'restore';
  if(r.view==='intercom') return 'intercom';
  if(r.view==='perf') return 'perf';
  if(r.view==='open') return 'open';
  if(r.view==='zone') return 'zone';
  if(r.view==='conv') return r.kind==='arpt' ? 'conv:arpt' : 'conv:both';
  if(r.view==='allcenterslist') return `allcenters:${r.brand}`;
  if(r.view==='doc') return `doc:${encodeURIComponent(r.doc)}`;
  if(r.view==='voc') return `voc:${encodeURIComponent(vocRouteKey(r))}`;
  if(r.view==='mgr') return `mgr:${encodeURIComponent(DATA.managers[r.mgr].name)}`;
  if(r.view==='br'){
    let s = `mgr:${encodeURIComponent(DATA.managers[r.mgr].name)}/br:${encodeURIComponent(DATA.managers[r.mgr].branches[r.br].name)}`;
    if(r.mergedBrs && r.mergedBrs.length){
      s += `/merged:${r.mergedBrs.map(n=>encodeURIComponent(n)).join(',')}`;
      if(r.mergedLabel) s += `/mlabel:${encodeURIComponent(r.mergedLabel)}`;
    }
    return s;
  }
}
