/* ===== 계약서식 폴더 — 파일 목록(다운로드·URL 전달·이메일 발송) =====
   구글드라이브 폴더를 통째로 iframe에 넣는 대신, Apps Script가 폴더 안 파일 목록만
   가벼운 형태로 가져와서 여기서 직접 표로 그린다. */
function _driveFolderId(d){
  const m = d.url.match(/folders\/([^/?]+)/);
  return m ? m[1] : null;
}
// 서버 조회(GET) — ① fetch(쿠키 없이) 우선 → ② 실패 시 JSONP(<script>)로 재시도
// 구글 계정이 여러 개 로그인된 PC에서는 <script> 방식이 구글 로그인 쿠키 때문에 막히는 경우가 있어,
// 메모 동기화와 같은 fetch 방식을 먼저 쓰고, 그래도 안 될 때만 JSONP를 쓴다.
async function _jsonpGet(url, timeoutMs){
  const ms = timeoutMs || 20000;
  let fetchErr = null;
  try{
    const ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    const tid = setTimeout(()=>ctrl && ctrl.abort(), ms);
    const res = await fetch(url + (url.includes('?')?'&':'?') + '_=' + Date.now(),
      {method:'GET', credentials:'omit', cache:'no-store', signal: ctrl ? ctrl.signal : undefined});
    clearTimeout(tid);
    const data = await res.json();
    if(!data.ok) throw Object.assign(new Error(data.error || '요청이 실패했습니다.'), {server:true});
    return data;
  }catch(e){
    if(e && e.server) throw e;                      // 서버가 보낸 오류는 그대로 표시
    if(e && e.name==='AbortError') throw new Error('서버 응답이 너무 오래 걸립니다.');
    fetchErr = e;                                   // 네트워크/형식 오류 → JSONP로 재시도
  }
  return _jsonpScriptGet(url, ms, fetchErr);
}
function _jsonpScriptGet(url, timeoutMs, prevErr){
  return new Promise((resolve, reject)=>{
    const cbName = '__jsonpCb' + Date.now() + Math.floor(Math.random()*10000);
    let timeoutId;
    window[cbName] = function(data){
      clearTimeout(timeoutId); delete window[cbName]; script.remove();
      if(!data.ok) return reject(new Error(data.error || '요청이 실패했습니다.'));
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = url + (url.includes('?')?'&':'?') + 'callback=' + cbName + '&_=' + Date.now();
    script.onerror = ()=>{ clearTimeout(timeoutId); delete window[cbName]; script.remove();
      reject(new Error('서버에 연결할 수 없습니다.' + (prevErr ? ' (fetch: ' + (prevErr.message||prevErr) + ')' : ''))); };
    timeoutId = setTimeout(()=>{ delete window[cbName]; script.remove(); reject(new Error('서버 응답이 너무 오래 걸립니다.')); }, timeoutMs);
    document.head.appendChild(script);
  });
}
function _fmtFileSize(bytes){
  if(bytes < 1024) return bytes + 'B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}
function renderDriveFileList(d){
  const folderId = _driveFolderId(d);
  app.innerHTML = `
    <div class="doc-bar">
      <b>${d.label}</b>
      <span class="doc-note">파일별로 다운로드하거나, 카톡·문자 등으로 바로 전달할 수 있습니다.</span>

    document.getElementById('driveFileListWrap').innerHTML = '<p class="hint">폴더 주소를 확인하지 못했습니다.</p>';
    return;
  }
  _jsonpGet(CLOUD_URL + '?action=listDriveFiles&folderId=' + encodeURIComponent(folderId))
    .then(data=>{
      const wrap = document.getElementById('driveFileListWrap');
      if(!wrap) return;

      }

        <tbody>${data.files.map(f=>`
          <tr>
            <td>${eschtml(f.name)}</td>
            <td class="num">${_fmtFileSize(f.size)}</td>
            <td class="num">${f.updated.slice(0,10)}</td>
            <td>
              <button class="map-capture-btn" style="padding:5px 10px;font-size:12px" onclick="downloadDriveFile('${f.id}','${jsq(f.name)}')">📥 다운로드</button>
              <button class="map-capture-btn" style="padding:5px 10px;font-size:12px" onclick="copyDriveFileUrl('${f.id}')">🔗 URL 전달</button>
              <button class="map-capture-btn" style="padding:5px 10px;font-size:12px" onclick="emailDriveFilePrompt('${f.id}','${jsq(f.name)}')">✉️ 이메일</button>
            </td>
          </tr>`).join('')}</tbody>
      </table>`;
    })
    .catch(e=>{
      const wrap = document.getElementById('driveFileListWrap');
      if(wrap) wrap.innerHTML = `<p class="hint">⚠️ 파일 목록을 불러오지 못했습니다: ${eschtml(e.message)}</p>`;
    });
}
function _base64ToBlob(base64, mimeType){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
  return new Blob([new Uint8Array(byteNumbers)], {type: mimeType});
}
async function downloadDriveFile(fileId, name){
  try{
    const data = await _jsonpGet(CLOUD_URL + '?action=getDriveFileContent&fileId=' + encodeURIComponent(fileId));
    const blob = _base64ToBlob(data.base64, data.mimeType);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = data.name || name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('다운로드에 실패했습니다: ' + e.message);
  }
}
// 파일 내용을 직접 공유하려던 방식은 서버에서 파일을 받아오는 대기시간 때문에
// 브라우저가 "사용자가 방금 누른 조작이 아니다"로 판단해 공유가 거부되는 문제가 있어서 제외함.
// 대신 그 파일의 보기 링크(URL)만 복사해서 전달하는 방식으로 대체(중단 복원 업무의 URL 전달과 동일한 방식).
function copyDriveFileUrl(fileId){
  const url = `https://drive.google.com/file/d/${fileId}/view?usp=sharing`;
  navigator.clipboard.writeText(url).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e2){}
    ta.remove();
  }).finally(()=>{ showRestoreCopyModal(); });
}
function emailDriveFilePrompt(fileId, name){
  const to = prompt(`"${name}" 파일을 보낼 받는 사람 이메일을 입력해 주세요.`);
  if(!to) return;
  emailDriveFile(fileId, to);
}
async function emailDriveFile(fileId, to){
  try{
    const res = await fetch(CLOUD_URL, {method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'emailDriveFile', fileId, to})});
    const data = await res.json();
    if(data.ok) alert('이메일을 발송했습니다.');
    else alert('발송 실패: ' + (data.error||''));
  }catch(e){
    alert('발송 중 오류가 발생했습니다: ' + e.message);
  }
}

// '홈'처럼 헤더 자체도 이동 가능한 그룹: 펼침/접힘 + 이동을 한 번에 처리
function navigableGroupClicked(id, route){ _sbExpanded[id] = !_sbExpanded[id]; go(route); }

function menuItemRoute(id){
  // 하위메뉴 id → go() 라우트로 변환 (홈 섹션/매니저/본사직영/VOC/문서 모두 지원)
  if(id.startsWith('home:')) return {view:'home', scrollTo:id.slice(5)};
  if(id.startsWith('hq:')) return {view:'hq', section:id.slice(3)};
  if(id.startsWith('mgr:')){
    const name = id.slice(4);
    return {view:'mgr', mgr:DATA.managers.findIndex(m=>m.name===name)};
  }
  if(id.startsWith('voc:')){
    const name = id.slice(4);
    if(name==='전체') return {view:'voc', mgr:-1};
    if(name==='사업부') return {view:'voc', mgr:-2, biz:''};
    if(name.startsWith('사업부:')) return {view:'voc', mgr:-2, biz:name.slice(4)};
    return {view:'voc', mgr:DATA.managers.findIndex(m=>m.name===name)};
  }
  if(id.startsWith('doc:')) return {view:'doc', doc:id.slice(4)};
  if(id.startsWith('allcenters:')) return {view:'allcenterslist', brand:id.slice(11)};
  if(id==='archive:map') return {view:'map'};
  if(id==='archive:formHq') return {view:'doc', doc:'formHq'};
  if(id==='office:restore') return {view:'restore'};
  if(id==='office:opendash') return {view:'doc', doc:'opendash'};
  if(id==='office:formMgr') return {view:'doc', doc:'formMgr'};
  if(id==='office:intercom') return {view:'intercom'};
  if(id==='office:perf') return {view:'perf'};
  if(id==='office:open') return {view:'open'};
  if(id==='office:zone') return {view:'zone'};
  if(id==='office:conv') return {view:'conv', kind:'both'};
  if(id==='office:arpt') return {view:'conv', kind:'arpt'};
  return {view:'home'};
}
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  const activeMgrName = (route.view==='mgr'||route.view==='br') ? DATA.managers[route.mgr].name : null;
  const activeVocName = route.view==='voc' ? vocRouteKey(route) : null;
  let html = `<button class="sb-collapse-btn" onclick="toggleSidebarCollapse()" title="사이드 메뉴 접기">«</button><div class="sb-brand" style="cursor:pointer" onclick="go({view:'home'})">통합 캔버스</div>`;
  MENU.forEach(item=>{
    if(item.type==='caption'){ html += `<div class="sb-caption">${item.label}</div>`; return; }
    if(item.type==='single'){
      const active = route.view===item.id ? 'active' : '';
      html += `<div class="menu-item ${active}" onclick="go({view:'${item.id}'})">${item.label}</div>`;
    } else {
      const kids = item.children();
      const exp = _sbExpanded[item.id];
      const headerActive = item.navigable && route.view===item.id && !route.scrollTo ? 'active' : '';
      const headerClick = item.navigable
        ? `navigableGroupClicked('${item.id}', {view:'${item.id}'})`
        : `toggleMenuGroup('${item.id}')`;
      html += `<div class="menu-item ${exp?'expanded':''} ${headerActive}" onclick="${headerClick}">${item.label}<span class="chev">›</span></div>`;
      html += `<div class="submenu" style="max-height:${exp? (kids.length*34+10)+'px':'0'}">`;
      kids.forEach(k=>{
        const isActive = k.id.startsWith('home:') ? (route.view==='home' && route.scrollTo===k.id.slice(5))
                        : k.id.startsWith('hq:') ? (route.view==='hq' && route.section===k.id.slice(3))
                        : k.id.startsWith('mgr:') ? (activeMgrName===k.id.slice(4))
                        : k.id.startsWith('voc:') ? (activeVocName===k.id.slice(4))
                        : k.id.startsWith('doc:') ? (route.view==='doc' && route.doc===k.id.slice(4))
                        : k.id==='archive:map' ? (route.view==='map')
                        : k.id==='archive:formHq' ? (route.view==='doc' && route.doc==='formHq')
                        : k.id==='office:restore' ? (route.view==='restore')
                        : k.id==='office:opendash' ? (route.view==='doc' && route.doc==='opendash')
                        : k.id==='office:formMgr' ? (route.view==='doc' && route.doc==='formMgr')
                        : k.id==='office:intercom' ? (route.view==='intercom')
                        : k.id==='office:perf' ? (route.view==='perf')
                        : k.id==='office:open' ? (route.view==='open')
                        : k.id==='office:zone' ? (route.view==='zone')
                        : k.id==='office:conv' ? (route.view==='conv' && route.kind!=='arpt')
                        : k.id==='office:arpt' ? (route.view==='conv' && route.kind==='arpt')
                        : false;
        if(k.subToggle){ // 하위 토글(예: 개설 VOC › 사업부): 클릭 시 이동 + 펼침/접힘
          const open = !!_sbExpanded[k.subToggle];
          html += `<div class="submenu-item sb-subtoggle ${open?'open':''} ${isActive?'active':''}" onclick='_sbExpanded["${k.subToggle}"]=!_sbExpanded["${k.subToggle}"]; go(${JSON.stringify(menuItemRoute(k.id))}); renderSidebar();'>${k.label}<span class="chev">›</span></div>`;
        } else {
          html += `<div class="submenu-item ${k.indent?'sb-indent':''} ${isActive?'active':''}" onclick='go(${JSON.stringify(menuItemRoute(k.id))})'>${k.label}</div>`;
        }
      });
      html += `</div>`;
    }
  });
  sb.innerHTML = html;
}

/* ===== 상단 탭 — 열어본 메뉴를 탭으로 쌓아 두고 오갈 수 있게 한다 =====
   · 메뉴(화면) 하나당 탭 하나. 최대 TAB_MAX개(넘으면 가장 오래 안 쓴 탭부터 닫힘).
   · 지도·개설 관리·전체 현황 등(TAB_KEEP)은 화면을 지우지 않고 숨겨 두었다가 그대로 다시 보여준다 → 검색·선택·스크롤·지도 위치 유지.
   · 매니저·VOC·문서 등은 같은 화면 코드를 공유하므로 '경로+스크롤'만 기억했다가 다시 그린다. */
const TAB_MAX = 8;
const TAB_KEEP = ['map','open','allcenters','restore','intercom','perf','zone','conv:both','conv:arpt'];
const _tabs = [];          // {key, route, keep, pane, scroll, shown}
let _tabCur = null, _tabForce = null;
function _tabKeyOf(r){
  switch(r.view){
    case 'allcenters': case 'allcenterslist': return 'allcenters';
    case 'mgr': case 'br': return 'mgr:'+r.mgr;
    case 'voc': return 'voc:'+vocRouteKey(r);
    case 'doc': return 'doc:'+r.doc;
    case 'conv': return 'conv:'+(r.kind==='arpt'?'arpt':'both');
    case 'hq': case 'hqcuri': return 'hq';
    default: return r.view;
  }
}
function _tabLabelOf(r){
  try{
    switch(r.view){
      case 'home': return '🏠 대시보드';
      case 'mgr': case 'br': return '👤 '+DATA.managers[r.mgr].name;
      case 'allcenters': case 'allcenterslist': return '📋 전체 현황';
      case 'voc': { const k=vocRouteKey(r); return '📞 VOC · '+(k==='전체'?'전사':k.replace(/^사업부:?/,'사업부 ').trim()); }
      case 'doc': { const d=DOC_LINKS.find(x=>x.id===r.doc); return '📁 '+(d?d.label:'문서'); }
      case 'map': return '🗺️ 지도';
      case 'open': return '📋 개설 관리';
      case 'restore': return '🔁 중단 복원';
      case 'intercom': return '☎️ 인터폰';
      case 'perf': return '📈 실적 업로드';
      case 'zone': return '📍 영업구역 찾기';
      case 'conv': return r.kind==='arpt'?'📑 활동보고서 변환':'🔄 파일 변환';
      case 'hq': case 'hqcuri': return '🏢 본사 직영';
    }
  }catch(e){}
  return r.view;
}
function renderTabs(){
  const bar=document.getElementById('tabbar'); if(!bar) return;
  const one=_tabs.length<2;
  bar.innerHTML=_tabs.map((t,i)=>`<div class="tab ${t===_tabCur?'on':''}" onclick="tabClick(${i})" title="${_icEsc(_tabLabelOf(t.route))}"><span class="tl">${_icEsc(_tabLabelOf(t.route))}</span>${one?'':`<button class="tx" title="탭 닫기" onclick="event.stopPropagation();tabClose(${i})">✕</button>`}</div>`).join('')
    +(_tabs.length>=TAB_MAX?`<span class="tab-note">탭은 최대 ${TAB_MAX}개 — 넘으면 오래된 탭이 닫힙니다</span>`:'');
}
function tabClick(i){
  const t=_tabs[i]; if(!t || t===_tabCur) return;
  _tabForce=t.key; const sc=t.scroll||0;
  go(t.route);
  if(!t.keep) setTimeout(()=>window.scrollTo(0,sc),80);
  setTimeout(()=>{ _tabForce=null; },400);
}
function tabClose(i){
  const t=_tabs[i]; if(!t) return;
  const wasCur=(t===_tabCur);
  let next=null;
  if(wasCur) next=_tabs[i+1]||_tabs[i-1]||null;
  if(!wasCur){ _tabDestroy(t); _tabs.splice(i,1); renderTabs(); return; }
  if(!next) return;   // 마지막 탭은 닫지 않는다
  _tabForce=next.key; const sc=next.scroll||0, nroute=next.route, nkeep=next.keep;
  // 닫는 탭은 이동이 끝난 뒤에 정리 (이동 중 화면이 비지 않도록)
  const rm=()=>{ const k=_tabs.indexOf(t); if(k>=0){ _tabDestroy(t); _tabs.splice(k,1); renderTabs(); } };
  go(nroute);
  setTimeout(()=>{ rm(); if(!nkeep) window.scrollTo(0,sc); _tabForce=null; },120);
}
function _tabDestroy(t){ if(t.pane && t.pane.parentNode) t.pane.parentNode.removeChild(t.pane); t.pane=null; }
function _tabApplyWrap(){
  const w=document.querySelector('.wrap');
  w.classList.toggle('wrap-map', route.view==='map');
  w.classList.toggle('wrap-full', route.view==='map' || route.view==='restore' || route.view==='open' || (route.view==='doc' && route.doc==='opendash')); // 지도·협조전·개설대쉬보드는 폭 제한을 풀어준다
}
function render(){
  if(_tabCur) _tabCur.scroll = window.scrollY;           // 떠나는 탭의 스크롤 위치 저장
  const key=_tabKeyOf(route), keep=TAB_KEEP.indexOf(key)>=0;
  let t=_tabs.find(x=>x.key===key);
  const switching=(_tabCur!==t);
  const prev=_tabCur;
  // 떠나는 탭 정리: 보관형은 숨기기, 재생성형은 비우기(같은 id의 화면이 겹치지 않도록)
  if(prev && switching){
    if(typeof opClose==='function') opClose();           // 열려 있던 상세 창은 닫는다
    if(prev.pane){ if(!prev.keep) prev.pane.innerHTML=''; prev.pane.style.display='none'; }
  }
  if(!t){
    if(_tabs.length>=TAB_MAX){   // 가장 오래 안 쓴 탭부터 닫기 (재생성형 우선)
      let v=_tabs.find(x=>x!==prev && !x.keep) || _tabs.find(x=>x!==prev);
      if(v){ _tabDestroy(v); _tabs.splice(_tabs.indexOf(v),1); }
    }
    const pane=document.createElement('div'); pane.className='tab-pane';
    appHost.appendChild(pane);
    t={key, route, keep, pane, scroll:0, shown:false};
    _tabs.push(t);
  }
  _tabCur=t; t.route=route;
  t.pane.style.display='';
  app=t.pane;
  // 보관형 탭으로 돌아오면 다시 그리지 않고 그대로 보여준다
  const rootOk = key!=='allcenters' || route.view==='allcenters' || stringifyRoute(route)===stringifyRoute(t.shownRoute||route);
  const restore = keep && t.shown && switching && (_tabForce===key || rootOk) && !(key==='map' && _mapGoto);
  if(restore){
    route=t.shownRoute||route; t.route=route;
    const h='#'+stringifyRoute(route);
    if(location.hash!==h && history.replaceState) history.replaceState(null,'',h);
    _tabApplyWrap(); renderSidebar(); renderCrumbs(); renderTabs();
    const sc=t.scroll||0; setTimeout(()=>window.scrollTo(0,sc),0);
    const fr=t.pane.querySelector('iframe'); if(fr && fr.contentWindow) setTimeout(()=>{ try{ fr.contentWindow.postMessage({type:'yoonsmap-show'}, location.origin); }catch(e){} },80);
    return;
  }
  _tabApplyWrap();
  _renderView();
  t.shown=true; t.shownRoute=route;
  renderTabs();
}

/* ===== 인터폰 번호표 — 메모DB의 'intercom' 탭을 Apps Script(getIntercom)로 불러옴 =====
   버튼 = "이름 내선4자리", 누르면 전화 연결(tel:). 번호가 바뀌면 시트만 고치면 됨. */
let _icList = null, _icQuery = '';
function _icEsc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _icMark(text){
  const t = _icEsc(text); if(!_icQuery) return t;
  const q = _icEsc(_icQuery).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return t.replace(new RegExp(q,'gi'), m=>`<mark>${m}</mark>`);
}
function _icBtn(p){
  const num = (p.tel||'').replace(/[^0-9+]/g,'');
  const label = p.ext || p.tel || '';
  const role = p.role ? `<span class="ic-role">${_icEsc(p.role)}</span>` : '';
  const inner = `${role}${_icMark(p.name)}${label?` <b>${_icMark(label)}</b>`:''}`;
  const cls = 'ic-btn' + (p.role && !p.team ? ' ic-head' : '');
  return num ? `<a class="${cls}" href="tel:${num}" title="${_icEsc(p.tel)}">${inner}</a>`
             : `<span class="${cls}" title="번호 없음">${inner}</span>`;
}

/* ===== 사무실 업무 › 파일 변환 (엑셀→CSV, PDF→MD) =====

const _convLibs = {};

    s.onerror = ()=>{ delete _convLibs[src]; rej(new Error('변환 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.')); };
    document.head.appendChild(s);
  });
}
const _CV_XLSX = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function _cvBase(n){ const i = n.lastIndexOf('.'); return i>0 ? n.slice(0,i) : n; }

  _cvWb = null; _cvMd = ''; _cvK = '';

    <div class="cv-panel"><h3>${title}</h3><p class="hint" style="margin:0 0 12px">${desc}</p>
      <label class="cv-drop" id="cvDrop${k}">${dropTxt}<input type="file" id="cvFile${k}" style="display:none" accept="${accept}"></label>
      <div id="cvBody${k}"></div><div class="cv-msg" id="cvMsg${k}"></div></div>`;
  app.innerHTML = `

      <b>파일은 내 컴퓨터 안에서만 처리되고 서버로 전송되지 않습니다.</b></p>
    <div class="cv-split">
      ${panel('X', '📊 엑셀 → CSV', '엑셀(.xlsx, .xls)을 CSV로 바꿉니다. 한글이 깨지지 않게 저장되며, 시트가 여러 개면 골라서 저장할 수 있습니다. (실적 데이터 변환용)', '.xlsx,.xls', '엑셀 파일을 클릭해서 선택하거나 여기로 끌어다 놓으세요')}
      ${panel('P', '📄 PDF → MD', '글자가 들어 있는 PDF를 마크다운으로 바꿉니다. AI에 넣을 문서 정리용이며, 스캔(이미지) PDF는 변환되지 않습니다.', '.pdf', 'PDF 파일을 클릭해서 선택하거나 여기로 끌어다 놓으세요')}

async function _cvHandle(file, xls){
  _cvK = xls ? 'X' : 'P';
  const ok = xls ? /\.(xlsx|xls)$/i.test(file.name) : /\.pdf$/i.test(file.name);
  if(!ok){ _cvMsg(xls ? '엑셀(.xlsx, .xls) 파일만 선택할 수 있습니다.' : 'PDF 파일만 선택할 수 있습니다.', true); return; }
  _cvMsg('변환 중… 잠시만 기다려 주세요.');
  document.getElementById('cvBody' + _cvK).innerHTML = '';
  try{ xls ? await _cvExcel(file) : await _cvPdf(file); }
  catch(e){ console.error(e); _cvMsg('변환에 실패했습니다: ' + (e.message || e), true); }
}

/* 엑셀 → CSV */
async function _cvExcel(file){
  _cvXName = file.name;
  await _convLoad(_CV_XLSX);
  _cvWb = XLSX.read(new Uint8Array(await file.arrayBuffer()), {type:'array'});
  const names = _cvWb.SheetNames;
  document.getElementById('cvBody' + _cvK).innerHTML = `
    <div class="cv-row"><b>${eschtml(file.name)}</b>
      <select id="cvSheet" onchange="_cvPreview()">${names.map((n,i)=>`<option value="${i}">${eschtml(n)}</option>`).join('')}</select>
      <button class="rp-btn" onclick="_cvDownloadSheet()">⬇ 선택한 시트 CSV 저장</button>
      ${names.length>1 ? `<button class="rp-btn ghost" onclick="_cvDownloadAll()">⬇ 모든 시트 저장(${names.length}개 파일)</button>` : ''}</div>
    <div class="hint" style="margin-bottom:6px">미리보기(앞 10줄)</div><div class="cv-prev" id="cvPrev"></div>`;
  _cvPreview(); _cvMsg('');
}
function _cvPreview(){
  const ws = _cvWb.Sheets[_cvWb.SheetNames[Number(document.getElementById('cvSheet').value)]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''}).slice(0,10);
  document.getElementById('cvPrev').innerHTML = rows.length
    ? '<table>' + rows.map(r=>'<tr>'+r.map(c=>`<td>${eschtml(String(c))}</td>`).join('')+'</tr>').join('') + '</table>'
    : '<div class="hint" style="padding:12px">이 시트는 비어 있습니다.</div>';
}
function _cvSheetCsv(name){ return XLSX.utils.sheet_to_csv(_cvWb.Sheets[name]); }
function _cvDownloadSheet(){
  _cvK = 'X';
  const i = Number(document.getElementById('cvSheet').value), n = _cvWb.SheetNames[i];
  const multi = _cvWb.SheetNames.length > 1;
  _cvSave(_cvSheetCsv(n), _cvBase(_cvXName) + (multi ? '_' + n : '') + '.csv', 'text/csv', true);
  _cvMsg('CSV 파일이 저장되었습니다. (엑셀로 열어도 한글이 깨지지 않습니다)');
}
function _cvDownloadAll(){
  _cvK = 'X';
  _cvWb.SheetNames.forEach((n,i)=>setTimeout(()=>_cvSave(_cvSheetCsv(n), _cvBase(_cvXName)+'_'+n+'.csv', 'text/csv', true), i*400));
  _cvMsg('시트별로 여러 파일이 저장됩니다. 브라우저가 "여러 파일 다운로드"를 물으면 허용해 주세요.');
}

/* PDF → MD (글자가 있는 PDF 전용: 줄 묶기 · 큰 글씨는 제목으로 · 쪽 구분 표시) */
async function _cvPdf(file){
  _cvPName = file.name;
  await _convLoad(_CV_PDF);
  pdfjsLib.GlobalWorkerOptions.workerSrc = _CV_PDFW;
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const out = []; let chars = 0;
  for(let p=1; p<=pdf.numPages; p++){
    const items = (await (await pdf.getPage(p)).getTextContent()).items.filter(it=>it.str && it.str.trim());
    const fsOf = it=>Math.abs(it.transform[3]) || Math.abs(it.transform[0]) || 10;
    const sizes = items.map(fsOf).sort((a,b)=>a-b), med = sizes.length ? sizes[Math.floor(sizes.length/2)] : 10;
    items.sort((a,b)=> (b.transform[5]-a.transform[5]) || (a.transform[4]-b.transform[4]));
    const lines = [];
    items.forEach(it=>{
      const y = it.transform[5], fs = fsOf(it), last = lines[lines.length-1];
      if(last && Math.abs(last.y - y) <= fs*0.45) last.items.push(it);
      else lines.push({y, items:[it]});
    });
    const md = ['<!-- 쪽 ' + p + ' -->']; let prevY = null;
    lines.forEach(l=>{
      l.items.sort((a,b)=>a.transform[4]-b.transform[4]);
      let t = '', end = null; const fs = Math.max.apply(null, l.items.map(fsOf));
      l.items.forEach(it=>{
        const x = it.transform[4];
        if(end !== null && x - end > fs*0.15) t += (x - end > fs*2.5 ? '  ' : ' ');
        t += it.str; end = x + (it.width || 0);
      });
      t = t.trim(); if(!t) return;
      chars += t.length;
      if(prevY !== null && prevY - l.y > fs*1.9) md.push('');
      md.push((fs >= med*1.3 && t.length < 80) ? '## ' + t : t);
      prevY = l.y;
    });
    out.push(md.join('\n'));
  }
  if(chars < 20){ _cvMsg('읽을 수 있는 글자가 거의 없습니다. 스캔(이미지) PDF로 보이며, 이 도구로는 변환할 수 없습니다.', true); return; }
  _cvMd = out.join('\n\n---\n\n') + '\n';
  document.getElementById('cvBody' + _cvK).innerHTML = `
    <div class="cv-row"><b>${eschtml(file.name)}</b> <span class="hint">${pdf.numPages}쪽 · ${chars.toLocaleString()}자</span>
      <button class="rp-btn" onclick="_cvDownloadMd()">⬇ .md 저장</button>
      <button class="rp-btn ghost" onclick="_cvCopyMd()">📋 복사</button></div>
    <div class="cv-md" id="cvMdBox"></div>`;
  document.getElementById('cvMdBox').textContent = _cvMd;
  _cvMsg('변환이 끝났습니다. 표나 복잡한 서식은 글자로만 나오니 저장 전에 확인해 주세요.');
}
function _cvDownloadMd(){ _cvSave(_cvMd, _cvBase(_cvPName) + '.md', 'text/markdown', false); }
function _cvCopyMd(){
  _cvK = 'P';
  (navigator.clipboard ? navigator.clipboard.writeText(_cvMd) : Promise.reject())
    .then(()=>_cvMsg('복사되었습니다.'), ()=>_cvMsg('복사하지 못했습니다. 저장 버튼을 이용해 주세요.', true));
}

/* ===== 활동보고서 합본 PDF → 본부별 분리·집계 확인표 (1단계: 결과 파일 저장까지) ===== */

async function _arHandle(file){

// 부문 아래에 본부를 묶어서 보여줄 부문 목록 (시트 '부문' 열 값과 같아야 함)

const PERF_KINDS = {curi:{label:'큐리매쓰'}, hak:{label:'학원'}, woo:{label:'우영'}};

function _perfNormA(s){ return String(s||'').replace(/\(H\)|（H）/g,'').replace(/[\s()（）\[\].]/g,'').toLowerCase(); }

function _perfLabel(i){ const y=2026+Math.floor(i/12), m=i%12+1; return y===2026 ? m+'월' : String(y).slice(2)+'.'+m+'월'; }
function _perfExtend(n){   // 월이 늘면 모든 월별 배열을 n칸으로 늘린다(새 칸은 아직 값 없음: 학원·우영 0, 큐리 null)

  while(CURI_MONTHS.length<n) CURI_MONTHS.push(_perfLabel(CURI_MONTHS.length));

  DATA.managers.forEach(mg=>mg.branches.forEach(b=>b.centers.forEach(c=>pad(c.mem,0))));
  Object.keys(ENGREV_DATA).forEach(k=>pad(ENGREV_DATA[k],0));

function _perfDt(s){   // 'm/d/yy' 와 'yyyy-mm-dd' 두 형식 모두 읽음
  s=String(s||'').trim();
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if(m) return {y:+m[1], m:+m[2], d:+m[3]};
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; return {y, m:+m[1], d:+m[2]};
}
function _perfMgrFor(region, csvMgr){

  if(m) return m.name;
  const c = CURI_DATA.find(x=>x.region===region);

/* ---------- 큐리매쓰 반영 ---------- */
function _perfApplyCuri(rows, idx, dry){
  if(!dry) _perfExtend(idx+1);
  const map = {}; CURI_DATA.forEach(r=>{ map[_perfBase(r.center)] = r; });
  const out = {same:0, changed:[], added:[], skipped:[]};
  rows.forEach(d=>{
    const r = map[_perfBase(d.center)];
    const nv = {mem:d.mem, textbookQty:d.qty, workbook:d.wb, textbook:d.tb};
    if(!r){
      if(d.closed || /\(해지\)/.test(d.center)){ out.skipped.push(d.center); return; }
      out.added.push(d);
      if(!dry){
        const e = {region:d.region, mgr:_perfMgrFor(d.region), sub:null, center:d.center, mem:Array(NMON).fill(null), workbook:Array(NMON).fill(null), textbook:Array(NMON).fill(null), textbookQty:Array(NMON).fill(null)};
        Object.keys(nv).forEach(k=>{ e[k][idx] = nv[k]; });
        CURI_DATA.push(e); map[_perfBase(d.center)] = e;
      }
      return;
    }
    const keys = Object.keys(nv);
    const diff = keys.some(k=>((r[k]||[])[idx]??null)!==(nv[k]??null));
    if(diff){ out.changed.push({center:r.center, old:{mem:(r.mem||[])[idx], qty:(r.textbookQty||[])[idx], wb:(r.workbook||[])[idx], tb:(r.textbook||[])[idx]}, now:d}); } else out.same++;
    if(!dry && diff){ keys.forEach(k=>{ if(!r[k]) r[k]=Array(NMON).fill(null); r[k][idx] = nv[k] ?? null; }); }
  });
  return out;
}
function _perfCuriSums(idx){
  return CURI_DATA.reduce((a,r)=>({mem:a.mem+((r.mem||[])[idx]||0),qty:a.qty+((r.textbookQty||[])[idx]||0),wb:a.wb+((r.workbook||[])[idx]||0),tb:a.tb+((r.textbook||[])[idx]||0)}),{mem:0,qty:0,wb:0,tb:0});
}
/* ---------- 학원·우영 반영 ---------- */
function _perfForm(kind, f){ f=String(f||'').trim(); if(kind==='hak') return f==='숲'?'학원(숲)':f==='IGSE'?'학원(IGSE)':('학원('+f+')'); return f; }
function _perfKeep(rows, ym){   // 화면·시트에 쓸 행만 추림: 활동 중이거나 값이 있거나 그 달에 개설·변경·해지된 센터
  const y=+ym.slice(0,4), m=+ym.slice(4);

}
function _perfLifeEvents(kind, rows, ym){
  const y=+ym.slice(0,4), m=+ym.slice(4), src = kind==='hak'?'학원':'우영', out=[];
  rows.forEach(r=>{ [['open',r.open],['transfer',r.transfer],['close',r.close]].forEach(([t,s])=>{
    const d=_perfDt(s); if(!d||d.y!==y||d.m!==m) return;

    out.push({type:t,y,m,br:r.br,mgr:r.mgr,name:r.name,src,code:r.code});
  }); });

}
function _perfApplyAcad(kind, rows, ym, dry, withLife){
  const idx=_perfIdx(ym);
  if(!dry) _perfExtend(idx+1);
  const ix=new Map(); DATA.managers.forEach(mg=>mg.branches.forEach(b=>b.centers.forEach(c=>ix.set(_perfNormA(c.name)+'|'+c.code,{mg,b,c}))));
  const grp={}; rows.forEach(r=>{ (grp[_perfNormA(r.name)]=grp[_perfNormA(r.name)]||[]).push(r); });
  const val=(nm,f)=>{ const rs=grp[nm]; const pk=rs.filter(r=>r.state==='활동'||r.mem||r.rev); return (pk.length?pk[0]:rs[0])[f]; };
  const out={same:0, changed:0, changedList:[], added:[], closedNew:[], skipped:[], sumCur:{mem:0,rev:0,nw:0}, sumNew:{mem:0,rev:0,nw:0}, events:[]};
  rows.forEach(r=>{
    const nm=_perfNormA(r.name), hit=ix.get(nm+'|'+r.code);
    if(hit){
      const c=hit.c, nv={mem:r.mem??0, rev:val(nm,'rev')??0, nw:val(nm,'new')??0};
      const ol={mem:(c.mem||[])[idx]??0, rev:(ENGREV_DATA[nm]||[])[idx]??0, nw:(NEWMEM_DATA[nm]||[])[idx]??0};
      ['mem','rev','nw'].forEach(k=>{ out.sumCur[k]+=ol[k]; out.sumNew[k]+=nv[k]; });
      if(ol.mem!==nv.mem||ol.rev!==nv.rev||ol.nw!==nv.nw){ out.changed++; if(out.changedList.length<60) out.changedList.push(`${r.name}: 회원 ${ol.mem}→${nv.mem} · 매출 ${ol.rev}→${nv.rev} · 신규 ${ol.nw}→${nv.nw}`); } else out.same++;
      const willClose = r.state!=='활동' && r.close && !c.closed;
      if(willClose) out.closedNew.push(r.name+' ('+r.close+')');
      if(!dry){
        c.mem=(c.mem||Array(NMON).fill(0)).slice(); c.mem[idx]=nv.mem;
        (ENGREV_DATA[nm]=ENGREV_DATA[nm]||Array(NMON).fill(0))[idx]=nv.rev;
        (NEWMEM_DATA[nm]=NEWMEM_DATA[nm]||Array(NMON).fill(0))[idx]=nv.nw;
        if(willClose){ c.closed=true; c.closedDate=r.close; c.mng={months:[],eval:'해지',note:r.close+' 해지 — 회원 추세·위험도 산정 대상 아님'}; }
      }

      if(!br){ out.skipped.push(`${r.name}(${r.br}) — 캔버스에 '${r.br}' 본부가 없어 건너뜀`); return; }
      out.added.push(`${r.name} (${r.br}/${br.mg.name})`);
      out.sumNew.mem+=r.mem??0; out.sumNew.rev+=r.rev??0; out.sumNew.nw+=r.new??0;
      if(!dry){
        const mem=Array(NMON).fill(0); mem[idx]=r.mem??0;
        br.b.centers.push({name:r.name, code:r.code, form:_perfForm(kind,r.form), mem, mng:{months:[],eval:'미관리',note:'신규 개설 — 면담 기록 없음'}});

  return out;
}

function _perfCsvParse(text){
  const head=text.split(/\r?\n/).slice(0,40).join('\n');   // 쉼표(CSV)·탭(엑셀 '텍스트 탭') 구분을 자동 판별
  const SEP = (head.split('\t').length-1) > (head.split(',').length-1) ? '\t' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===SEP){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function _perfNum(s){ s=String(s==null?'':s).replace(/[,\s]/g,''); if(s===''||s==='-') return null; const n=Number(s); return isFinite(n)?n:null; }
function _perfDtRaw(s){ s=String(s==null?'':s).trim(); if(s===''||s==='-'||s.toUpperCase()==='NULL') return ''; const d=_perfDt(s); return d ? `${d.m}/${d.d}/${String(d.y).slice(2)}` : s; }   // 저장은 항상 m/d/yy
function _perfParse(text){

  if(hi>=0) return _perfParseCuri(rows, hi);
  const ha = rows.findIndex(r=>r[0] && r[0].trim()==='NO');
  if(ha>=0) return _perfParseAcad(rows, ha);
  throw new Error("지원하지 않는 파일입니다. 큐리매쓰 매출현황, 학원/우영 '주요 영업 실적 현황(상세)' CSV만 올릴 수 있습니다.");

function _perfParseCuri(rows, hi){

  let ym=null; for(const r of rows.slice(0,hi+2)){ for(const c of r){ const m=String(c).match(/(20\d{2})(0[1-9]|1[0-2])/); if(m){ ym=m[1]+m[2]; break; } } if(ym) break; }
  if(!ym) throw new Error('기준월(예: 202610)을 파일에서 찾지 못했습니다.');

  const cReg=H.indexOf('본부'), cCen=H.indexOf('센터');
  const miss=[['회원수',cMem],['교재',cQty],['문제은행',cWb],['교재 매출',cTb]].filter(x=>x[1]<0).map(x=>x[0]);

function _perfParseAcad(rows, hi){

function opBulkDraw(){
  const bar=document.getElementById('opBulk'); if(!bar||!_open) return;

async function opBulk(kind){
  const rows=_open.rows.filter(r=>_openSel.has(r.id));
  let targets=rows.filter(r=>r.status!=='완료'), skipped=rows.length-targets.length;
  if(kind==='hold'){ const t=targets.filter(r=>r.status==='진행중'); skipped+=targets.length-t.length; targets=t; }
  if(kind==='unhold'){ const t=targets.filter(r=>r.status==='보류'); skipped+=targets.length-t.length; targets=t; }
  if(!targets.length){ _opMsg('처리할 수 있는 건이 없습니다. (완료 건은 보류·삭제할 수 없고, 이미 같은 상태인 건은 건너뜁니다)',true); return; }
  const names=targets.slice(0,5).map(r=>'· '+r.name).join('\n')+(targets.length>5?'\n… 외 '+(targets.length-5)+'건':'');
  const label={hold:'보류로 옮깁니다',unhold:'보류를 해제합니다',delete:'삭제합니다'}[kind];
  const warn=kind==='delete'?'\n\n시트의 행이 삭제되며 되돌릴 수 없습니다. 교육용 계정이 배정된 건은 배정을 회수한 뒤 삭제합니다.':'';
  if(!confirm(targets.length+'건을 '+label+'.\n\n'+names+(skipped?'\n\n(건너뛰는 건 '+skipped+'건: 완료되었거나 이미 같은 상태)':'')+warn+'\n\n진행할까요?')) return;
  const by=await _opWho(); if(!by) return;
  let ok=0; const fail=[];
  for(let i=0;i<targets.length;i++){
    const r=targets[i]; _opMsg('처리 중… ('+(i+1)+'/'+targets.length+')');
    const body=kind==='delete'?{action:'deleteOpenRow',id:r.id,by,force:true}:{action:'setOpenHold',id:r.id,hold:kind==='hold',by};
    try{ const x=await _icPost(body); if(x.ok) ok++; else fail.push(r.name+': '+(x.error||'실패')); }
    catch(e){ fail.push(r.name+': 서버에 연결할 수 없습니다.'); }
  }
  _openSel.clear(); await _opLoad(true); if(route.view==='open') opDraw();
  _opMsg((kind==='delete'?'🗑 삭제':kind==='hold'?'⏸ 보류':'▶ 보류 해제')+' '+ok+'건 완료'+(fail.length?'\n실패 '+fail.length+'건:\n'+fail.slice(0,5).join('\n'):''), fail.length>0);
}

  });

let _icEdit = null;
function _icAskPin(){

      <div style="display:flex;gap:8px;margin-top:12px"><button id="icPinOk" class="ic-refresh" style="flex:1;background:var(--pine);color:#fff">확인</button><button id="icPinNo" class="ic-refresh" style="flex:1">취소</button></div></div>`;
    document.body.appendChild(ov);

async function _icPost(payload){
  const res = await fetch(CLOUD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({apiKey:API_KEY}, payload))});
  return res.json();
}
// 같은 본부(부문+본부)끼리, 그 안에서 같은 팀끼리 모아 정렬(화면에 보이는 순서는 그대로 유지)
function _icNorm(list){
  const keys = [], map = {};
  list.forEach(p=>{
    const k = (p.group||'')+'|'+(p.hq||'');
    if(!(k in map)){ map[k] = {teams:[], t:{}}; keys.push(k); }
    const h = map[k], t = p.team||'';
    if(!(t in h.t)){ h.t[t] = []; h.teams.push(t); }
    h.t[t].push(p);
  });
  const out = [];
  keys.forEach(k=>map[k].teams.forEach(t=>map[k].t[t].forEach(p=>out.push(p))));
  return out;
}
function _icBlocks(list){ // 정렬된 목록 → [{key, teams:[{name, rows}]}]
  const bl = [], bi = {};
  list.forEach(p=>{
    const k = (p.group||'')+'|'+(p.hq||'');
    if(!(k in bi)){ bi[k] = bl.length; bl.push({key:k, teams:[], ti:{}}); }
    const b = bl[bi[k]], t = p.team||'';
    if(!(t in b.ti)){ b.ti[t] = b.teams.length; b.teams.push({name:t, rows:[]}); }
    b.teams[b.ti[t]].rows.push(p);
  });
  return bl;
}
function _icFlat(bl){ const o=[]; bl.forEach(b=>b.teams.forEach(t=>t.rows.forEach(p=>o.push(p)))); return o; }

function _icKeepScroll(fn){ const y = window.scrollY; fn(); _icDraw(); window.scrollTo(0,y); }
function icMoveRow(i,d){ const L=_icEdit.list, j=i+d; if(j<0||j>=L.length) return; _icKeepScroll(()=>{ [L[i],L[j]]=[L[j],L[i]]; _icEdit.dirty=true; }); }
function icMoveHq(i,d){

    E.list=_icFlat(bl); E.dirty=true;
  });
}
function icMoveTeam(i,d){
  _icKeepScroll(()=>{
    const E=_icEdit, row=E.list[i], bl=_icBlocks(_icNorm(E.list)), k=(row.group||'')+'|'+(row.hq||'');
    const B=bl.find(b=>b.key===k), a=B.teams.findIndex(t=>t.name===(row.team||'')), b=a+d;
    if(b>=0 && b<B.teams.length){ [B.teams[a],B.teams[b]]=[B.teams[b],B.teams[a]]; }

  });

    if(r.shrink){ if(confirm(r.error+'\n정말 저장할까요?')) return icAdminSave(true); return; }
    alert(r.error||'저장 실패'); return;
  }
  _icList = list.map((p,i)=>Object.assign({order:i+1}, p));
  IC_NESTED_GROUPS = groups.filter(g=>E.nested.has(g));

function _icDraw(){
  const body = document.getElementById('icBody'); if(!body || !_icList) return;
  if(_icEdit){ _icEditDraw(); return; }
  body.oninput = null;
  const q = _icQuery.toLowerCase();
  const hit = p => !q || [p.name,p.ext,p.tel,p.team,p.hq,p.group,p.role].some(v=>String(v||'').toLowerCase().includes(q));
  const list = _icList.filter(hit);
  document.getElementById('icCount').textContent = `${list.length}건`;
  if(!list.length){ body.innerHTML = `<div class="ic-empty">검색 결과가 없습니다.</div>`; return; }
  // 카드 = (묶음 부문이면) 부문, 아니면 본부  /  카드 안 블록 = 본부  /  블록 안 줄 = 팀
  const cards = [], cIdx = {};
  list.forEach(p=>{
    const nested = IC_NESTED_GROUPS.includes(p.group);
    const cKey = nested ? p.group : (p.hq || p.group || '기타');
    if(!(cKey in cIdx)){ cIdx[cKey] = cards.length; cards.push({key:cKey, group:p.group, nested, heads:[], blocks:[], bIdx:{}}); }
    const c = cards[cIdx[cKey]];
    const bKey = nested ? p.hq : cKey;
    if(nested && !bKey){ c.heads.push(p); return; }           // 부문 담당 임원
    if(!(bKey in c.bIdx)){ c.bIdx[bKey] = c.blocks.length; c.blocks.push({key:bKey, heads:[], teams:[], tIdx:{}}); }
    const b = c.blocks[c.bIdx[bKey]];
    if(!p.team){ b.heads.push(p); return; }                      // 본부장
    if(!(p.team in b.tIdx)){ b.tIdx[p.team] = b.teams.length; b.teams.push({name:p.team, people:[]}); }
    b.teams[b.tIdx[p.team]].people.push(p);
  });
  cards.sort((a,b)=> (a.group==='대표번호'?-1:0) - (b.group==='대표번호'?-1:0));
  const headRow = arr => arr.length ? `<div class="ic-row"><div class="ic-btns">${arr.map(_icBtn).join('')}</div></div>` : '';
  const teamRows = b => b.teams.map(t=>`<div class="ic-row"><div class="ic-team">${_icMark(t.name)}</div><div class="ic-btns">${t.people.map(_icBtn).join('')}</div></div>`).join('');
  body.innerHTML = cards.map(c=>{
    if(c.key==='대표번호') return `<div class="ic-sec"><div class="ic-sec-h">📞 대표·공용번호</div>${c.blocks.map(b=>headRow(b.heads)).join('')}</div>`;
    if(c.nested){
      const blocks = c.blocks.map(b=>`<div class="ic-sub"><div class="ic-sub-h">${_icMark(b.key)}</div>${headRow(b.heads)}${teamRows(b)}</div>`).join('');
      return `<div class="ic-sec"><div class="ic-sec-h">${_icEsc(c.key)}</div>${headRow(c.heads)}${blocks}</div>`;
    }
    const grp = (c.group && c.group!==c.key) ? `<span class="ic-grp">${_icEsc(c.group)}</span>` : '';
    const b = c.blocks[0] || {heads:[],teams:[]};
    return `<div class="ic-sec"><div class="ic-sec-h">${grp}${_icMark(c.key)}</div>${headRow(b.heads)}${teamRows(b)}</div>`;
  }).join('');
}

/* ===== 영업구역 찾기 — 메모DB 'Head_Office' 탭(getHeadOffice)
   영업지역(상세) "1.대전 서구 2.대전 중구,동구" 를 지역 단위로 풀어서 검색.
   지역명 하나(예: 동탄, 영통구)나 주소 전체를 붙여넣어도 담당 본부를 찾아줌.
   본부명이 '사업부'인 영업구역은 직영지역으로 표시. ===== */
let _zoneRows = null, _zonePlaces = [], _zoneQuery = '';
const ZONE_SIDO_HINT = (()=>{ // 본부명·지역명에 시도가 안 붙은 경우 검색용 보조어
  const m = {};
  '종로 중구 용산 성동 광진 동대문 중랑 성북 강북 도봉 노원 은평 서대문 마포 양천 강서 구로 금천 영등포 동작 관악 서초 강남 송파 강동'.split(' ').forEach(k=>m[k]='서울');
  '수원 성남 의정부 안양 부천 광명 평택 동두천 안산 고양 과천 구리 남양주 오산 시흥 군포 의왕 하남 용인 파주 이천 안성 김포 화성 양주 포천 여주 연천 가평 양평'.split(' ').forEach(k=>m[k]='경기');
  '순천 여수 광양 목포 나주'.split(' ').forEach(k=>m[k]='전남');
  return m;
})();
function _zoneSplitParts(s){ // 괄호 안 쉼표는 나누지 않음: 남양주(다산,호평,덕소)
  const out=[]; let cur='', depth=0;
  for(const ch of s){
    if(ch==='('||ch==='（') depth++; if(ch===')'||ch==='）') depth=Math.max(0,depth-1);
    if(ch===',' && depth===0){ out.push(cur); cur=''; } else cur+=ch;
  }
  out.push(cur);
  return out.map(x=>x.trim()).filter(Boolean);
}
function _zoneParse(rows){
  const places=[];
  rows.forEach(r=>{
    const txt = String(r.area||'').replace(/[　\s]+/g,' ').trim();
    if(!txt) return;
    const zones=[]; const re=/(\d+)\.\s*(.*?)(?=\s+\d+\.|$)/g; let m;
    while((m=re.exec(txt))) zones.push({no:+m[1], text:m[2].trim()});
    if(!zones.length) zones.push({no:1, text:txt});
    r.zones = zones;
    zones.forEach(z=>{
      let prefix='';
      _zoneSplitParts(z.text).forEach(p=>{
        let full=p;
        if(p.includes(' ')) prefix = p.slice(0, p.lastIndexOf(' '));
        else if(prefix && /[구군]$/.test(p)) full = prefix+' '+p;
        const first = full.split(' ')[0].replace(/(시|군)$/,'').replace(/\(.*$/,'');
        const hint = ZONE_SIDO_HINT[first] || '';
        places.push({place:full, zoneNo:z.no, zoneText:z.text, row:r,
          pkey:_zoneNorm(full+' '+hint), hkey:_zoneNorm(r.hq)});
      });
    });
  });
  return places;
}
function _zoneNorm(s){ return String(s||'').replace(/\s+/g,'').toLowerCase(); }
// 검색어 → 토큰. '경기도'→'경기', '수원시'→'수원', '서울특별시'→'서울'. 번지·도로명은 버림
// 동·읍·면·리 단위는 '있으면 좋은' 보조 토큰(opt)으로 취급
function _zoneTokens(q){
  return String(q||'').replace(/[(),·\[\]]/g,' ').split(/\s+/).map(t=>t.trim()).filter(Boolean)
    .map(t=>t.replace(/(특별자치시|특별자치도|특별시|광역시)$/,'').replace(/^(경기|강원|충북|충남|전북|전남|경북|경남|제주)도$/,'$1')
              .replace(/^충청북도$/,'충북').replace(/^충청남도$/,'충남').replace(/^전라북도$/,'전북').replace(/^전라남도$/,'전남')
              .replace(/^경상북도$/,'경북').replace(/^경상남도$/,'경남').replace(/^(.{2,})시$/,'$1'))
    .filter(t=>t && !/^\d/.test(t) && !/(로|길)\d*$/.test(t))
    .map(_zoneNorm);
}
function _zoneTokHit(key, t){
  if(key.includes(t)) return true;
  const base = t.replace(/[구군]$/,'');                 // 양천구 → 양천, 분당구 → 분당 (2글자 이상만)
  return base!==t && base.length>=2 && key.includes(base);
}
function _zoneIsOpt(t){ return t.length>=3 && /[동읍면리가]$/.test(t); }
function _zoneSearch(q){
  const toks=_zoneTokens(q); if(!toks.length) return {list:[], partial:false};
  const need=toks.filter(t=>!_zoneIsOpt(t));
  const sc=_zonePlaces.map(p=>{
    const pm=toks.filter(t=>_zoneTokHit(p.pkey,t)).length;            // 지역명에서 맞은 수
    const am=toks.filter(t=>_zoneTokHit(p.pkey,t)||_zoneTokHit(p.hkey,t)).length; // 본부명 포함
    return {p, pm, am};
  });
  // ① 지역명으로 맞은 곳 우선(본부명만 맞은 지역은 뒤로) ② 그중 가장 많이 맞은 곳
  let pool=sc.filter(x=>x.pm>0);
  if(!pool.length) pool=sc.filter(x=>x.am>0);                         // 본부명 검색(예: 경기안양)
  if(!pool.length) return {list:[], partial:false};
  const maxA=Math.max(...pool.map(x=>x.am)); pool=pool.filter(x=>x.am===maxA);
  const maxP=Math.max(...pool.map(x=>x.pm)); pool=pool.filter(x=>x.pm===maxP);
  const best=pool[0];
  const partial = need.some(t=>!_zoneTokHit(best.p.pkey,t)&&!_zoneTokHit(best.p.hkey,t));
  return {list:pool.map(x=>x.p), partial};
}
function _zoneMark(text){
  let t=_icEsc(text); const toks=_zoneTokens(_zoneQuery);
  toks.sort((a,b)=>b.length-a.length).forEach(k=>{
    const pat=k.split('').map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*');
    t=t.replace(new RegExp(pat,'gi'), m=>`<mark>${m}</mark>`);
  });
  return t;
}
function _zoneIsBiz(r){ return /사업부/.test(r.hq||''); }
function _zoneHqBadge(r){
  return `<span class="zn-hq ${_zoneIsBiz(r)?'biz':''}">${_icEsc(r.hq)}${_zoneIsBiz(r)?' · 직영':''}</span>`;
}
function _zoneContact(r){
  const num=(r.phone||'').replace(/[^0-9+]/g,'');
  return [r.head?`본부장 <b>${_icEsc(r.head)}</b>`:'', num?`<a href="tel:${num}">${_icEsc(r.phone)}</a>`:'', r.contract?`<span class="zn-ct">${_icEsc(r.contract)}</span>`:''].filter(Boolean).join(' · ');
}

function _zoneDraw(){
  const body=document.getElementById('znBody'); if(!body||!_zoneRows) return;
  const cnt=document.getElementById('znCount');
  if(!_zoneQuery){ // 검색 전: 본부별 전체 구역표
    cnt.textContent=`${_zoneRows.length}개 본부 · ${_zonePlaces.length}개 지역`;
    const rows=[..._zoneRows].sort((a,b)=>(_zoneIsBiz(a)-_zoneIsBiz(b))||a.hq.localeCompare(b.hq,'ko'));
    body.innerHTML=`<div class="zn-grid">${rows.map(r=>`
      <div class="ic-sec zn-card ${_zoneIsBiz(r)?'biz':''}">
        <div class="ic-sec-h">${_zoneHqBadge(r)}<span class="zn-sub">${_zoneContact(r)}</span></div>
        ${(r.zones||[]).map(z=>`<div class="zn-zone"><span class="zn-no">${z.no}구역</span>${_icEsc(z.text)}</div>`).join('')||'<div class="hint">영업지역 미입력</div>'}
      </div>`).join('')}</div>`;
    return;
  }
  const {list, partial}=_zoneSearch(_zoneQuery);

window.addEventListener('message', function(e){
  if (MAP_ALLOWED_ORIGINS.indexOf(e.origin) < 0) return;
  if (e.data && e.data.type === 'yoonsmap-ready' && e.source) {
    const src = e.source;
    // 처리 기록용: Cloudflare Access 로 로그인한 담당자 이메일을 함께 전달(실패하면 빈 값)
    _accessEmail().then(function(email){
      src.postMessage({ type: 'yoonsmap-auth', apiKey: API_KEY, email: email }, e.origin);
    });
  }
  // 지도 도구 줄의 [📷 화면 캡처] 클릭 → 캔버스가 화면 공유 허용을 받아 캡처하고 팝업(복사/저장)을 띄운다
  if (e.data && e.data.type === 'yoonsmap-capture' && e.origin === location.origin) captureMapScreen();

// 지도 영역 화면 캡처 — 지도 도구 줄의 [📷 화면 캡처] → 화면 공유 허용("이 탭") → 팝업에서 [클립보드 복사] 또는 [저장]
let _capBlob = null, _capUrl = '';
function _capStatus(msg){
  const el = document.getElementById('mapCaptureStatus');
  if(el){ el.style.display = msg ? '' : 'none'; el.textContent = msg || ''; }
}
function capClose(){
  const m = document.getElementById('capModal'); if(m) m.remove();
  if(_capUrl){ URL.revokeObjectURL(_capUrl); _capUrl = ''; }
  _capBlob = null;
}
function capShow(blob){
  capClose();
  _capBlob = blob; _capUrl = URL.createObjectURL(blob);
  const ov = document.createElement('div'); ov.id = 'capModal'; ov.className = 'op-ov';
  ov.innerHTML = `<div class="op-pn" style="max-width:min(1100px,94vw)">
    <div class="op-hd"><b>📷 화면 캡처</b><span class="op-sub">복사하거나 저장하세요</span><span style="flex:1"></span><button class="op-x" onclick="capClose()">✕</button></div>

    <div style="max-height:64vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#f3f4f6"><img src="${_capUrl}" style="display:block;max-width:100%;margin:0 auto" alt="캡처 미리보기"></div>
    <div class="op-act"><button class="ic-refresh" style="background:var(--pine);color:#fff" onclick="capCopy()">📋 클립보드 복사</button><button class="ic-refresh" style="background:#1d4ed8;color:#fff" onclick="capSave()">💾 저장</button><button class="ic-refresh" onclick="capClose()">닫기</button></div>
  </div>`;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) ov._down = true; });
  ov.addEventListener('mouseup', e=>{ if(e.target===ov && ov._down) capClose(); ov._down = false; });
  document.body.appendChild(ov);
}
function _capMsg(t, bad){ const el = document.getElementById('capMsg'); if(!el) return; el.style.display = t ? 'block' : 'none'; el.textContent = t || ''; el.style.background = bad ? '#fef2f2' : '#ecfdf5'; el.style.color = bad ? '#b91c1c' : '#065f46'; }
async function capCopy(){
  if(!_capBlob) return;
  try{
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': _capBlob }) ]);
    _capMsg('✅ 클립보드에 복사했습니다. Ctrl+V로 붙여넣으세요.');
  }catch(e){ _capMsg('⚠️ 복사에 실패했습니다: ' + e.message + ' (저장을 이용해 주세요)', true); }
}
async function capSave(){
  if(!_capBlob) return;
  const name = `가맹지역본부지도_${todayStr()}.png`;
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description:'PNG 이미지', accept:{'image/png':['.png']} }] });
      const w = await handle.createWritable(); await w.write(_capBlob); await w.close();
      _capMsg('✅ 저장했습니다.');
    }catch(e){ if(e.name !== 'AbortError') _capMsg('⚠️ 저장 중 문제가 발생했습니다: ' + e.message, true); }
  } else {   // 저장 위치 선택을 지원하지 않는 브라우저 — 다운로드 폴더로 저장
    const a = document.createElement('a'); a.href = _capUrl; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    _capMsg('✅ 다운로드 폴더에 저장했습니다.');
  }
}
async function captureMapScreen(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    _capStatus('⚠️ 이 브라우저는 화면 캡처 기능을 지원하지 않습니다. 최신 크롬·엣지를 이용해 주세요.');
    return;
  }
  let stream = null;
  try{
    _capStatus('화면 공유 승인 창이 뜹니다 — "이 탭"을 선택해 허용해 주세요…');
    stream = await navigator.mediaDevices.getDisplayMedia({ video:{ displaySurface:'browser' }, audio:false, preferCurrentTab:true });
    const track = stream.getVideoTracks()[0];
    const video = document.createElement('video');
    video.srcObject = stream; await video.play();
    await new Promise(r=>setTimeout(r, 250));   // 실제 프레임이 그려질 때까지 잠깐 대기
    const full = document.createElement('canvas');
    full.width = video.videoWidth; full.height = video.videoHeight;
    full.getContext('2d').drawImage(video, 0, 0);
    track.stop(); stream = null;
    // 지도 영역만 잘라내기 — 화면 좌표(CSS px)를 캡처 해상도 비율로 환산
    const rect = document.getElementById('mapCaptureTarget').getBoundingClientRect();
    const sx = full.width / window.innerWidth, sy = full.height / window.innerHeight;
    const cw = Math.max(1, Math.round(rect.width * sx)), ch = Math.max(1, Math.round(rect.height * sy));
    const crop = document.createElement('canvas'); crop.width = cw; crop.height = ch;
    crop.getContext('2d').drawImage(full, Math.round(rect.left*sx), Math.round(rect.top*sy), cw, ch, 0, 0, cw, ch);
    crop.toBlob(function(blob){
      if(!blob){ _capStatus('⚠️ 캡처 이미지를 만들지 못했습니다. 다시 시도해 주세요.'); return; }
      _capStatus(''); capShow(blob);
    }, 'image/png');
  }catch(e){
    if(e.name === 'NotAllowedError') _capStatus('화면 공유가 취소되었습니다.');
    else _capStatus('⚠️ 캡처 중 오류가 발생했습니다: ' + e.message);
    if(stream) stream.getTracks().forEach(t=>t.stop());
  }
}

async function shareRestoreUrl(){

  if(navigator.share){
    try{
      await navigator.share({ title:'중단 복원 협조전', text:'중단 복원 협조전 작성 링크입니다.', url });
    }catch(e){

        await copyRestoreUrl();
      }
    }
  } else {
    await copyRestoreUrl(); // 이 브라우저는 공유 기능을 지원하지 않음 — 클립보드 복사로 대체
  }

async function copyRestoreUrl(){
  // 이 링크로 접수되면 캔버스를 통해 전달됐다는 걸 구분할 수 있도록 추적용 파라미터를 붙입니다.
  // (yoons-restore 사이트 쪽에서 이 파라미터를 받아 기록해야 실제로 구분됩니다 — 별도 확인 필요)
  const url = RESTORE_FORM_URL + (RESTORE_FORM_URL.includes('?') ? '&' : '?') + 'from=canvas';
  try{
    await navigator.clipboard.writeText(url);
  }catch(e){
    // 클립보드 API가 막힌 환경 대비 — 임시 텍스트 영역으로 폴백
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();

}

/* ============================================================
   개설 VOC 현황 — 메모DB 'voc' 탭 + 본부 회신 시트 (Apps Script getVoc)
   - 개설율 = 해당 연도 개설 건수 ÷ 해당 연도 접수 건수
   - 2026년 이전 자료는 연도별 접수 건수만 표시
   - 개인정보: 이름 · 연락처 뒤 4자리 · 희망지역 · 유형만 표시
   ============================================================ */
const VOC_NOREPLY_DAYS = 7;   // 전달 후 이 일수가 지나도 회신이 없으면 '미회신'
let _vocData=null, _vocLoading=false, _vocErr='', _vocYear=null, _vocBr='', _vocStatus='', _vocCharts=[], _vocBrMap={};

async function vocLoad(force){
  _vocLoading=true; _vocErr='';
  if(route.view==='voc' && force) renderVoc();
  try{ _vocData = await _jsonpGet(CLOUD_URL+'?action=getVoc&apiKey='+encodeURIComponent(API_KEY)+(force?'&nocache=1':''), 60000); }
  catch(e){ _vocErr = e.message; if(force) _vocData=null; }
  _vocLoading=false; _vocBrMap={};
  if(route.view==='voc') renderVoc();
  if(typeof renderSidebar==='function') renderSidebar(); // 사업부 하위 목록 갱신
}
// 전달본부 이름 → 대시보드 본부(매니저) 연결. '안양본부'·'경기안양' 같은 표기 차이를 흡수
function vocNorm(s){ return String(s||'').replace(/\(.*?\)|본부|가맹|지역|\s/g,''); }
function vocBranchOwner(name){
  if(name in _vocBrMap) return _vocBrMap[name];
  const n=vocNorm(name), all=[];
  DATA.managers.forEach((m,mi)=>m.branches.forEach(b=>all.push({mi, br:b.name, n:vocNorm(b.name)})));
  let hit = n ? (all.find(x=>x.n===n)||null) : null;
  if(!hit && n.length>=2){ const c=all.filter(x=>x.n.includes(n)||n.includes(x.n)); if(c.length===1) hit=c[0]; }
  return _vocBrMap[name]=hit;
}
// 전달본부명에 '사업부'가 들어가면 직영지역 → 전사 요약·매니저 화면에서 빼고 '사업부' 화면에서 따로 관리
function vocIsBiz(brName){ return /사업부/.test(String(brName||'')); }
function vocBizList(){
  if(!_vocData || !_vocData.items) return [];
  const set = new Set(_vocData.items.map(x=>x.branch).filter(vocIsBiz));
  Object.values(_vocData.yearly||{}).forEach(y=>Object.keys(y.byBranch||{}).forEach(b=>{ if(vocIsBiz(b)) set.add(b); }));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'ko'));
}
function vocRouteKey(r){
  if(r.mgr===-1) return '전체';
  if(r.mgr===-2) return r.biz ? '사업부:'+r.biz : '사업부';
  return DATA.managers[r.mgr].name;
}
// 전사 요약 범위 전환: 'fr'=가맹(기본) / 'biz'=사업부 / 'all'=합계
let _vocMode = 'fr';
const VOC_MODE_LABEL = {fr:'가맹', biz:'사업부', all:'합계'};
function vocSetMode(m){ _vocMode = m; _vocBr = ''; renderVoc(); }
function vocInScope(brName){
  if(route.mgr===-2) return vocIsBiz(brName) && (!route.biz || brName===route.biz);
  if(route.mgr===-1){
    if(_vocMode==='all') return true;
    if(_vocMode==='biz') return vocIsBiz(brName);
    return !vocIsBiz(brName);
  }
  if(vocIsBiz(brName)) return false;
  const o=vocBranchOwner(brName); return !!o && o.mi===route.mgr;
}
function vocDays(ymd){ return Math.floor((Date.now()-new Date(ymd+'T00:00:00').getTime())/864e5); }
function vocIsNoReply(x){ return !x.openDate && !x.replies.length && vocDays(x.date)>=VOC_NOREPLY_DAYS; }
// 상태 글자는 회신 시트 '상담진행여부' 값을 그대로 쓰고, 색만 성격별로 구분
function vocStClass(st){
  const t=String(st||'');
  if(t==='개설완료') return 's-open';
  if(t==='회신대기') return 's-wait';
  if(/불가|포기|거절|중단|취소/.test(t)) return 's-no';
  if(/부재|두절|보류|대기|연기/.test(t)) return 's-hold';
  return 's-talk';
}
function vocStBadge(st){
  const c=vocStClass(st);
  return `<span class="voc-st ${c}">${eschtml(st)}</span>`;
}
function vocPct(a,b){ return b? Math.round(a/b*1000)/10 : 0; }
function vocSet(k,v){ if(k==='year') _vocYear=+v; if(k==='br') _vocBr=v; if(k==='st') _vocStatus=v; renderVoc(); }

function renderVoc(){
  const modeNote = {fr:'가맹 본부만 · 사업부 제외', biz:'사업부(직영)만', all:'가맹 + 사업부 합계'}[_vocMode];
  const title = route.mgr===-1 ? `📊 개설 VOC 현황 — 전사 요약 <span style="font-size:13px;font-weight:400;color:var(--muted)">(${modeNote})</span>`
    : route.mgr===-2 ? `🏢 개설 VOC 현황 — 사업부(직영)${route.biz?' › '+eschtml(route.biz):''}`
    : `👤 ${DATA.managers[route.mgr].name} — 개설 VOC 현황`;
  if(!_vocData){
    app.innerHTML = `<h2 class="mgr">${title}</h2><div class="ic-empty">${_vocErr
      ? `VOC 데이터를 불러오지 못했습니다: <b>${eschtml(_vocErr)}</b>
        <div style="text-align:left;max-width:640px;margin:14px auto 0;font-size:13px;line-height:1.7">
        <b>원인 확인 방법</b> — 아래 링크를 새 창에서 열어 보세요.<br>
        ① <a href="${CLOUD_URL}?action=ping" target="_blank" rel="noopener">배포 버전 확인</a> → <code>"version":"voc-v3"</code>가 보이면 정상 배포, 메모 목록(<code>"store"</code>)이 보이면 <b>새 버전 배포가 안 된 것</b><br>
        ② <a href="${CLOUD_URL}?action=getVoc&nocache=1&apiKey=${encodeURIComponent(API_KEY)}" target="_blank" rel="noopener">VOC 직접 조회</a> → 오류 문구가 보이면 그 내용이 원인, 한참 뒤에 결과가 나오면 <b>데이터 계산이 느린 것</b>(캐시 트리거 설정으로 해결)
        </div><br><button class="ic-refresh" onclick="vocLoad(true)">↻ 다시 시도</button>`
      : 'VOC 데이터를 불러오는 중…'}</div>`;
    if(!_vocLoading && !_vocErr) vocLoad(false);
    return;
  }
  const D=_vocData;
  const years = Array.from(new Set(D.items.map(x=>+x.date.slice(0,4)))).sort((a,b)=>b-a);
  if(!years.length) years.push(D.detailFrom);
  if(!_vocYear || !years.includes(_vocYear)) _vocYear = years[0];
  const Y = String(_vocYear);
  const scoped = D.items.filter(x=>vocInScope(x.branch));
  const brAll = Array.from(new Set(scoped.map(x=>x.branch))).sort((a,b)=>a.localeCompare(b,'ko'));
  if(_vocBr && !brAll.includes(_vocBr)) _vocBr='';
  const inBr = x => !_vocBr || x.branch===_vocBr;
  const recv   = scoped.filter(x=>x.date.startsWith(Y) && inBr(x));
  const opened = scoped.filter(x=>x.openDate && x.openDate.startsWith(Y) && inBr(x));
  const replied = recv.filter(x=>x.replies.length || x.openDate).length;
  const noReply = recv.filter(vocIsNoReply);

  // 안내: 회신 시트 미연결 / 매니저와 연결 안 된 본부명
  let warn='';
  if(D.reply && !D.reply.linked) warn += `<div class="voc-warn">🔗 본부 회신 시트 미연결 — ${eschtml(D.reply.msg||'')}<br>연결 전까지 모든 건이 '회신대기'로 표시됩니다.</div>`;
  const um = (D.reply && D.reply.unmatched) || [];
  if(route.mgr===-1 && um.length) warn += `<div class="voc-warn">🔗 VOC 건과 연결하지 못한 본부 회신 ${um.length}건 — voc 시트의 이름·전달본부가 회신 시트와 같은지 확인해 주세요.<br>${um.slice(0,10).map(u=>`${u.date} ${eschtml(u.name)} (${eschtml(u.by)})`).join(' · ')}${um.length>10?' …':''}</div>`;
  const dupRecv = recv.filter(x=>x.dups&&x.dups.length);
  if(dupRecv.length) warn += `<div class="voc-warn">🔁 같은 전화번호로 다시 문의한 건 ${dupRecv.length}건 — 중복 접수인지, 다른 본부에 이미 전달됐는지 확인해 주세요.<br>${dupRecv.slice(0,10).map(x=>`${x.date} ${eschtml(x.name)} (${eschtml(x.branch)}) ← 이전 ${x.dups.map(d=>d.date+' '+eschtml(d.branch)).join(', ')}`).join('<br>')}${dupRecv.length>10?'<br>…':''}<br><a style="color:var(--pine);font-weight:700;cursor:pointer" onclick="vocSet('st','재문의')">재문의 건만 보기 ›</a></div>`;
  if(route.mgr===-1){
    const un = Array.from(new Set(D.items.map(x=>x.branch).filter(b=>!vocIsBiz(b) && !vocBranchOwner(b))));
    if(un.length) warn += `<div class="voc-warn">⚠️ 매니저와 연결되지 않은 전달본부명 ${un.length}개: <b>${un.map(eschtml).join(', ')}</b><br>voc 시트의 본부명을 대시보드 본부명(예: 경기안양)과 같게 맞추면 매니저 화면에도 집계됩니다.</div>`;
  }

  const kpi=(label,val,sub,color)=>`<div class="kpi" style="border-top-color:${color}"><div class="k-label">${label}</div><div class="k-val">${val}</div><div class="k-delta delta-flat">${sub}</div></div>`;
  const brOpts = [`<option value="">전체 ${route.mgr===-2||(route.mgr===-1&&_vocMode==='biz')?'사업부':(route.mgr===-1&&_vocMode==='all'?'본부·사업부':'본부')}</option>`].concat(brAll.map(b=>`<option value="${eschtml(b)}" ${_vocBr===b?'selected':''}>${eschtml(b)}</option>`)).join('');
  const stList = ['', ...Array.from(new Set(recv.map(x=>x.status))).sort((a,b)=>a.localeCompare(b,'ko')), '미회신', '재문의'];
  if(_vocStatus && !stList.includes(_vocStatus)) _vocStatus='';
  const stOpts = stList.map(s=>`<option value="${s}" ${_vocStatus===s?'selected':''}>${s||'전체 상태'}</option>`).join('');

  app.innerHTML = `
    <h2 class="mgr">${title}</h2>
    <div class="voc-bar">
      ${route.mgr===-1?`<div class="voc-seg">${['fr','biz','all'].map(m=>`<button class="${_vocMode===m?'on':''}" onclick="vocSetMode('${m}')">${VOC_MODE_LABEL[m]}</button>`).join('')}</div>`:''}
      <label>연도</label><select onchange="vocSet('year',this.value)">${years.map(y=>`<option ${y===_vocYear?'selected':''}>${y}</option>`).join('')}</select>
      <label>${route.mgr===-2||(route.mgr===-1&&_vocMode==='biz')?'사업부':'본부'}</label><select onchange="vocSet('br',this.value)">${brOpts}</select>
      <button class="ic-refresh" onclick="vocLoad(true)">↻ 새로고침</button>
      <span class="voc-upd">${_vocLoading?'불러오는 중…':`기준 ${eschtml(D.updated||'')}${D.cached?' (캐시)':''}${D.ms?` · 계산 ${(D.ms/1000).toFixed(1)}초`:''}`}</span>
    </div>
    ${warn}
    <div class="kpi-row voc-kpi">
      ${kpi(`${Y}년 접수`, fmtNum(recv.length)+'건', _vocBr||'범위 전체', 'var(--pine)')}
      ${kpi(`${Y}년 개설완료`, fmtNum(opened.length)+'건', '개설일자 기준', '#1f7a52')}
      ${kpi('개설율', vocPct(opened.length,recv.length)+'%', '개설 ÷ 접수', 'var(--amber)')}
      ${kpi('본부 회신율', vocPct(replied,recv.length)+'%', `${fmtNum(replied)}건 회신`, '#2b6cb0')}
      ${kpi('⚠️ 미회신', fmtNum(noReply.length)+'건', `${VOC_NOREPLY_DAYS}일 이상 경과`, 'var(--alert)')}
    </div>
    <div class="dash-grid2b">
      <div class="card-box"><h4>📅 연도별 접수 추이</h4><div class="trend-wrap"><canvas id="vocYearChart"></canvas></div>
        <p class="hint" style="margin-top:6px">${D.detailFrom}년 이전 자료는 접수 건수만 집계합니다.</p></div>
      <div class="card-box"><h4>📈 ${Y}년 월별 접수 · 개설 · 누적 개설율</h4><div class="trend-wrap"><canvas id="vocMonthChart"></canvas></div></div>
    </div>

        <div class="voc-bar" style="margin:0;padding:6px 10px"><label>상태</label><select onchange="vocSet('st',this.value)">${stOpts}</select></div>

function vocMatrixHtml(scoped, Y){
  // 본부 목록: 매니저 화면이면 담당 본부 전부, 전사면 자료가 있는 본부
  let brs = Array.from(new Set(scoped.filter(x=>x.date.startsWith(Y)||(x.openDate||'').startsWith(Y)).map(x=>x.branch)));
  if(route.mgr>=0) DATA.managers[route.mgr].branches.forEach(b=>{ if(!brs.some(n=>vocBranchOwner(n)&&vocBranchOwner(n).br===b.name)) brs.push(b.name); });
  if(_vocBr) brs = brs.filter(b=>b===_vocBr);
  const tot = {r:new Array(12).fill(0), o:new Array(12).fill(0), R:0, O:0, rep:0, nr:0};
  const rows = brs.map(br=>{
    const r=new Array(12).fill(0), o=new Array(12).fill(0);
    const rv = scoped.filter(x=>x.branch===br && x.date.startsWith(Y));
    const op = scoped.filter(x=>x.branch===br && (x.openDate||'').startsWith(Y));
    rv.forEach(x=>r[+x.date.slice(5,7)-1]++);
    op.forEach(x=>o[+x.openDate.slice(5,7)-1]++);
    const rep = rv.filter(x=>x.replies.length||x.openDate).length, nr = rv.filter(vocIsNoReply).length;
    r.forEach((v,i)=>{tot.r[i]+=v; tot.o[i]+=o[i];}); tot.R+=rv.length; tot.O+=op.length; tot.rep+=rep; tot.nr+=nr;
    const own = vocBranchOwner(br);
    return {br, mgr: vocIsBiz(br) ? '직영' : (own? DATA.managers[own.mi].name : '-'), r, o, R:rv.length, O:op.length, rep, nr};
  }).sort((a,b)=>b.R-a.R || a.br.localeCompare(b.br,'ko'));
  const cells=(r,o)=>r.map((v,i)=>`<td class="num">${v||'·'}${o[i]?`<span class="vo">개설${o[i]}</span>`:''}</td>`).join('');
  const showMgr = route.mgr===-1;
  const body = rows.map(x=>`<tr>
    <td class="voc-brlink" onclick="vocSet('br','${jsq(x.br)}')">${eschtml(x.br)}</td>${showMgr?`<td>${x.mgr}</td>`:''}
    ${cells(x.r,x.o)}<td class="num"><b>${x.R}</b></td><td class="num"><b style="color:#1f7a52">${x.O}</b></td>
    <td class="num">${vocPct(x.O,x.R)}%</td><td class="num">${vocPct(x.rep,x.R)}%</td>
    <td class="num">${x.nr?`<span class="voc-late">${x.nr}</span>`:'0'}</td></tr>`).join('');
  return `<table class="voc-mx"><thead><tr><th>본부</th>${showMgr?'<th>매니저</th>':''}
    ${['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'].map(l=>`<th>${l}</th>`).join('')}
    <th>접수</th><th>개설</th><th>개설율</th><th>회신율</th><th>미회신</th></tr></thead>
    <tbody>${body || `<tr><td colspan="${showMgr?19:18}" style="text-align:center;color:var(--muted);padding:16px">${Y}년 자료가 없습니다.</td></tr>`}
    ${rows.length>1?`<tr class="voc-tot"><td>합계</td>${showMgr?'<td></td>':''}${cells(tot.r,tot.o)}<td class="num">${tot.R}</td><td class="num">${tot.O}</td><td class="num">${vocPct(tot.O,tot.R)}%</td><td class="num">${vocPct(tot.rep,tot.R)}%</td><td class="num">${tot.nr}</td></tr>`:''}
    </tbody></table>`;
}
function vocRouteHtml(recv, opened){
  const m={};
  recv.forEach(x=>{ (m[x.route]=m[x.route]||{r:0,o:0}).r++; });
  opened.forEach(x=>{ (m[x.route]=m[x.route]||{r:0,o:0}).o++; });
  const rows=Object.entries(m).sort((a,b)=>b[1].r-a[1].r);
  if(!rows.length) return '<p class="hint">자료가 없습니다.</p>';
  return `<table class="voc-mx"><thead><tr><th>신청경로</th><th>접수</th><th>개설</th><th>개설율</th></tr></thead><tbody>
    ${rows.map(([k,v])=>`<tr><td>${eschtml(k)}</td><td class="num">${v.r}</td><td class="num">${v.o}</td><td class="num">${vocPct(v.o,v.r)}%</td></tr>`).join('')}</tbody></table>`;
}
function vocStatusHtml(recv){
  const c={};
  recv.forEach(x=>c[x.status]=(c[x.status]||0)+1);
  const order=Object.keys(c).sort((a,b)=>c[b]-c[a]);
  if(!order.length) return '<p class="hint">자료가 없습니다.</p>';
  const n=recv.length||1;
  return `<table class="voc-mx"><thead><tr><th>상태</th><th>건수</th><th>비율</th></tr></thead><tbody>
    ${order.map(s=>`<tr><td>${vocStBadge(s)}</td><td class="num">${c[s]||0}</td><td class="num">${vocPct(c[s]||0,n)}%</td></tr>`).join('')}</tbody></table>`;
}
function vocListHtml(recv){
  let list = recv;
  if(_vocStatus==='미회신') list = list.filter(vocIsNoReply);
  else if(_vocStatus==='재문의') list = list.filter(x=>x.dups&&x.dups.length);
  else if(_vocStatus) list = list.filter(x=>x.status===_vocStatus);
  if(!list.length) return '<p class="hint" style="margin-top:10px">해당하는 건이 없습니다.</p>';
  return `<div class="uni-kpi-wrap" style="margin-top:10px"><table class="voc-mx voc-list"><thead><tr>
    <th>접수일</th><th>이름</th><th>연락처</th><th>희망지역</th><th>희망유형</th><th>신청경로</th><th>전달본부</th><th>상태</th><th>최근 회신 / 개설</th></tr></thead><tbody>
    ${list.map(x=>`<tr onclick="vocOpenDetail('${x.id}')">
      <td>${x.date}</td><td><b>${eschtml(x.name)}</b>${x.dups&&x.dups.length?` <span class="voc-late" title="같은 번호 문의 ${x.dups.length}건">🔁재문의</span>`:''}</td><td>${x.phone4?'***-'+eschtml(x.phone4):'-'}</td>
      <td>${eschtml(x.region)}</td><td>${eschtml(x.type)}</td><td>${eschtml(x.route)}</td><td>${eschtml(x.branch)}</td>
      <td>${vocStBadge(x.status)}${vocIsNoReply(x)?` <span class="voc-late">${vocDays(x.date)}일 경과</span>`:''}</td>
      <td>${x.openDate?`<b style="color:#1f7a52">${x.openDate} ${eschtml(x.center)}</b>`:(x.lastReply||'-')}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function vocOpenDetail(id){
  const x = _vocData && _vocData.items.find(i=>i.id===id); if(!x) return;
  const tl = x.replies.length ? x.replies.map(r=>`<div class="voc-tl-item"><div class="h">${r.date||'-'} ${r.by?'· '+eschtml(r.by):''} ${vocStBadge(r.status)}</div>${eschtml(r.text||'(내용 없음)')}</div>`).join('')
    : '<div class="memo-empty">아직 본부 회신이 없습니다.</div>';

    <div class="dm-head"><div><div class="dm-name">${eschtml(x.name)} <span style="font-size:13px;color:var(--muted)">${x.phone4?'***-'+eschtml(x.phone4):''}</span></div>
      <div class="dm-sub">접수 ${x.date} · ${eschtml(x.route)} · 전달본부 ${eschtml(x.branch)}</div></div>
      <div class="dm-tags">${vocStBadge(x.status)}</div></div>
    <table class="dir-table" style="margin-bottom:14px">
      <tr><th>희망지역</th><td>${eschtml(x.region||'-')}</td></tr>
      <tr><th>희망유형</th><td>${eschtml(x.type||'-')}</td></tr>
      ${x.dups&&x.dups.length?`<tr><th>🔁 재문의</th><td><span class="voc-late">같은 번호로 ${x.dups.length}건 더 있음</span><br>${x.dups.map(d=>`${d.date} · ${eschtml(d.name)} · ${eschtml(d.branch)}`).join('<br>')}</td></tr>`:''}
      ${x.openDate?`<tr><th>개설</th><td><b style="color:#1f7a52">${x.openDate} · ${eschtml(x.center||'-')} (${eschtml(x.openType||'-')})</b> <span class="dir-sub">접수 후 ${Math.max(0,Math.round((new Date(x.openDate)-new Date(x.date))/864e5))}일</span></td></tr>`:''}
    </table>
    <div class="dm-memo-title">💬 본부 회신 이력 <span>(${x.replies.length}건)</span></div>
    <div class="voc-tl">${tl}</div>`;
  document.getElementById('centerModal').classList.add('show');

function vocDrawCharts(scoped, Y){
  if(typeof Chart==='undefined') return;
  _vocCharts.forEach(c=>c.destroy()); _vocCharts=[];
  // ① 연도별 접수(과거 연도 포함, 현재 범위·본부 필터 반영)
  const D=_vocData, ys=Object.keys(D.yearly).sort();
  const yv = ys.map(y=>Object.entries(D.yearly[y].byBranch).reduce((s,[b,n])=>s+((vocInScope(b)&&(!_vocBr||b===_vocBr))?n:0),0));
  const e1=document.getElementById('vocYearChart');
  if(e1) _vocCharts.push(new Chart(e1,{type:'bar',
    data:{labels:ys.map(y=>y+'년'),datasets:[{label:'접수',data:yv,backgroundColor:ys.map(y=>y===Y?'#2f5d50':'#9fbfb4')}]},
    plugins:[barValueLabelPlugin, unitLabelPlugin],
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:26}},
      scales:{y:{beginAtZero:true,suggestedMax:Math.max(1,...yv)*1.2,ticks:{precision:0,font:{size:10}},grid:{color:'#eef0ea'}},x:{grid:{display:false}}},
      plugins:{legend:{display:false},tooltip:{enabled:false},unitLabel:{text:'[단위: 건]'}}}}));
  // ② 선택 연도 월별 접수·개설 + 누적 개설율
  const inBr = x=>!_vocBr||x.branch===_vocBr;
  const r=new Array(12).fill(0), o=new Array(12).fill(0);
  scoped.filter(x=>x.date.startsWith(Y)&&inBr(x)).forEach(x=>r[+x.date.slice(5,7)-1]++);
  scoped.filter(x=>(x.openDate||'').startsWith(Y)&&inBr(x)).forEach(x=>o[+x.openDate.slice(5,7)-1]++);
  let cr=0, co=0; const cum = r.map((v,i)=>{ cr+=v; co+=o[i]; return cr? Math.round(co/cr*1000)/10 : null; });
  const lastM = String(new Date().getFullYear())===Y ? new Date().getMonth()+1 : 12;
  const labels = Array.from({length:12},(_,i)=>(i+1)+'월').slice(0,lastM);
  const e2=document.getElementById('vocMonthChart');
  if(e2) _vocCharts.push(new Chart(e2,{
    data:{labels,datasets:[
      {type:'bar',label:'접수',data:r.slice(0,lastM),backgroundColor:'#9fbfb4',yAxisID:'y'},
      {type:'bar',label:'개설',data:o.slice(0,lastM),backgroundColor:'#1f7a52',yAxisID:'y'},
      {type:'line',label:'누적 개설율',data:cum.slice(0,lastM),borderColor:'#b4762a',backgroundColor:'#b4762a',tension:.3,borderWidth:2,pointRadius:3,yAxisID:'y1',valueSuffix:'%',spanGaps:true}
    ]},
    plugins:[barValueLabelPlugin],
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:26}},
      scales:{y:{beginAtZero:true,suggestedMax:Math.max(1,...r)*1.25,ticks:{precision:0,font:{size:10}},grid:{color:'#eef0ea'},title:{display:true,text:'건'}},
        y1:{position:'right',beginAtZero:true,suggestedMax:Math.max(10,...cum.filter(v=>v!==null))*1.3,ticks:{callback:v=>v+'%',font:{size:10}},grid:{display:false}},
        x:{grid:{display:false}}},
      plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}},tooltip:{enabled:false}}}}));
}

/* ===== 홈 화면 집계 유틸 (실회원 · BM · 큐리매쓰) ===== */
function fmtNum(n){ return (n||0).toLocaleString('ko-KR'); }
// 영어 매출: 원본이 이미 천원 단위로 절삭되어 있음 — 나누지 않고 단위만 표기
function fmtEngWon(v){
  if(v===null||v===undefined) return '-';
  return fmtNum(v)+'천원';
}
// 큐리매쓰 매출: 원본이 원(₩) 단위 — 천원 미만 절삭 후 표기
function fmtCuriWon(v){
  if(v===null||v===undefined) return '-';
  return fmtNum(Math.floor(v/1000))+'천원';
}
function toWonK(v){ return (v===null||v===undefined) ? null : Math.floor(v/1000); } // 큐리매쓰 전용(원→천원)
function bmCategory(form){
  if(form==='학원(숲)') return '숲';
  if(form==='학원(IGSE)') return 'IGSE';
  return '우영'; // 학원(상가형)·교습소·공부방
}
// 전사 BM별 월별 실회원 합계
function bmMemberSeries(){
  const cats = {'전체':new Array(NMON).fill(0), '숲':new Array(NMON).fill(0), 'IGSE':new Array(NMON).fill(0), '우영':new Array(NMON).fill(0)};
  DATA.managers.forEach(m=>m.branches.forEach(b=>b.centers.forEach(c=>{
    const cat = bmCategory(c.form);
    for(let i=0;i<NMON;i++){ const v=c.mem[i]||0; cats['전체'][i]+=v; cats[cat][i]+=v; }
  })));
  return cats;
}

/* ===== 드릴다운 공통 유틸 (전국 → 매니저 → 본부/HQ하위그룹) =====
   scope.mgr : null(전국) | 매니저명 | 'HQ'(본사·큐리매쓰 전용, 실회원 대시보드에서만 의미있음)
   scope.br  : null/'합산' | 본부명 (또는 HQ일 때 본사 하위그룹명) */
function curiSubGroups(){
  const set = new Set(); CURI_DATA.forEach(r=>{ if(r.mgr==='본사' && r.sub) set.add(r.sub); });
  return Array.from(set);
}
function scopeBranchOptions(mgrName, forCuri){
  if(mgrName===null) return [];
  if(mgrName==='HQ') return curiSubGroups();
  const m = DATA.managers.find(x=>x.name===mgrName);
  if(m) return m.branches.map(b=>b.name);
  // 실제 매니저(학원·우영)가 아닌 큐리매쓰 전용 담당자(예: 정은희) — 담당 지역 목록
  const regions = new Set(CURI_DATA.filter(r=>r.mgr===mgrName).map(r=>r.region));
  return Array.from(regions).sort((a,b)=>a.localeCompare(b,'ko'));
}
function scopeLabel(scope){
  if(scope.mgr===null) return '전국';
  const mgrLabel = scope.mgr==='HQ' ? '본사(큐리매쓰)' : scope.mgr;
  const brLabel = (!scope.br || scope.br==='합산') ? '합산' : scope.br;
  return `${mgrLabel} · ${brLabel}`;
}
function renderScopePicker(scope, idPrefix, mgrChangeFn, brChangeFn, includeHQ){
  const mgrOpts = ['<option value="">전국</option>']
    .concat(DATA.managers.map(m=>`<option value="${m.name}" ${scope.mgr===m.name?'selected':''}>${m.name}</option>`));
  if(includeHQ) mgrOpts.push(`<option value="HQ" ${scope.mgr==='HQ'?'selected':''}>본사(큐리매쓰)</option>`);
  const brList = scopeBranchOptions(scope.mgr);
  const brOpts = ['<option value="">합산</option>'].concat(
    brList.map(n=>`<option value="${n}" ${scope.br===n?'selected':''}>${n}</option>`));
  return `

/* 막대 끝에 값 표시(툴팁 대신) — 차트별로 plugins:[barValueLabelPlugin] 로 등록 */
const barValueLabelPlugin = {
  id: 'barValueLabel',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((ds, dsIndex)=>{
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden || ds.hideValueLabel) return;
      const isLine = ds.type==='line';
      const suffix = ds.valueSuffix || '';
      meta.data.forEach((el, i)=>{
        const v = ds.data[i];
        if(v===null||v===undefined) return;
        ctx.save();
        ctx.fillStyle = isLine ? (ds.borderColor||'#c0392b') : '#1c2431';
        ctx.font = isLine ? 'bold 12px sans-serif' : '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(fmtNum(v)+suffix, el.x, el.y - (isLine?8:2));
        ctx.restore();
      });
    });
  }
};
// 차트 우측 상단에 "[단위: 명]"/"[단위: 천원]" 같은 단위 표기를 한 번만 그림
const unitLabelPlugin = {
  id: 'unitLabel',
  afterDraw(chart){
    const opt = chart.options.plugins && chart.options.plugins.unitLabel;
    if(!opt || !opt.text) return;
    const {ctx, chartArea} = chart;
    ctx.save();
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#8a8f85';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(opt.text, chartArea.right, chartArea.top - 10);
    ctx.restore();
  }
};

// 학원(숲+IGSE)/우영 센터수 — 정의: 폐업일 없는(=DATA에 존재하는) 센터 그대로 카운트
function kpiCenterCounts(scope){
  if(scope.mgr==='HQ') return {academy:0, op:0, total:0};
  let branchesToSum = [];
  if(scope.mgr===null){ DATA.managers.forEach(m=>branchesToSum.push(...m.branches)); }
  else {
    const m = DATA.managers.find(x=>x.name===scope.mgr);
    if(m){
      if(!scope.br || scope.br==='합산') branchesToSum = m.branches;
      else { const b=m.branches.find(x=>x.name===scope.br); if(b) branchesToSum=[b]; }
    }
  }
  let academy=0, op=0;
  branchesToSum.forEach(b=>b.centers.forEach(c=>{
    if(c.closed) return; // 해지 센터는 활동 센터수에서 제외
    if(bmCategory(c.form)==='우영') op++; else academy++;
  }));
  return {academy, op, total:academy+op};
}
// 큐리매쓰 센터수 — 정의: 센터명에 "(해지)"가 없는 CURI_DATA 행 개수
function kpiCuriCenterCount(scope){
  let n=0;
  CURI_DATA.forEach(r=>{
    let include=false;
    if(scope.mgr===null) include=true;
    else if(scope.mgr==='HQ'){ if(r.mgr==='본사') include = (!scope.br||scope.br==='합산') ? true : r.sub===scope.br; }
    else { if(r.mgr===scope.mgr) include = (!scope.br||scope.br==='합산') ? true : r.region===scope.br; }
    if(include && !r.center.includes('(해지)')) n++;
  });
  return n;
}

// 전월대비 작은 표시(숫자 아래) — 센터수는 월별 이력이 없어 대상 아님
function uniDelta(cur, prev){
  const d = cur-prev;
  if(d>0) return `<div class="uni-delta up">▲+${fmtNum(d)}</div>`;
  if(d<0) return `<div class="uni-delta down">▼${fmtNum(d)}</div>`;
  return `<div class="uni-delta flat">→0</div>`;
}
// 매출 전월대비(천원 단위로 표시)
// 영어 매출 전월대비(원본이 이미 천원 단위 — 나누지 않음)
function uniDeltaEngWon(cur, prev){
  const d = cur-prev;
  if(d>0) return `<div class="uni-delta up">▲+${fmtNum(d)}천원</div>`;
  if(d<0) return `<div class="uni-delta down">▼${fmtNum(d)}천원</div>`;
  return `<div class="uni-delta flat">→0</div>`;
}
// 큐리매쓰 매출 전월대비(원본이 원 단위 — 천원으로 나눠서 표시)
function uniDeltaCuriWon(cur, prev){
  const d = Math.floor(cur/1000) - Math.floor(prev/1000);
  if(d>0) return `<div class="uni-delta up">▲+${fmtNum(d)}천원</div>`;
  if(d<0) return `<div class="uni-delta down">▼${fmtNum(d)}천원</div>`;
  return `<div class="uni-delta flat">→0</div>`;
}

   - 영어: 실제 DATA 브랜치를 그대로 참조(데이터 이동 없음). 보고서가

const HQ_ENG_REGIONS = [
  {mgr:'김혜림', br:'서울양천', label:'서울양천(김혜림)'},
  {mgr:'윤길한', br:'수원영통', label:'수원영통(윤길한)'},
  {mgr:'황성연', br:'전남순천', label:'전남순천(황성연)'},
  {mgr:'황지애', brs:['직영학원','우영직영본부','울산(직영우본)'], label:'황지애(직영, 울산)'}
];
function curiRegionsByManager(){
  const map = {};
  CURI_DATA.forEach(r=>{
    if(r.mgr==='본사') return;
    map[r.mgr] = map[r.mgr] || new Set();
    map[r.mgr].add(r.region);
  });
  const out = {};
  Object.keys(map).forEach(k=> out[k] = Array.from(map[k]).sort((a,b)=>a.localeCompare(b,'ko')));
  return out;
}
function curiHqSubGroupsSorted(){
  return Array.from(new Set(CURI_DATA.filter(r=>r.mgr==='본사').map(r=>r.sub))).sort((a,b)=>a.localeCompare(b,'ko'));
}
function hqTabsHtml(section){

// 표 위에 미러 스크롤바 추가(아래로 안 내려도 위에서 가로 스크롤 가능하게)
function setupTopScrollSync(topId, mainId){
  setTimeout(()=>{
    const top = document.getElementById(topId);
    const main = document.getElementById(mainId);
    if(!top || !main) return;
    const table = main.querySelector('table');
    if(!table) return;
    const inner = top.firstElementChild;
    if(inner) inner.style.width = table.scrollWidth + 'px';
    let syncing = false;
    top.onscroll = () => { if(syncing) return; syncing=true; main.scrollLeft = top.scrollLeft; syncing=false; };
    main.onscroll = () => { if(syncing) return; syncing=true; top.scrollLeft = main.scrollLeft; syncing=false; };
  }, 0);
}
let _curiListExpanded = {};
function toggleCuriListExpand(key){
  _curiListExpanded[key] = !_curiListExpanded[key];
  render();
}
function curiRegionAgg(mgr, region){
  const mem = new Array(NMON).fill(0), rev = new Array(NMON).fill(0);
  CURI_DATA.forEach(r=>{
    const match = mgr==='본사' ? (r.mgr==='본사' && r.sub===region) : (r.mgr===mgr && r.region===region);
    if(!match || r.center.includes('(해지)')) return;
    for(let i=0;i<NMON;i++){ mem[i]+=(r.mem[i]||0); rev[i]+=(r.workbook[i]||0)+(r.textbook[i]||0); }
  });
  return {mem, rev};
}
function curiRegionRowsHtml(mgrName, region){
  const key = mgrName+'::'+region;
  const exp = _curiListExpanded[key];
  const agg = curiRegionAgg(mgrName, region);
  const cells = agg.mem.map((v,i)=>`<td class="num curi-cell mem-cell">${fmtNum(v)}명</td><td class="num curi-cell">${fmtCuriWon(agg.rev[i])}</td>`).join('');
  let html = `<tr class="uni-row-main"><td class="uni-row-label" onclick="toggleCuriListExpand('${jsq(key)}')"><span class="uni-arrow">${exp?'▾':'▸'}</span> ${region}</td>${cells}</tr>`;
  if(exp){
    const rows = CURI_DATA.filter(r=>(mgrName==='본사' ? (r.mgr==='본사'&&r.sub===region) : (r.mgr===mgrName&&r.region===region)) && !r.center.includes('(해지)'));
    rows.forEach(r=>{
      const cells2 = r.mem.map((v,i)=>`<td class="num curi-cell mem-cell">${v===null?'-':v}명</td><td class="num curi-cell">${fmtCuriWon((r.workbook[i]||0)+(r.textbook[i]||0))}</td>`).join('');
      html += `<tr class="uni-row-sub"><td class="uni-row-sublabel">└ ${r.center}</td>${cells2}</tr>`;
    });
  }
  return html;
}
function renderHqCuriList(){

      <table class="uni-kpi-table2">

          <tr><th rowspan="2" class="uni-corner">구분</th>${CURI_MONTHS.map(l=>`<th colspan="2" class="grp-curi">${l}</th>`).join('')}</tr>
          <tr>${CURI_MONTHS.map(()=>`<th class="num curi-cell">실회원</th><th class="num curi-cell">매출</th>`).join('')}</tr>

/* ===== 큐리매쓰 센터 메모 (기존 메모 저장소·모달을 그대로 재사용, 별도 네임스페이스) =====

function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
let _curiModalCtx = null;
function openCuriMemo(mgrLabel, region, center, idx){
  _curiModalCtx = {mgr:mgrLabel, region, center, idx};

function renderCuriMemoBody(mgrLabel, region, center){
  return `
    <div class="dm-head">
      <div><div class="dm-name">${center}</div>
      <div class="dm-sub">큐리매쓰 · ${region} · 담당 ${mgrLabel}</div></div>

function submitCuriMemo(){
  if(!_curiModalCtx) return;
  const dEl=document.getElementById('curiMemoDate'), tEl=document.getElementById('curiMemoText');
  const br = '큐리매쓰:'+_curiModalCtx.region;
  if(addMemoLog(_curiModalCtx.mgr, br, _curiModalCtx.center, dEl.value, tEl.value)){
    tEl.value=''; renderCuriMemoLog(); tEl.focus();
    const badge = document.getElementById('curimemobadge-'+_curiModalCtx.idx);
    if(badge){ const n=memoCount(_curiModalCtx.mgr, br, _curiModalCtx.center); badge.textContent = n?`📝${n}`:''; }
  }
}
function renderCuriMemoLog(){
  if(!_curiModalCtx) return;
  const br = '큐리매쓰:'+_curiModalCtx.region;
  const log = getMemoLog(_curiModalCtx.mgr, br, _curiModalCtx.center)
    .slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.ts-b.ts);
  const el = document.getElementById('curiMemoLog');
  const cnt = document.getElementById('curiMemoCnt');
  if(cnt) cnt.textContent = log.length?`(${log.length}건)`:'(0건)';
  if(!log.length){ el.innerHTML = '<div class="memo-empty">아직 메모가 없습니다. 날짜와 내용을 입력해 추가하세요.</div>'; return; }
  el.innerHTML = log.map(x=>`<div class="memo-item">
    <div class="memo-item-date">${x.date||'-'}</div>
    <div class="memo-item-text">${eschtml(x.text)}</div>
    <button class="memo-del" title="삭제" onclick="removeCuriMemo(${x.ts})">✕</button>
  </div>`).join('');
}
function removeCuriMemo(ts){
  if(!_curiModalCtx) return;
  const br = '큐리매쓰:'+_curiModalCtx.region;
  deleteMemoLog(_curiModalCtx.mgr, br, _curiModalCtx.center, ts);
  renderCuriMemoLog();
